name: release

# Builds and publishes a GitHub release on one of two channels
# (docs/notes/release-channels-handoff.md): version from conventional commits since the
# last stable vX.Y.Z tag (scripts/next-version.sh), assets from `make package`, tag +
# `gh release create` by scripts/release.sh (idempotent, so a failed run can simply be
# re-run).
#
#   push to main       tip: a prerelease vX.Y.Z-tip.N (X.Y.Z the stable this commit would
#                      become, N the first-parent commits since the last stable), then the
#                      tip releases beyond the newest five are deleted with their tags.
#                      HEAD already tagged stable: nothing to publish.
#   workflow_dispatch  channel=stable (default; `make promote`) tags the head of main
#                      vX.Y.Z as a full release. channel=tip publishes a tip by hand.
#
# Automatic releases are ON (docs/notes/phase3d-packaging.md, "Enabling automatic
# releases"). The repository variable RELEASE_ENABLED gates both the push trigger and
# manual runs; set it to anything but "true" to pause releases.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "stable: a full release (promotion). tip: a vX.Y.Z-tip.N prerelease."
        type: choice
        options: [stable, tip]
        default: stable
      version:
        description: "Release version (vX.Y.Z, or vX.Y.Z-tip.N on tip). Empty: next version from conventional commits."
        required: false
        default: ""

permissions:
  contents: write # tag push, gh release create and delete with GITHUB_TOKEN

# Two merges in quick succession must not compute the same version; queue, never cancel
# a release half-way. GitHub keeps one pending run per group: a newer queued run cancels
# an older pending one (a skipped tip number, or a pending promotion to re-dispatch).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    # Apple silicon: the assets are darwin-arm64.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: next-version.sh reads commits since the last tag.
          fetch-depth: 0
          fetch-tags: true

      # Same setup as ci.yml.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Go bakes the pkg-config link path of libghostty-vt into compiled cgo packages
          # without keying on it, so key the build cache on the library pins as well.
          cache-dependency-path: |
            go.sum
            scripts/ghostty-vt.sh

      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gui/frontend/pnpm-lock.yaml

      - name: libghostty-vt cache key
        id: ghostty-vt
        run: echo "key=$(./scripts/ghostty-vt.sh --print-key)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: third_party/ghostty-vt
          key: ${{ runner.os }}-${{ steps.ghostty-vt.outputs.key }}

      - run: make ghostty-vt

      # wails3 builds the GUI bundle. Built with the module's toolchain (go1.26), which
      # setup-go put on PATH via the go.mod toolchain directive.
      - name: Install wails3
        run: |
          GOTOOLCHAIN="$(go mod edit -json | jq -r '.Toolchain // ("go" + .Go)')" \
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Pushes publish tips; dispatches default to stable.
          CHANNEL: ${{ github.event_name == 'push' && 'tip' || inputs.channel }}
          VERSION: ${{ inputs.version }}
          CODE_FOUNDRY_RELEASE_REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Empty VERSION: next-version.sh decides, and exits without releasing when
          # nothing changed since the last stable tag.
          scripts/release.sh --channel "$CHANNEL" ${VERSION:+"$VERSION"}

      # Keep the five newest tip releases; older ones go with their tags. Stables and
      # other prereleases are never touched.
      - name: Prune tip releases
        if: github.event_name == 'push' || inputs.channel == 'tip'
        shell: bash # -eo pipefail: a failed listing fails the step
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release list --repo "$REPO" --exclude-drafts --limit 200 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-tip\\.[0-9]+$")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do
              echo "deleting tip release $tag"
              gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes
            done
