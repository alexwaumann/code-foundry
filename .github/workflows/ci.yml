name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS only: the gui package links Wails (cgo + WebKit), and the product is macOS-only.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the `toolchain` directive (go1.26.x) from go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Go bakes the pkg-config link path of libghostty-vt into compiled cgo packages
          # without keying on it, so key the build cache on the library pins as well.
          cache-dependency-path: |
            go.sum
            scripts/ghostty-vt.sh

      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gui/frontend/pnpm-lock.yaml

      # libghostty-vt (static) from the pinned ghostty commit with zig 0.16.0, cached on
      # both pins. The .pc files hardcode the absolute prefix, which is stable on runners.
      # A cold build downloads zig and the ghostty source and takes about a minute.
      - name: libghostty-vt cache key
        id: ghostty-vt
        run: echo "key=$(./scripts/ghostty-vt.sh --print-key)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: third_party/ghostty-vt
          key: ${{ runner.os }}-${{ steps.ghostty-vt.outputs.key }}

      - run: make ghostty-vt

      # go vet + staticcheck + go test -race, then frontend typecheck + lint + test.
      # Generated code (buf, Wails bindings) is committed, so neither buf nor wails3 is needed.
      - run: make check
