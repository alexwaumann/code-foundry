name: ci

# Two different things under one name (docs/notes/ci-rethink.md):
#
#   pull_request   One job, `attested`. It is green when the head commit carries a
#                  "local-check" status naming its tree (posted by `make attest` after a
#                  green `make check`), red otherwise. The suite does not run here: the
#                  product is macOS-only and the same suite already ran on a Mac. There is
#                  no fallback run; a red `attested` means run `make check` and
#                  `make attest`.
#   push to main   The sweep: go-test, go-lint (macOS) and frontend (Linux) on the merged
#                  tree. Runs queue instead of cancelling, so a run always finishes and
#                  the next one covers every merge that landed meanwhile. A green sweep
#                  starts the tip release (release.yml). A red one opens or updates the
#                  one "main-red" issue, which the next green sweep closes (`report`).
#   manual         `gh workflow run ci.yml --ref <branch>` runs the sweep's jobs on any
#                  branch, for a clean-machine run on request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

# A pull request's newer push replaces its older run. On main nothing is cancelled
# mid-run: GitHub keeps one running and one pending run per group, and a newer pending
# run replaces an older pending one, whose commits the newer run's tree includes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  attested:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR head itself, not the merge commit: the attestation names its tree.
          ref: ${{ github.event.pull_request.head.sha }}
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          attested="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" \
            --jq '[.statuses[] | select(.context == "local-check" and .state == "success") | .description] | first // ""')"
          if [ "$attested" = "tree $tree" ]; then
            echo "::notice::$SHA was checked locally (make attest, tree $tree)."
          else
            echo "::error::no local-check attestation for tree $tree (found: '${attested:-none}'). Run \`make check\`, push, then \`make attest\`; it re-runs this job."
            exit 1
          fi

  go-test:
    if: github.event_name != 'pull_request'
    # macOS only: the gui package links Wails (cgo + WebKit), and the product is macOS-only.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-ghostty
      - run: make go-test

  go-lint:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-ghostty
      - run: make go-lint

  frontend:
    if: github.event_name != 'pull_request'
    # Nothing in the frontend checks is macOS-specific; Linux runners start in seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Bun installs the frontend's packages and type checks (bun check); Node runs Vite,
      # Vitest and Playwright, which keep their node shebangs under `bun run`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('gui/frontend/bun.lock') }}
      # typecheck + lint + vitest. Generated code is committed, so no buf or wails3.
      - run: make frontend-check

  # The sweep's result as one issue (scripts/sweep-report.sh): opened when main goes red,
  # commented on while it stays red, closed when it is green again. Never part of the
  # run's result: a report that fails must not hold back the tip of a green sweep.
  report:
    if: always() && github.event_name == 'push'
    needs: [go-test, go-lint, frontend]
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: go-test=${{ needs.go-test.result }} go-lint=${{ needs.go-lint.result }} frontend=${{ needs.frontend.result }}
        run: scripts/sweep-report.sh
