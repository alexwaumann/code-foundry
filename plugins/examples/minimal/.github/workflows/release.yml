# Publishes a release when a tag v<version> is pushed: make release (scripts/release.sh,
# the same steps a release by hand runs) checks the tag against plugin.json's version,
# tests, builds the darwin/arm64 and darwin/amd64 tarballs (make dist), attaches them and
# SHA256SUMS to a GitHub release and prints the registry entry. runs-on as in ci.yml.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release
