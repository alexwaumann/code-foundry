# Shared fragments. queries.go appends to each query exactly the fragments it references,
# transitively (GitHub rejects documents with unused fragments). The poll query is built
# in poll_query.go from these fragments.

fragment RateLimitFields on RateLimit {
  limit
  cost
  remaining
  resetAt
}

fragment ViewerFields on User {
  id
  login
  name
  avatarUrl
  url
}

# Per-state check counts. The aggregates count the whole connection, so a commit with
# 100+ checks costs no more than one with none, and no first: is needed.
fragment RollupCounts on StatusCheckRollupContextConnection {
  checkRunCount
  checkRunCountsByState { state count }
  statusContextCount
  statusContextCountsByState { state count }
}

fragment RollupFingerprint on StatusCheckRollup {
  state
  contexts { ...RollupCounts }
}

fragment CheckContexts on StatusCheckRollupContextConnection {
  ...RollupCounts
  pageInfo { hasNextPage endCursor }
  nodes {
    __typename
    ... on CheckRun {
      name
      status
      conclusion
      detailsUrl
      startedAt
      completedAt
      checkSuite { workflowRun { workflow { name } } }
    }
    ... on StatusContext {
      context
      state
      targetUrl
      description
      createdAt
    }
  }
}

# What the poll selects for every pull request in the viewer's lists and on watched
# branches: enough to tell whether it changed. Measured ~11ms of server time per PR
# (2026-10, 91 busy PRs). reviewDecision is not here: it alone costs ~40-60ms per PR,
# and a review bumps updatedAt anyway. PullRequest.statusCheckRollup is the head
# commit's rollup (no commits(last: 1) connection needed).
fragment PullRequestIdentity on PullRequest {
  id
  number
  updatedAt
  state
  headRefOid
  isCrossRepository
  author { login }
  repository { nameWithOwner }
}

fragment PullRequestFingerprint on PullRequest {
  ...PullRequestIdentity
  statusCheckRollup { ...RollupFingerprint }
}

# A pull request's display fields, for closed and merged ones (and the base of the open
# detail). ~40ms per PR.
fragment PullRequestSummary on PullRequest {
  id
  number
  title
  url
  state
  isDraft
  createdAt
  updatedAt
  mergedAt
  author { login }
  repository { nameWithOwner }
  headRefName
  headRefOid
  baseRefName
  isCrossRepository
  additions
  deletions
  changedFiles
  statusCheckRollup { ...RollupFingerprint }
}

# Everything the store keeps about an open pull request. Fetched only when the poll's
# fingerprint changed. ~300ms of server time per PR on busy repositories, dominated by
# mergeStateStatus (~150ms) and reviewDecision (~60ms), so detail requests are small
# (DefaultDetailBatch).
fragment PullRequestDetail on PullRequest {
  ...PullRequestSummary
  headRepository { nameWithOwner }
  reviewDecision
  mergeable
  mergeStateStatus
  totalCommentsCount
  reviews { totalCount }
  latestReviews(first: 10) {
    nodes { author { login } state submittedAt }
  }
  reviewRequests(first: 10) {
    nodes {
      requestedReviewer {
        __typename
        ... on User { login }
        ... on Bot { login }
        ... on Mannequin { login }
        ... on Team { slug organization { login } }
      }
    }
  }
}

# A repository's default branch head commit with its check counts (the poll), or with
# the first page of its checks (DefaultBranchChecks).
fragment DefaultBranchFingerprint on Repository {
  defaultBranchRef {
    name
    target {
      ... on Commit {
        oid
        committedDate
        messageHeadline
        statusCheckRollup { ...RollupFingerprint }
      }
    }
  }
}
