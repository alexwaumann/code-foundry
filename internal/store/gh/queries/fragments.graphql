# Shared fragments. queries.go appends to each query exactly the fragments it references,
# transitively (GitHub rejects documents with unused fragments).

fragment RateLimitFields on RateLimit {
  limit
  cost
  remaining
  resetAt
}

# Fields cheap enough for the list query. Measured on ghostty-org/ghostty (~300 open
# PRs) at 100 PRs per page: mergeStateStatus alone exceeds GitHub's 10s GraphQL timeout
# (HTTP 502) and headRepository adds ~3s, so both live only in pull_request.graphql.
fragment PullRequestFields on PullRequest {
  number
  title
  url
  updatedAt
  isDraft
  isCrossRepository
  author { login }
  headRefName
  headRefOid
  baseRefName
  reviewDecision
  mergeable
}

fragment RollupCounts on StatusCheckRollupContextConnection {
  checkRunCount
  checkRunCountsByState { state count }
  statusContextCount
  statusContextCountsByState { state count }
}

fragment CheckContexts on StatusCheckRollupContextConnection {
  ...RollupCounts
  pageInfo { hasNextPage endCursor }
  nodes {
    __typename
    ... on CheckRun {
      name
      status
      conclusion
      detailsUrl
      startedAt
      completedAt
      checkSuite { workflowRun { workflow { name } } }
    }
    ... on StatusContext {
      context
      state
      targetUrl
      description
      createdAt
    }
  }
}

# Phase 3a. A pull request found by search or by head branch (any repository): cheap
# identity fields only. reviewDecision and the check counts dominate server time, so
# they are a separate fragment that only the open-PR lists select.
fragment PullRequestSummary on PullRequest {
  number
  title
  url
  state
  isDraft
  createdAt
  updatedAt
  mergedAt
  author { login }
  repository { nameWithOwner }
  headRefName
  headRefOid
  baseRefName
  isCrossRepository
}

fragment PullRequestReview on PullRequest {
  reviewDecision
  commits(last: 1) {
    nodes {
      commit {
        oid
        statusCheckRollup {
          state
          contexts { ...RollupCounts }
        }
      }
    }
  }
}

# The default branch's head commit with its checks: the first page of contexts. Later
# pages come from checks.graphql with the commit's oid.
fragment DefaultBranchFields on Repository {
  defaultBranchRef {
    name
    target {
      ... on Commit {
        oid
        committedDate
        messageHeadline
        statusCheckRollup {
          state
          contexts(first: 100) { ...CheckContexts }
        }
      }
    }
  }
}
