# Shared fragments. queries.go appends to each query exactly the fragments it references,
# transitively (GitHub rejects documents with unused fragments).

fragment RateLimitFields on RateLimit {
  limit
  cost
  remaining
  resetAt
}

# Fields cheap enough for the list query. Measured on ghostty-org/ghostty (~300 open
# PRs) at 100 PRs per page: mergeStateStatus alone exceeds GitHub's 10s GraphQL timeout
# (HTTP 502) and headRepository adds ~3s, so both live only in pull_request.graphql.
fragment PullRequestFields on PullRequest {
  number
  title
  url
  updatedAt
  isDraft
  isCrossRepository
  author { login }
  headRefName
  headRefOid
  baseRefName
  reviewDecision
  mergeable
}

fragment RollupCounts on StatusCheckRollupContextConnection {
  checkRunCount
  checkRunCountsByState { state count }
  statusContextCount
  statusContextCountsByState { state count }
}

fragment CheckContexts on StatusCheckRollupContextConnection {
  ...RollupCounts
  pageInfo { hasNextPage endCursor }
  nodes {
    __typename
    ... on CheckRun {
      name
      status
      conclusion
      detailsUrl
      startedAt
      completedAt
      checkSuite { workflowRun { workflow { name } } }
    }
    ... on StatusContext {
      context
      state
      targetUrl
      description
      createdAt
    }
  }
}
