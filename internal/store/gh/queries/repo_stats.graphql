# One repository's monthly activity for the viewer: commits on the default branch
# authored by the viewer (history filtered by author id, the same commits REST
# search/commits counts) and pull requests the viewer authored that were merged, for
# this month and last. Polled every 15 minutes per tracked repository.
query RepoStats(
  $owner: String!
  $name: String!
  $author: ID!
  $thisStart: GitTimestamp!
  $lastStart: GitTimestamp!
  $mergedThis: String!
  $mergedLast: String!
) {
  rateLimit { ...RateLimitFields }
  repository(owner: $owner, name: $name) {
    defaultBranchRef {
      name
      target {
        ... on Commit {
          thisMonth: history(author: { id: $author }, since: $thisStart) { totalCount }
          lastMonth: history(author: { id: $author }, since: $lastStart, until: $thisStart) { totalCount }
        }
      }
    }
  }
  mergedThis: search(query: $mergedThis, type: ISSUE, first: 0) { issueCount }
  mergedLast: search(query: $mergedLast, type: ISSUE, first: 0) { issueCount }
}
