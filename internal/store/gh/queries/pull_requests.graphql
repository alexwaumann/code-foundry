# One page of a repository's open pull requests, most recently updated first, each with
# check counts for its head commit. Counts come from the *CountsByState aggregates, so a
# PR with 100+ checks costs no more than one with none. Polled every 60s per tracked repo.
# Server time is ~95ms per PR (the check counts and reviewDecision dominate), so pages are
# small (DefaultPageSize = 25, ~2.6s) to stay well under GitHub's 10s timeout.
query PullRequests($owner: String!, $name: String!, $first: Int!, $after: String) {
  rateLimit { ...RateLimitFields }
  repository(owner: $owner, name: $name) {
    pullRequests(
      states: [OPEN]
      first: $first
      after: $after
      orderBy: { field: UPDATED_AT, direction: DESC }
    ) {
      totalCount
      pageInfo { hasNextPage endCursor }
      nodes {
        ...PullRequestFields
        commits(last: 1) {
          nodes {
            commit {
              oid
              statusCheckRollup {
                state
                contexts { ...RollupCounts }
              }
            }
          }
        }
      }
    }
  }
}
