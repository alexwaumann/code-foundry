# Pull requests matching a GitHub search, for the viewer dashboards (open PRs authored by
# the viewer, PRs awaiting the viewer's review, PRs merged recently involving the
# viewer). $type is ISSUE, or ISSUE_ADVANCED for queries with OR and parentheses.
# $withReview adds reviewDecision and check counts (~100ms per PR of server time; only
# the open lists ask for them). Polled every 2 minutes, one request per section.
query SearchPullRequests($q: String!, $type: SearchType!, $first: Int!, $withReview: Boolean!) {
  rateLimit { ...RateLimitFields }
  search(query: $q, type: $type, first: $first) {
    issueCount
    nodes {
      __typename
      ...PullRequestSummary
      ...PullRequestReview @include(if: $withReview)
    }
  }
}
