# The checks on whatever commit a ref (branch, tag, or SHA) resolves to: the check pages
# after the first of a pull request detail (pr_detail.go) and of a failing
# default-branch CI (poll.go).
query Checks($owner: String!, $name: String!, $ref: String!, $after: String) {
  rateLimit { ...RateLimitFields }
  repository(owner: $owner, name: $name) {
    object(expression: $ref) {
      ... on Commit {
        oid
        statusCheckRollup {
          state
          contexts(first: 100, after: $after) { ...CheckContexts }
        }
      }
    }
  }
}
