<title>Mismatched tag</title>

<script src="/cf/jsx.js"></script>
<body class="text-body">
<div id="root"></div>

  import { createRoot } from "react-dom/client";
  function App() {
    return (
      <div>
        <b>bold</div>
      </div>
    );
  }
  createRoot(document.getElementById("root")!).render(<App />);
