<!doctype html>
<meta charset="utf-8">
<title>Thread board</title>
<link rel="stylesheet" href="/cf/theme.css">
<link rel="stylesheet" href="/cf/ui.css">
<script src="/cf/bridge.js"></script>
<script src="/cf/jsx.js"></script>
<body class="text-body">
<div id="root"></div>
<script type="text/tsx">
  // A React page with @cf/ui (docs/notes/page-library.md): a Card with Tabs, a Table of the
  // threads from the bridge, a Dialog per row, lucide icons; e2e/page-library.spec.ts.
  import { useEffect, useState } from "react";
  import { createRoot } from "react-dom/client";
  import { Badge, Button, Card, CardContent, CardDescription, CardHeader, CardTitle, Dialog, DialogContent, DialogDescription,
    DialogFooter, DialogHeader, DialogTitle, Table, TableBody, TableCell, TableHead, TableHeader, TableRow, Tabs, TabsContent,
    TabsList, TabsTrigger } from "@cf/ui";
  import { Info, LayoutList } from "@cf/icons";

  await cf.ready;

  type Thread = { id: string; name: string; status: string; archivedAtMs: number | null };

  function App() {
    const [threads, setThreads] = useState<Thread[]>([]);
    const [open, setOpen] = useState<Thread | null>(null);
    const [error, setError] = useState("");
    useEffect(() => cf.on("thread-list", (t: Thread[]) => setThreads(t), (e) => setError(e.message)), []);
    const live = threads.filter((t) => !t.archivedAtMs).sort((a, b) => a.id.localeCompare(b.id));
    return (
      <div className="min-h-[420px] p-3">
        <Card>
          <CardHeader>
            <CardTitle className="flex items-center gap-2"><LayoutList data-testid="icon" className="size-4 text-cf-accent" /> Threads</CardTitle>
            <CardDescription data-testid="count">{live.length} open</CardDescription>
          </CardHeader>
          <CardContent>
            {error && <p className="text-cf-error-text">{error}</p>}
            <Tabs defaultValue="table">
              <TabsList><TabsTrigger value="table">Table</TabsTrigger><TabsTrigger value="about">About</TabsTrigger></TabsList>
              <TabsContent value="table">
                <Table>
                  <TableHeader><TableRow><TableHead>Thread</TableHead><TableHead>Status</TableHead><TableHead /></TableRow></TableHeader>
                  <TableBody>
                    {live.slice(0, 4).map((t) => (
                      <TableRow key={t.id}>
                        <TableCell className="max-w-64 truncate">{t.name}</TableCell>
                        <TableCell><Badge variant="secondary">{t.status}</Badge></TableCell>
                        <TableCell className="text-right">
                          <Button size="sm" variant="outline" onClick={() => setOpen(t)}><Info /> Details</Button>
                        </TableCell>
                      </TableRow>
                    ))}
                  </TableBody>
                </Table>
              </TabsContent>
              <TabsContent value="about"><p data-testid="about" className="text-caption">Built with @cf/ui in the page.</p></TabsContent>
            </Tabs>
          </CardContent>
        </Card>
        <Dialog open={open !== null} onOpenChange={(o) => { if (!o) setOpen(null); }}>
          <DialogContent className="flex max-w-md flex-col gap-4 p-5">
            <DialogHeader><DialogTitle>{open?.name}</DialogTitle><DialogDescription>Status: {open?.status}</DialogDescription></DialogHeader>
            <DialogFooter><Button onClick={() => setOpen(null)}>Close</Button></DialogFooter>
          </DialogContent>
        </Dialog>
      </div>
    );
  }

  createRoot(document.getElementById("root")!).render(<App />);
</script>
