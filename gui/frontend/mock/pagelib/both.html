<!doctype html>
<meta charset="utf-8">
<title>ui.css and the runtime</title>
<link rel="stylesheet" href="/cf/theme.css">
<link rel="stylesheet" href="/cf/ui.css">
<script src="/cf/bridge.js"></script>
<script src="/cf/tailwind.js"></script>
<script src="/cf/jsx.js"></script>
<body class="text-body">
<div id="root"></div>
<script type="text/tsx">
  // ui.css with /cf/tailwind.js: the components keep the theme's border colour
  // (docs/notes/page-library-fixes-a.md); e2e/page-library.spec.ts.
  import { createRoot } from "react-dom/client";
  import { Card, CardContent } from "@cf/ui";
  createRoot(document.getElementById("root")!).render(
    <Card className="m-3 w-[260px]">
      <CardContent>A card, 260px wide from the runtime.</CardContent>
      <span data-testid="ref-border" style={{ color: "var(--cf-border)" }} />
    </Card>,
  );
</script>
