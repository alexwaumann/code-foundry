<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bridge check</title>
<link rel="stylesheet" href="/cf/theme.css">
<script src="/cf/bridge.js"></script>
<style>
body { margin: 0; padding: 18px 22px; background: var(--cf-surface-raised); color: var(--cf-text); font: 13px/1.45 system-ui, sans-serif; }
h1 { margin: 0 0 2px; font-size: 16px; font-weight: 600; }
p.sub { margin: 0 0 12px; color: var(--cf-text-muted); }
.grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; align-items: center; }
.k { color: var(--cf-text-muted); }
button { background: var(--cf-surface); color: var(--cf-text); border: 1px solid var(--cf-border); border-radius: 6px; padding: 3px 10px; font: inherit; cursor: pointer; }
button.primary { background: var(--cf-accent); color: var(--cf-accent-foreground); border-color: transparent; }
input { background: var(--cf-surface); color: var(--cf-text); border: 1px solid var(--cf-border); border-radius: 6px; padding: 3px 6px; font: inherit; }
.out { font-family: ui-monospace, monospace; font-size: 12px; }
.ok { color: var(--cf-success-text); }
.err { color: var(--cf-error-text); }
</style>
</head>
<body>
<h1>Bridge check</h1>
<p class="sub">Shown in <b id="thread">…</b> · <span id="theme">?</span> theme · visit <span id="visits">0</span></p>
<div class="grid">
  <span class="k">thread.list</span><span><button id="list">Read</button> <span id="list-out" class="out"></span></span>
  <span class="k">ui.notify</span><span><button id="notify" class="primary">Send a toast</button> <span id="notify-out" class="out"></span></span>
  <span class="k">thread.archive</span><span><button id="archive">Archive this thread</button> <span id="archive-out" class="out"></span></span>
  <span class="k">thread.new</span><span><input id="task" value="Reply with OK only." size="22"> <button id="start">Start</button> <span id="start-out" class="out"></span></span>
  <span class="k">two questions</span><span><button id="twice">Restart s-1 twice (1 s timeout)</button> <span id="twice-out" class="out"></span></span>
  <span class="k">errors</span><span><button id="missing">No such verb</button> <button id="invalid">Bad args</button> <button id="misspelt">Misspelt arg</button> <button id="typo">cf.on("threads")</button> <span id="error-out" class="out"></span></span>
  <span class="k">cf.fetch</span><span><button id="fetch">Fetch issues</button> <button id="fetch-token">Bad token</button> <button id="fetch-local">Fetch loopback</button> <span id="fetch-out" class="out"></span></span>
  <span class="k">thread-list</span><span class="out"><span id="rows">–</span> threads · <span id="events">0</span> events</span>
</div>
<script>
const $ = (id) => document.getElementById(id);
// cf.storage is the daemon's: it outlives reloads and app restarts.
cf.ready.then(() => {
  if (!cf.thread) return;
  const s = cf.storage();
  const visits = (s.get("visits") || 0) + 1;
  s.set("visits", visits);
  $("visits").textContent = String(visits);
});
const show = (el, p) =>
  p.then(
    (r) => { el.className = "out ok"; el.textContent = r.json ? JSON.stringify(r.json).slice(0, 80) : r.text || "ok"; },
    (e) => { el.className = "out err"; el.textContent = e.code + ": " + e.message; },
  );
cf.ready.then(
  (r) => {
    $("thread").textContent = r.thread ? r.thread.name : "no thread";
    $("theme").textContent = r.theme.scheme;
    document.body.dataset.ready = "1";
    document.body.dataset.readonly = String(r.readOnly.length);
    document.body.dataset.sources = r.sources.join(",");
  },
  (e) => {
    // No bridge here (a frame that followed a link to this page): docs/notes/bridge-fix-frames.md.
    $("thread").textContent = e.code + ": " + e.message;
    document.body.dataset.ready = "no";
  },
);
cf.onTheme((t) => {
  document.documentElement.style.colorScheme = t.scheme;
  for (const [k, v] of Object.entries(t.vars)) document.documentElement.style.setProperty(k, v);
  $("theme").textContent = t.scheme;
});
let events = 0;
cf.on("thread-list", (rows) => {
  events++;
  $("rows").textContent = String(rows.length);
  $("events").textContent = String(events);
});
$("list").addEventListener("click", () => show($("list-out"), cf.run("thread.list").then((r) => ({ ...r, json: { threads: r.json.threads.length } }))));
$("notify").addEventListener("click", () => show($("notify-out"), cf.run("ui.notify", { level: "info", title: "Hello from a page", body: "Sent through the bridge" })));
$("archive").addEventListener("click", () => show($("archive-out"), cf.run("thread.archive", { id: cf.thread.id, archived: "true" })));
$("missing").addEventListener("click", () => show($("error-out"), cf.run("no.such.verb")));
$("invalid").addEventListener("click", () => show($("error-out"), cf.run("ui.notify", {})));
$("misspelt").addEventListener("click", () => show($("error-out"), cf.run("thread.list", { archivd: "true" })));
// The pages skill's example call, unchanged: no project, shown in the sidebar.
let started = 0;
$("start").addEventListener("click", () =>
  show(
    $("start-out"),
    cf.run("thread.new", { prompt: $("task").value, sidebar: true }).then((r) => {
      started++;
      $("task").value = "";
      return { text: "started " + String(started) + ": " + r.text, json: null };
    }),
  ),
);
$("typo").addEventListener("click", () => {
  try {
    cf.on("threads", () => {});
  } catch (e) {
    $("error-out").className = "out err";
    $("error-out").textContent = e.code + ": " + e.message;
  }
});
// Two questions from one click (the mock's busy s-1, restarted twice), each with a 1 s
// timeout: neither times out while the user reads.
$("twice").addEventListener("click", () => {
  const one = (n) => cf.run("thread.restart", { id: "s-1" }, { timeout: 1000 }).then((r) => n + " ok", (e) => n + " " + e.code);
  show($("twice-out"), Promise.all([one(1), one(2)]).then((r) => ({ text: r.join(", ") })));
});
// cf.fetch: the daemon makes the request (the mock's fake upstream, mock/proxyFetch.ts).
const issues = (auth) =>
  cf.fetch("https://upstream.test/issues", { headers: { Authorization: auth } }).then((r) => ({ text: r.status + " " + (r.ok ? r.json().length + " issues" : r.json().error) }));
$("fetch").addEventListener("click", () => show($("fetch-out"), issues("Bearer good")));
$("fetch-token").addEventListener("click", () => show($("fetch-out"), issues("Bearer bad")));
$("fetch-local").addEventListener("click", () => show($("fetch-out"), cf.fetch("http://127.0.0.1:7788/__mock/settings")));
const ask = () => parent.postMessage({ type: "cf:resize", height: Math.ceil(document.body.getBoundingClientRect().height) }, "*");
addEventListener("load", ask);
new ResizeObserver(ask).observe(document.body);
</script>
</body>
</html>
