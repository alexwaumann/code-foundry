<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Foundry</title>
    <!-- The last applied theme (lib/theme.ts THEME_STORAGE_KEY), before the stylesheet paints:
         without it the first frame is index.css's fallback (black) until App mounts. The
         defaults are lib/theme's (src/themes/defaults.ts; lib/firstPaint.test.ts checks). -->
    <script>
      (function () {
        var t = {};
        try { t = JSON.parse(localStorage.getItem("cf.theme")) || {}; } catch (e) {}
        var s = t.scheme === "dark" || t.scheme === "light" ? t.scheme : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        var id = typeof t[s] === "string" ? t[s] : s === "light" ? "github-light" : "github-dark";
        var r = document.documentElement;
        r.dataset.theme = id;
        r.classList.toggle("dark", s === "dark");
        r.style.colorScheme = s;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
