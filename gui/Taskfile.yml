version: '3'

# Wails v3 task runner config, trimmed from the `wails3 init -t react` template to the
# macOS targets this project builds. `wails3 build` / `wails3 dev` / `wails3 package`
# dispatch here.

vars:
  # The GUI executable's name, and so the name macOS shows in the Dock, the app menu and the
  # app switcher (Launch Services names a bare executable after its file, whatever its
  # embedded Info.plist says). Quote it wherever it is used.
  APP_NAME: "Code Foundry"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: "pnpm"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
