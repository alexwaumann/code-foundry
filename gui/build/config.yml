# This file contains the configuration for this project.
# Do not run `wails3 update build-assets`: it regenerates build/ from the template and
# overwrites the hand-edited plists and Taskfiles.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Alejandro Waumann" # The name of the company
  productName: "Code Foundry" # The name of the application
  productIdentifier: "dev.alexwaumann.codefoundry" # The unique product identifier
  description: "Supervise fleets of Claude Code threads" # The application description
  copyright: "(c) 2026 Alejandro Waumann" # Copyright text
  comments: "" # Comments
  version: "0.0.0" # Unused; `make package VERSION=vX.Y.Z` stamps build/darwin/Info.embedded.plist
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
      # The standard frontend task waits up to 60s for HTTP 200 from
      # FRONTEND_DEVSERVER_URL before starting the app. Override if needed;
      # custom background commands can opt in with the same readiness block.
      # readiness:
      #   http: "http://localhost:5173/"
      #   timeout: "60s"
      #   interval: "200ms"
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
