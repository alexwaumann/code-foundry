syntax = "proto3";

package codefoundry.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Wake subscriptions (ThreadService.Subscribe, Unsubscribe, ListSubscriptions): a
// subscriber thread is sent a message when a target thread meets a condition, a target
// action run finishes, a target pull request changes, or a plugin fires a wake source,
// so an agent that started other threads or opened a pull request is woken instead of
// polling, or when a timer it set goes off. See docs/notes/agents-4-wake.md,
// docs/notes/gh-events-3-pr-wake.md, docs/notes/plugins-wake-sources.md and
// docs/notes/ember-1-primitives.md.

// ThreadSubscriptionTarget is what a subscription watches.
enum ThreadSubscriptionTarget {
  THREAD_SUBSCRIPTION_TARGET_UNSPECIFIED = 0;
  // A thread (target_id is a thread id).
  THREAD_SUBSCRIPTION_TARGET_THREAD = 1;
  // An action run (target_id is a run id, "r-…"). Runs live in the daemon's memory, so
  // these subscriptions do not survive a daemon restart.
  THREAD_SUBSCRIPTION_TARGET_ACTION_RUN = 2;
  // A pull request (target_id is "owner/name#123", the slug in lower case). Kept in
  // the GitHub poll while subscribed; wakes come with the poll (about a minute with the
  // app open, up to 15 minutes without).
  THREAD_SUBSCRIPTION_TARGET_PULL_REQUEST = 3;
  // A plugin's wake source (target_id is "<plugin>/<source>"; args select which of its
  // events). The plugin fires it; disabling or uninstalling the plugin, or an update
  // that drops the source, sends a last "source gone" wake and removes it.
  THREAD_SUBSCRIPTION_TARGET_PLUGIN = 4;
  // A timer (target_id is "at:<RFC 3339 UTC>" or "every:<duration>", e.g. "every:30m"):
  // fires once at a time, or repeatedly at an interval until unsubscribed. Never fires
  // at subscribe time. Persisted: a time that passed while the daemon was stopped fires
  // once when it starts (within the timer check, about 10 s), and an interval resumes its
  // schedule (one catch-up wake for the slots it missed).
  THREAD_SUBSCRIPTION_TARGET_TIMER = 5;
}

// ThreadSubscriptionCondition is when a subscription fires: on a transition of the
// target into it (edge-triggered), and once at subscribe time when the target already
// meets it (for a pull request: the checks conditions, MERGED and CLOSED, as the
// GitHub cache has it).
enum ThreadSubscriptionCondition {
  // SETTLED for a thread, FINISHED for an action run, CHECKS_DONE for a pull request.
  THREAD_SUBSCRIPTION_CONDITION_UNSPECIFIED = 0;
  // IDLE or ATTENTION: Claude is not working (a turn ended, a prompt or question waits,
  // the process ended).
  THREAD_SUBSCRIPTION_CONDITION_SETTLED = 1;
  // As ThreadWaitCondition IDLE (a finished turn counts; a pending prompt does not).
  THREAD_SUBSCRIPTION_CONDITION_IDLE = 2;
  // status NEEDS_ATTENTION, whatever the reason.
  THREAD_SUBSCRIPTION_CONDITION_ATTENTION = 3;
  // status ERROR.
  THREAD_SUBSCRIPTION_CONDITION_ERROR = 4;
  // state DISCONNECTED.
  THREAD_SUBSCRIPTION_CONDITION_DISCONNECTED = 5;
  // An action run's only condition: it exited. Fires once; the subscription goes.
  THREAD_SUBSCRIPTION_CONDITION_FINISHED = 6;
  // Pull request conditions. A poll's changes to one pull request make at most one
  // wake per subscription, listing every change that matched.
  // Every check on the head completed, whatever the result.
  THREAD_SUBSCRIPTION_CONDITION_CHECKS_DONE = 7;
  // The check rollup became FAILURE or ERROR (other checks may still run).
  THREAD_SUBSCRIPTION_CONDITION_CHECKS_FAILED = 8;
  // The check rollup became SUCCESS.
  THREAD_SUBSCRIPTION_CONDITION_CHECKS_PASSED = 9;
  // A review was submitted, or the review decision changed.
  THREAD_SUBSCRIPTION_CONDITION_REVIEW = 10;
  // The comments count rose.
  THREAD_SUBSCRIPTION_CONDITION_COMMENT = 11;
  // A review was requested.
  THREAD_SUBSCRIPTION_CONDITION_REVIEW_REQUESTED = 12;
  // The head commit moved (a push).
  THREAD_SUBSCRIPTION_CONDITION_HEAD_PUSHED = 13;
  // Merged. The subscription goes once it fired, even with repeat; so does every other
  // subscription to the pull request.
  THREAD_SUBSCRIPTION_CONDITION_MERGED = 14;
  // Closed without merging. Goes once it fired, even with repeat.
  THREAD_SUBSCRIPTION_CONDITION_CLOSED = 15;
  // Any change the poll reports; the wake lists them.
  THREAD_SUBSCRIPTION_CONDITION_CHANGED = 16;
  // A plugin target's only condition: the plugin fired the source with a match that
  // covers the subscription's args. Also a timer's only condition: its time came.
  THREAD_SUBSCRIPTION_CONDITION_FIRED = 20;
}

message ThreadSubscription {
  // "sub-" + 12 hex digits.
  string id = 1;
  // The thread that is woken.
  string subscriber_thread_id = 2;
  ThreadSubscriptionTarget target = 3;
  string target_id = 4;
  ThreadSubscriptionCondition condition = 5;
  // Fires on every transition into the condition; otherwise it is removed once it fired.
  bool repeat = 6;
  google.protobuf.Timestamp created_at = 7;
  // Wakes delivered (a wake dropped by the rate limit does not count).
  int64 fired_count = 8;
  // Unset until it fired.
  google.protobuf.Timestamp last_fired_at = 9;
  // The subscriber's and the target's names at read time (a run: its action's name; a
  // pull request: "owner/name#123 Title"; a timer: "every 30m" or "at 09:00", local
  // time, with the date when not today); empty when unnamed or gone.
  string subscriber_name = 10;
  string target_name = 11;
  // The target's state at read time, as words: a thread's status and reason
  // ("needs attention (finished)"), a run's "running" or "exited 3", a pull request's
  // "open · checks pending (2/4) · review required" or "merged" ("not polled yet"
  // before the GitHub poll saw it), a plugin's state ("running", "disabled"), a timer's
  // next fire ("next 09:30", "due"); "gone" when the target no longer exists.
  string target_status = 12;
  // A plugin target's args: given, defaulted or taken from the subscriber's context.
  map<string, string> args = 20;
}

message SubscribeThreadRequest {
  // The subscriber thread.
  string subscriber_thread_id = 1;
  // Exactly one target: a thread id, an action run id, a pull request, a plugin's
  // wake source ("<plugin>/<source>"), or a timer (target_at or target_every).
  string target_thread_id = 2;
  string target_run_id = 3;
  // "owner/name#123" or a github.com pull request URL.
  string target_pull_request = 6;
  string target_plugin = 10;
  // A one-shot timer: fires once at this time (after now; INVALID_ARGUMENT otherwise).
  google.protobuf.Timestamp target_at = 12;
  // A repeating timer: fires every interval (at least one minute) from now until
  // unsubscribed; repeat is implied.
  google.protobuf.Duration target_every = 13;
  // UNSPECIFIED: SETTLED for a thread, FINISHED for a run, CHECKS_DONE for a pull
  // request, FIRED for a plugin or a timer. A run takes only FINISHED (or SETTLED); a
  // thread SETTLED to DISCONNECTED; a pull request CHECKS_DONE to CHANGED; a plugin and a
  // timer only FIRED (or SETTLED) (INVALID_ARGUMENT otherwise).
  ThreadSubscriptionCondition condition = 4;
  // Ignored for a run and a timer (target_at fires once, target_every repeats).
  bool repeat = 5;
  // A plugin target's args, by the source's arg names. An arg with a context defaults
  // to the subscriber's (its id, pull request or project); a required one without a
  // value is INVALID_ARGUMENT naming it.
  map<string, string> args = 11;
}

message SubscribeThreadResponse {
  // The subscription; for a one-shot that fired at once, as it was when it fired (it
  // is no longer listed).
  ThreadSubscription subscription = 1;
  // The target already met the condition: the wake was sent at once.
  bool fired = 2;
  // The same subscription (subscriber, target, condition) existed: it is returned, with
  // repeat updated, and nothing fired.
  bool existed = 3;
}

message UnsubscribeThreadRequest {
  // By id; or, without it, every subscription of subscriber_thread_id to the target.
  string subscription_id = 1;
  string subscriber_thread_id = 2;
  string target_thread_id = 3;
  string target_run_id = 4;
  string target_pull_request = 5;
  // "<plugin>/<source>": every subscription of the subscriber to it, whatever its args.
  string target_plugin = 10;
  // Every timer subscription of the subscriber.
  bool target_timer = 11;
}

message UnsubscribeThreadResponse {
  repeated ThreadSubscription removed = 1;
}

message ListThreadSubscriptionsRequest {
  // Empty: every thread's subscriptions.
  string subscriber_thread_id = 1;
}

message ListThreadSubscriptionsResponse {
  // By subscriber, then creation time.
  repeated ThreadSubscription subscriptions = 1;
}
