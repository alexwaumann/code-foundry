syntax = "proto3";

package codefoundry.v1;

import "google/protobuf/timestamp.proto";

// SessionService manages Claude Code sessions. A session is the primary unit of the app.
// It is layered on TerminalService: a connected session owns exactly one terminal; a
// disconnected session owns none and can be reconnected (claude --resume).
service SessionService {
  // Create spawns claude in a worktree and returns the session in STARTING state.
  rpc Create(CreateSessionRequest) returns (CreateSessionResponse) {}
  // Fork starts a new session that continues an existing session's conversation.
  rpc Fork(ForkSessionRequest) returns (ForkSessionResponse) {}
  // List returns all sessions, connected and disconnected.
  rpc List(ListSessionsRequest) returns (ListSessionsResponse) {}
  // Get returns one session.
  rpc Get(GetSessionRequest) returns (GetSessionResponse) {}
  // Rename sets a user-chosen name and disables auto-naming for the session.
  rpc Rename(RenameSessionRequest) returns (RenameSessionResponse) {}
  // Close ends the Claude process gracefully (/exit, bounded wait, then kill). The
  // session remains, DISCONNECTED, until Remove.
  rpc Close(CloseSessionRequest) returns (CloseSessionResponse) {}
  // Reconnect resumes a DISCONNECTED session in a new terminal.
  rpc Reconnect(ReconnectSessionRequest) returns (ReconnectSessionResponse) {}
  // Remove forgets a session. Closes it first if connected.
  rpc Remove(RemoveSessionRequest) returns (RemoveSessionResponse) {}
  // RunIn moves a workspace thread's cwd to another member worktree of its workspace.
  // A live thread gets `/cd <path>` typed once it is idle at its prompt
  // (pending_worktree_path shows the queued target until then) and the row's
  // worktree_path and repo_id change when it is sent. A disconnected thread's row
  // changes at once; the next reconnect resumes there. Refused for a project thread or
  // a target that is not a member.
  rpc RunIn(RunInSessionRequest) returns (RunInSessionResponse) {}
  // Pin pins or unpins a thread. Pinned threads sit in their own section at the top of
  // the GUI's thread list. Persisted; any state.
  rpc Pin(PinSessionRequest) returns (PinSessionResponse) {}
  // Watch streams session changes. The first event is a snapshot.
  rpc Watch(WatchSessionsRequest) returns (stream SessionEvent) {}
  // StageAttachment stores an image the first prompt refers to and returns its path.
  // Create appends "Attached image: <path>" lines for CreateSessionRequest.attachments;
  // Claude reads them with its Read tool. Only image types are accepted, with size
  // limits; unused staged files are reaped by the daemon.
  rpc StageAttachment(StageAttachmentRequest) returns (StageAttachmentResponse) {}
  // ReadAttachment returns a staged attachment's bytes (a rendered thread's user
  // message shows its images). Only files directly in the attachments directory;
  // NOT_FOUND once the file was reaped.
  rpc ReadAttachment(ReadAttachmentRequest) returns (ReadAttachmentResponse) {}
}

// PermissionMode maps to claude --permission-mode. Full access (bypassPermissions) is
// deliberately not offered.
enum PermissionMode {
  // Claude's default (manual).
  PERMISSION_MODE_UNSPECIFIED = 0;
  // --permission-mode manual: every tool call is confirmed.
  PERMISSION_MODE_SUPERVISED = 1;
  // --permission-mode acceptEdits: file edits are accepted, the rest is confirmed.
  PERMISSION_MODE_ACCEPT_EDITS = 2;
  // --permission-mode auto: Claude's auto-mode classifier decides.
  PERMISSION_MODE_AUTO = 3;
}

// SessionRender is how a thread runs and is shown, fixed for the thread's life (fork
// and reconnect keep it).
enum SessionRender {
  // CreateSessionRequest only: the sessions.render setting decides.
  SESSION_RENDER_UNSPECIFIED = 0;
  // Claude Code in a terminal (PTY) the GUI attaches to (terminal_id).
  SESSION_RENDER_TERMINAL = 1;
  // claude -p over stream-json; the conversation is ThreadService items, no terminal.
  SESSION_RENDER_RENDERED = 2;
}

// SessionState is the lifecycle of the Claude process behind a session.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  // Process spawned, Claude's UI not yet confirmed (trust dialog may be in progress).
  SESSION_STATE_STARTING = 1;
  // Claude is running and the session owns a terminal.
  SESSION_STATE_CONNECTED = 2;
  // Close requested; waiting for the process to exit.
  SESSION_STATE_CLOSING = 3;
  // No process. Either closed by us, exited by the user (/exit), or crashed.
  SESSION_STATE_DISCONNECTED = 4;
}

// SessionStatus is what Claude is doing, derived by observing output and the transcript.
enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_BUSY = 1;
  SESSION_STATUS_IDLE = 2;
  // Claude is waiting on the user: a permission prompt, a question, or a dialog.
  SESSION_STATUS_NEEDS_ATTENTION = 3;
  // The session's process ended while Claude was working (status_reason
  // "interrupted"): it crashed, exited, was closed, or the daemon stopped mid-turn. Set
  // only on a DISCONNECTED session; a reconnect replaces it with the detector's
  // reading. Claude-reported API errors stay NEEDS_ATTENTION "error: <code>".
  SESSION_STATUS_ERROR = 4;
}

// Ownership: a thread belongs to exactly one owner. When workspace_id is set the owner
// is that workspace; otherwise it is the project (repository) repo_id. repo_id and
// worktree_path are facts about the thread's cwd (for a workspace thread, the member
// worktree it runs in) and never decide the owner.
message Session {
  // Our stable id (survives reconnects).
  string id = 1;
  // Claude's own session id, once discovered from the transcript directory. Needed for
  // resume; empty until known.
  string claude_session_id = 2;
  // Repository of the cwd. The owner when workspace_id is empty.
  string repo_id = 3;
  // The cwd: the worktree claude runs in.
  string worktree_path = 4;
  // Display name. Auto-generated unless the user renamed it.
  string name = 5;
  bool auto_named = 6;
  // Model and effort as passed to claude (e.g. "opus", "high"). Empty means claude's default.
  string model = 7;
  string effort = 8;
  // Terminal currently attached to this session; empty when DISCONNECTED.
  string terminal_id = 9;
  SessionState state = 10;
  SessionStatus status = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp last_activity_at = 13;
  // Exit code of the last process, valid when DISCONNECTED after a process ran.
  int32 exit_code = 14;
  // Why the session is DISCONNECTED: "closed", "exited", "crashed", or empty.
  string disconnect_reason = 15;
  string last_error = 16;
  // Forked from this session id, if any.
  string parent_id = 17;
  // Short explanation of status from the detector, e.g. "finished", "at prompt",
  // "permission: Do you want to proceed?", or "interrupted" for ERROR. Persisted with
  // status: a DISCONNECTED session keeps the status and reason it had when its process
  // ended (a busy one becomes ERROR "interrupted"), across daemon restarts. Empty when
  // unknown.
  string status_reason = 18;
  // Permission mode passed to claude; re-passed on Reconnect.
  PermissionMode permission_mode = 19;
  // Ref the session's worktree branch was created from, when Create made the worktree.
  string base_ref = 20;
  // Create made the worktree for this session (new_worktree or new_workspace was set).
  bool created_worktree = 21;
  // Owner workspace (see the ownership rule above); empty for a project thread. Every
  // spawn of a workspace thread gets --add-dir for the workspace's other member
  // worktrees, read from the workspace store at launch.
  string workspace_id = 22;
  // Member worktree a queued RunIn will move the thread to once it is idle; empty when
  // nothing is queued. Not persisted: a thread that disconnects first moves its row
  // there instead.
  string pending_worktree_path = 23;
  // The user pinned the thread (SessionService.Pin). Persisted.
  bool pinned = 24;
  // Pull requests Claude linked to the conversation. Source: the "pr-link" records Claude
  // Code writes to the session's transcript whenever it sees a pull request for the
  // repository (created in the session, by a subagent, or named in a prompt). Claude
  // re-emits the record at nearly every turn and it can flip back to an earlier pull
  // request, so this is every distinct URL (deduplicated by URL) in first-seen order;
  // entries are never removed. A reconnected thread is backfilled from its transcript's
  // history. Persisted. See docs/notes/linked-prs.md.
  repeated LinkedPullRequest linked_pull_requests = 25;
  // When status or status_reason last changed. Persisted with them; unset if never
  // known (a row from before status persistence).
  google.protobuf.Timestamp status_changed_at = 26;
  // Token usage of the thread: one bucket per (model, tier, speed, UTC day), sorted by
  // day, model, tier, speed. A pure fold over the assistant records (each API request
  // counted once) of every transcript the thread has used (a /clear starts a new one)
  // and of every subagent run under them (agent_runs); a reconnect rescans them all
  // from the start and replaces it. Persisted. See docs/notes/session-usage.md.
  repeated UsageBucket usage = 27;
  // The price of usage in USD at first-party Claude API rates, computed when sent
  // (never stored). Excludes unpriced buckets.
  double cost_usd = 28;
  // Some bucket's model (or tier, or speed) has no known rate: cost_usd is a lower
  // bound and the UI says "unpriced" rather than showing $0 for it.
  bool unpriced = 29;
  // The thread's subagent runs, by start time (unknown last). Their usage is included
  // in usage. The count of runs is the length. Persisted.
  repeated AgentRun agent_runs = 30;
  // TERMINAL or RENDERED (never UNSPECIFIED). A rendered thread has no terminal_id;
  // its conversation is ThreadService.ListItems / Watch. Persisted.
  SessionRender render = 31;
}

// Whether a subagent run is still followed.
enum AgentRunStatus {
  AGENT_RUN_STATUS_UNSPECIFIED = 0;
  // Its result has not reached the thread yet: running, or a background run that has
  // not notified.
  AGENT_RUN_STATUS_OPEN = 1;
  // Its result (completed, failed, interrupted, stopped) reached the thread, or it was
  // idle past the safety net.
  AGENT_RUN_STATUS_CLOSED = 2;
}

// One subagent run of a thread (Session.agent_runs): a Claude Code Agent tool call,
// with its own transcript.
message AgentRun {
  // Claude's agent id.
  string id = 1;
  string description = 2;
  // "general-purpose", "Explore", ...
  string agent_type = 3;
  // As requested, e.g. "haiku"; empty when inherited from the thread.
  string model = 4;
  string effort = 5;
  // Launched in the background (run_in_background).
  bool background = 6;
  AgentRunStatus status = 7;
  // 1: spawned by the thread; 2 and up: by another run.
  int32 spawn_depth = 8;
  // Time of the run's first record; unset if unknown.
  google.protobuf.Timestamp started_at = 9;
  // The run's own usage, sorted like Session.usage, priced the same way.
  repeated UsageBucket usage = 10;
  double cost_usd = 11;
  bool unpriced = 12;
}

// Token counters for one model on one UTC day (of one session, or of the retired
// ledger).
message UsageBucket {
  // Canonical model id as Claude wrote it, e.g. "claude-opus-5-5".
  string model = 1;
  // "" or "long" (Claude Haiku 5.5 requests whose prompt is over 100K tokens).
  string tier = 2;
  // "" (standard) or "fast".
  string speed = 3;
  // UTC date "YYYY-MM-DD" of the requests; "unknown" when a record had no timestamp.
  string day = 4;
  int64 requests = 5;
  int64 input = 6;
  // Includes thinking tokens.
  int64 output = 7;
  int64 cache_read = 8;
  int64 cache_write_5m = 9;
  int64 cache_write_1h = 10;
  // The bucket's price in USD; 0 when unpriced.
  double cost_usd = 11;
  // The bucket's (model, tier, speed) has no known rate.
  bool unpriced = 12;
  // cost_usd split by token kind (the side panel's token table); all 0 when unpriced.
  double input_cost_usd = 13;
  double output_cost_usd = 14;
  double cache_read_cost_usd = 15;
  double cache_write_5m_cost_usd = 16;
  double cache_write_1h_cost_usd = 17;
  // What the bucket's cache reads saved in USD: cache_read x (input rate - cache read
  // rate) at the bucket's (model, tier, speed). 0 when unpriced.
  double cache_savings_usd = 18;
}

// A pull request Claude linked to a session (Session.linked_pull_requests).
message LinkedPullRequest {
  string slug = 1; // "owner/name"
  int32 number = 2;
  string url = 3;
  // The first pr-link record for url (when it was seen, if the record had no time).
  google.protobuf.Timestamp linked_at = 4;
}

message CreateSessionRequest {
  string repo_id = 1;
  string worktree_path = 2;
  string model = 3;
  string effort = 4;
  // Optional explicit name; disables auto-naming.
  string name = 5;
  // Optional first prompt, passed to claude as its positional prompt argument (a
  // rendered thread: sent as its first user message, with the attachments as image
  // blocks).
  string initial_prompt = 6;
  PermissionMode permission_mode = 7;
  // When set, Create makes a new worktree for the session before claude starts and
  // worktree_path is ignored. The branch is cf/<slug>, the slug named from
  // initial_prompt (bounded wait), else cf/<session id>.
  NewWorktree new_worktree = 8;
  // Paths returned by StageAttachment, appended to initial_prompt.
  repeated string attachments = 9;
  // Workspace (id or name) the thread belongs to. repo_id or worktree_path then pick
  // the member worktree it runs in (default: the first member); a worktree_path must
  // be a member's worktree. Not with new_worktree or new_workspace.
  string workspace_id = 10;
  // When set, Create makes a new workspace for the thread before claude starts: a
  // worktree on branch cf/<slug> in every repository listed (the slug as for
  // new_worktree, after the same single bounded wait), then runs the thread in the
  // member repo_id names (default: the first). worktree_path is ignored. Not with
  // new_worktree or workspace_id.
  NewWorkspace new_workspace = 11;
  // Terminal or rendered; UNSPECIFIED uses the sessions.render setting.
  SessionRender render = 12;
}

message NewWorktree {
  // Ref to branch from. Defaults to origin/<default branch>, else <default branch>.
  string base_ref = 1;
}

message NewWorkspace {
  // Repositories (id, name when unique, or an absolute path inside one), in member
  // order. At least one. "<repo>:<base ref>" gives that member its own base.
  repeated string repos = 1;
  // Ref every member without its own base branches from. Defaults to
  // origin/<default branch>, else <default branch>, per repository.
  string base_ref = 2;
  // Workspace name. Default: the slug (cf/<slug> without the prefix).
  string name = 3;
}

message StageAttachmentRequest {
  // Original file name (for the extension only).
  string name = 1;
  // image/png, image/jpeg, image/gif or image/webp.
  string mime_type = 2;
  bytes data = 3;
}

message StageAttachmentResponse {
  string path = 1;
}

message ReadAttachmentRequest {
  // A path StageAttachment returned.
  string path = 1;
}

message ReadAttachmentResponse {
  bytes data = 1;
  // Sniffed from the content: image/png, image/jpeg, image/gif or image/webp.
  string mime_type = 2;
}

message CreateSessionResponse {
  Session session = 1;
}

message ForkSessionRequest {
  string id = 1;
  string name = 2;
}

message ForkSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
  // Usage of removed threads (see SessionSnapshot.retired_usage).
  repeated UsageBucket retired_usage = 2;
}

message GetSessionRequest {
  string id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message RenameSessionRequest {
  string id = 1;
  string name = 2;
}

message RenameSessionResponse {
  Session session = 1;
}

message CloseSessionRequest {
  string id = 1;
}

message CloseSessionResponse {}

message ReconnectSessionRequest {
  string id = 1;
}

message ReconnectSessionResponse {
  Session session = 1;
}

message RemoveSessionRequest {
  string id = 1;
}

message RemoveSessionResponse {}

message RunInSessionRequest {
  string id = 1;
  // The member to run in: its repository id, or its worktree path. One is required;
  // both must name the same member.
  string repo_id = 2;
  string worktree_path = 3;
}

message RunInSessionResponse {
  Session session = 1;
}

message PinSessionRequest {
  string id = 1;
  bool pinned = 2;
}

message PinSessionResponse {
  Session session = 1;
}

message WatchSessionsRequest {}

message SessionEvent {
  oneof event {
    SessionSnapshot snapshot = 1;
    Session updated = 2;
    string removed_id = 3;
    // Follows removed_id when the removed thread had usage: the whole retired ledger.
    RetiredUsage retired_usage = 4;
  }
}

message SessionSnapshot {
  repeated Session sessions = 1;
  // Usage of removed threads, summed per (model, tier, speed, day): a thread's buckets
  // are added here when it is removed. Usage over every thread ever tracked is the
  // sessions' usage plus this.
  repeated UsageBucket retired_usage = 2;
}

// The retired usage ledger after a removal (SessionEvent.retired_usage).
message RetiredUsage {
  repeated UsageBucket buckets = 1;
}
