syntax = "proto3";

package codefoundry.v1;

import "google/protobuf/timestamp.proto";

// GhService exposes GitHub data scoped to the viewer: their pull requests (authored,
// review requested, reviewed, recently merged), the default-branch CI of tracked
// repositories, their pull requests on watched branches, and monthly stats. The daemon
// polls GitHub with one cheap fingerprint request per interval and fetches details only
// for what changed (docs/notes/gh-viewer-polling.md); results are cached in SQLite, so
// reads are served from the last-known state and never wait on the network. Every
// response carries fetched_at so the UI can show staleness; an unset fetched_at means
// "never fetched".
//
// Repositories are identified by their "owner/name" slug (RepoService's github_slug).
// Slugs are case-insensitive and are normalised to lower case.
service GhService {
  // GetViewer returns the authenticated GitHub user.
  rpc GetViewer(GetViewerRequest) returns (GetViewerResponse) {}
  // GetPullRequest returns one pull request with the full list of its head commit's
  // checks. On demand only (nothing polls it): served from cache when fresh (30s),
  // otherwise fetched through the paced queue; on fetch failure the stale cached copy
  // is returned with last_error set.
  rpc GetPullRequest(GetPullRequestRequest) returns (GetPullRequestResponse) {}
  // ListChecks returns the checks for a ref (branch name, tag, or commit SHA). Same
  // caching rules as GetPullRequest.
  rpc ListChecks(ListChecksRequest) returns (ListChecksResponse) {}
  // Refresh polls now. With a repo_slug it returns when that poll has completed (with
  // its error); an empty repo_slug only marks the poll due and returns without waiting.
  rpc Refresh(RefreshGhRequest) returns (RefreshGhResponse) {}
  // Track adds a repository to the poll (its default branch CI; the dashboards count
  // its pull requests as tracked). RepoService's repositories with a GitHub remote are
  // tracked automatically; this is exposed for the CLI and debugging.
  rpc Track(TrackGhRepoRequest) returns (TrackGhRepoResponse) {}
  // Untrack removes a repository from the poll. Its cache is kept.
  rpc Untrack(UntrackGhRepoRequest) returns (UntrackGhRepoResponse) {}
  // Watch streams change notifications. Clients re-read with the Get RPCs.
  rpc Watch(WatchGhRequest) returns (stream GhEvent) {}
  // GetDashboard returns the viewer's pull request dashboards (open PRs they authored,
  // PRs awaiting their review, open PRs they reviewed, PRs merged in the last 7 days
  // involving them) and their monthly stats across GitHub, from the last poll. The
  // lists hold only tracked repositories unless include_untracked.
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse) {}
  // GetRepoActivity returns the viewer's monthly stats in one repository, its default
  // branch's CI, and the dashboard's recently merged PRs in it. Served from cache.
  rpc GetRepoActivity(GetRepoActivityRequest) returns (GetRepoActivityResponse) {}
  // GetBranchPullRequests returns the viewer's pull requests (any state) whose head is
  // head_ref in the repository itself, from cache, and keeps that branch in the poll
  // for 10 minutes after the last call. A first call returns an empty list with
  // fetched_at unset; a branch_pull_requests_updated event follows the next poll.
  rpc GetBranchPullRequests(GetBranchPullRequestsRequest) returns (GetBranchPullRequestsResponse) {}
  // GetPullRequestDetail returns everything the pull request detail panel shows: the
  // summary, body, labels, reviewers, commits, comments and reviews, review threads, and
  // checks. On demand (one GraphQL request, more only for checks beyond 100), cached per
  // pull request. The cache serves until refresh is set, the entry is older than the
  // poll interval, or a poll saw the pull request change (updated, pushed, state, or
  // check counts); pull_request_detail_updated says so. On fetch failure the cached
  // copy is returned with last_error set.
  rpc GetPullRequestDetail(GetPullRequestDetailRequest) returns (GetPullRequestDetailResponse) {}
  // ListReviewerCandidates returns who can be asked to review a pull request: the
  // repository's assignable users (first 100) and the current requests (users and
  // teams). Requested first, then by login; the pull request's author is left out.
  // Fetched on every call (not cached).
  rpc ListReviewerCandidates(ListReviewerCandidatesRequest) returns (ListReviewerCandidatesResponse) {}
  // SetReviewRequest requests (or withdraws a request for) a review from a user or
  // team. The pull request's cached detail is invalidated and
  // pull_request_detail_updated is sent.
  rpc SetReviewRequest(SetReviewRequestRequest) returns (SetReviewRequestResponse) {}
  // RevertPullRequest opens a pull request that reverts a merged one (GitHub's revert
  // button). FAILED_PRECONDITION when the pull request is not merged.
  rpc RevertPullRequest(RevertPullRequestRequest) returns (RevertPullRequestResponse) {}
}

// GitHub's pull request state.
enum PullRequestState {
  PULL_REQUEST_STATE_UNSPECIFIED = 0;
  PULL_REQUEST_STATE_OPEN = 1;
  PULL_REQUEST_STATE_CLOSED = 2;
  PULL_REQUEST_STATE_MERGED = 3;
}

// GitHub's pull request review decision.
enum ReviewDecision {
  // No review policy applies, or GitHub did not report one.
  REVIEW_DECISION_UNSPECIFIED = 0;
  REVIEW_DECISION_APPROVED = 1;
  REVIEW_DECISION_CHANGES_REQUESTED = 2;
  REVIEW_DECISION_REVIEW_REQUIRED = 3;
}

// Whether the pull request can be merged without conflicts.
enum Mergeable {
  MERGEABLE_UNSPECIFIED = 0;
  MERGEABLE_MERGEABLE = 1;
  MERGEABLE_CONFLICTING = 2;
  // GitHub has not computed mergeability yet (it does so lazily after a push).
  MERGEABLE_UNKNOWN = 3;
}

// GitHub's merge state, which folds in branch protection and check results.
enum MergeStateStatus {
  MERGE_STATE_STATUS_UNSPECIFIED = 0;
  MERGE_STATE_STATUS_BEHIND = 1;
  MERGE_STATE_STATUS_BLOCKED = 2;
  MERGE_STATE_STATUS_CLEAN = 3;
  MERGE_STATE_STATUS_DIRTY = 4;
  MERGE_STATE_STATUS_HAS_HOOKS = 5;
  MERGE_STATE_STATUS_UNKNOWN = 6;
  MERGE_STATE_STATUS_UNSTABLE = 7;
  MERGE_STATE_STATUS_DRAFT = 8;
}

// A review's state.
enum PullRequestReviewState {
  PULL_REQUEST_REVIEW_STATE_UNSPECIFIED = 0;
  PULL_REQUEST_REVIEW_STATE_PENDING = 1;
  PULL_REQUEST_REVIEW_STATE_COMMENTED = 2;
  PULL_REQUEST_REVIEW_STATE_APPROVED = 3;
  PULL_REQUEST_REVIEW_STATE_CHANGES_REQUESTED = 4;
  PULL_REQUEST_REVIEW_STATE_DISMISSED = 5;
}

// Combined state of all checks on a commit (GitHub's StatusCheckRollup.state).
enum CheckRollupState {
  // The commit has no checks.
  CHECK_ROLLUP_STATE_UNSPECIFIED = 0;
  CHECK_ROLLUP_STATE_PENDING = 1;
  CHECK_ROLLUP_STATE_SUCCESS = 2;
  CHECK_ROLLUP_STATE_FAILURE = 3;
  CHECK_ROLLUP_STATE_ERROR = 4;
  CHECK_ROLLUP_STATE_EXPECTED = 5;
}

// Lifecycle of one check.
enum CheckStatus {
  CHECK_STATUS_UNSPECIFIED = 0;
  CHECK_STATUS_QUEUED = 1;
  CHECK_STATUS_IN_PROGRESS = 2;
  CHECK_STATUS_COMPLETED = 3;
  CHECK_STATUS_WAITING = 4;
  CHECK_STATUS_PENDING = 5;
  CHECK_STATUS_REQUESTED = 6;
}

// Result of a completed check. Commit statuses (the legacy status API) map ERROR and
// FAILURE to FAILURE, SUCCESS to SUCCESS, and PENDING/EXPECTED to an unspecified
// conclusion with status PENDING.
enum CheckConclusion {
  CHECK_CONCLUSION_UNSPECIFIED = 0;
  CHECK_CONCLUSION_SUCCESS = 1;
  CHECK_CONCLUSION_FAILURE = 2;
  CHECK_CONCLUSION_NEUTRAL = 3;
  CHECK_CONCLUSION_CANCELLED = 4;
  CHECK_CONCLUSION_SKIPPED = 5;
  CHECK_CONCLUSION_TIMED_OUT = 6;
  CHECK_CONCLUSION_ACTION_REQUIRED = 7;
  CHECK_CONCLUSION_STALE = 8;
  CHECK_CONCLUSION_STARTUP_FAILURE = 9;
}

message GhViewer {
  string login = 1;
  string name = 2;
  string avatar_url = 3;
  string url = 4;
}

// Counts of a commit's checks, bucketed for display.
message CheckRollup {
  CheckRollupState state = 1;
  int32 total = 2;
  // Completed successfully.
  int32 passed = 3;
  // Failure, error, timed out, cancelled, action required, startup failure.
  int32 failed = 4;
  // Queued, in progress, waiting, pending, expected.
  int32 pending = 5;
  // Skipped, neutral, stale.
  int32 skipped = 6;
}

message PullRequest {
  string repo_slug = 1;
  int32 number = 2;
  string title = 3;
  // Author login; empty for deleted ("ghost") accounts.
  string author = 4;
  string head_ref = 5;
  string head_sha = 6;
  string base_ref = 7;
  bool draft = 8;
  // Open pull requests only (also merge_state_status, mergeable, head_repo_slug,
  // comment_count, review_count, latest_reviews, review_requests): closed and merged
  // ones are fetched with the summary fields.
  ReviewDecision review_decision = 9;
  Mergeable mergeable = 10;
  MergeStateStatus merge_state_status = 11;
  // True when the head branch lives in a fork.
  bool is_cross_repository = 12;
  // "owner/name" of the head repository; empty when the fork was deleted.
  string head_repo_slug = 13;
  string url = 14;
  google.protobuf.Timestamp updated_at = 15;
  CheckRollup checks = 16;
  PullRequestState state = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp merged_at = 19;
  // Size of the change.
  int32 additions = 20;
  int32 deletions = 21;
  int32 changed_files = 22;
  // Issue and review comments.
  int32 comment_count = 23;
  // Submitted reviews.
  int32 review_count = 24;
  // Each reviewer's latest review (up to 10).
  repeated PullRequestReview latest_reviews = 25;
  // Pending review requests: user logins and "org/team" slugs (up to 10).
  repeated string review_requests = 26;
  // Only the poll's fingerprint is known so far (the detail fetch is pending or
  // failed): title and the detail fields are empty. The next poll retries.
  bool partial = 27;
}

message PullRequestReview {
  // Reviewer login; empty for deleted accounts.
  string author = 1;
  PullRequestReviewState state = 2;
  google.protobuf.Timestamp submitted_at = 3;
}

message CheckRun {
  string name = 1;
  // Workflow name for GitHub Actions jobs, empty otherwise.
  string workflow = 2;
  CheckStatus status = 3;
  CheckConclusion conclusion = 4;
  // Details page (Actions job log, external CI page, or status target URL).
  string url = 5;
  // Status description for commit statuses; empty for check runs.
  string description = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp completed_at = 8;
}

message GetViewerRequest {}

message GetViewerResponse {
  // Unset until the first successful fetch (or cache load).
  GhViewer viewer = 1;
  // False once gh reported that it is not authenticated.
  bool authenticated = 2;
  google.protobuf.Timestamp fetched_at = 3;
  // The last fetch error, cleared on success.
  string last_error = 4;
}

message GetPullRequestRequest {
  string repo_slug = 1;
  int32 number = 2;
}

message GetPullRequestResponse {
  PullRequest pull_request = 1;
  // Checks on the head commit.
  repeated CheckRun checks = 2;
  google.protobuf.Timestamp fetched_at = 3;
  string last_error = 4;
}

message ListChecksRequest {
  string repo_slug = 1;
  // Branch name, tag, or commit SHA.
  string ref = 2;
}

message ListChecksResponse {
  // The commit the ref resolved to.
  string sha = 1;
  CheckRollup rollup = 2;
  repeated CheckRun checks = 3;
  google.protobuf.Timestamp fetched_at = 4;
  string last_error = 5;
}

message RefreshGhRequest {
  string repo_slug = 1;
}

message RefreshGhResponse {}

message TrackGhRepoRequest {
  string repo_slug = 1;
}

message TrackGhRepoResponse {}

message UntrackGhRepoRequest {
  string repo_slug = 1;
}

message UntrackGhRepoResponse {}

message WatchGhRequest {}

message GhEvent {
  reserved 1;
  reserved "pull_requests_updated";

  oneof event {
    ViewerUpdated viewer_updated = 2;
    DashboardUpdated dashboard_updated = 3;
    RepoActivityUpdated repo_activity_updated = 4;
    BranchPullRequestsUpdated branch_pull_requests_updated = 5;
    Polled polled = 6;
    PullRequestDetailUpdated pull_request_detail_updated = 7;
  }

  // A pull request's cached detail changed or went stale (a poll saw the pull request
  // change, or a review request was set). Re-read with GetPullRequestDetail.
  message PullRequestDetailUpdated {
    string repo_slug = 1;
    int32 number = 2;
  }

  // The dashboards, the global monthly stats, their fetch errors, or the tracked set
  // changed. Re-read with GetDashboard.
  message DashboardUpdated {
    google.protobuf.Timestamp fetched_at = 1;
  }

  // A repository's monthly stats or default branch CI (or their errors, or whether it
  // is tracked) changed. Re-read with GetRepoActivity.
  message RepoActivityUpdated {
    string repo_slug = 1;
    google.protobuf.Timestamp fetched_at = 2;
  }

  // A watched branch's pull requests changed (or were polled for the first time).
  // Re-read with GetBranchPullRequests.
  message BranchPullRequestsUpdated {
    string repo_slug = 1;
    string head_ref = 2;
    google.protobuf.Timestamp fetched_at = 3;
  }

  // The viewer or authentication state changed.
  message ViewerUpdated {
    google.protobuf.Timestamp fetched_at = 1;
  }

  // A poll finished. Sent after every poll (and in the EventService snapshot) so
  // clients can show "updated Ns ago" without re-reading: the events above are sent
  // only when data changed, so the fetched_at of a re-read can be older than this.
  message Polled {
    // When the last successful poll finished; unset if never.
    google.protobuf.Timestamp fetched_at = 1;
    // This poll's error; empty when it succeeded.
    string last_error = 2;
  }
}

// One calendar month (in the daemon's time zone) of the viewer's activity.
message MonthActivity {
  // "YYYY-MM".
  string month = 1;
  // Commits authored by the viewer (on default branches; see commits_source).
  int32 commits = 2;
  // Pull requests authored by the viewer and merged in the month.
  int32 merged = 3;
}

message ActivityStats {
  MonthActivity this_month = 1;
  MonthActivity last_month = 2;
  // Where commit counts came from: "search" (REST search/commits, or the default
  // branch's history for one repository) or "contributions" (contributionsCollection,
  // the fallback when commit search fails; buckets by UTC day).
  string commits_source = 3;
  google.protobuf.Timestamp fetched_at = 4;
  string last_error = 5;
}

message GetDashboardRequest {
  // Keep pull requests from every repository, not only tracked ones.
  bool include_untracked = 1;
}

message GetDashboardResponse {
  // Unset until the viewer is known.
  GhViewer viewer = 1;
  bool authenticated = 2;
  // Open pull requests authored by the viewer, most recently updated first.
  repeated PullRequest authored = 3;
  // Open pull requests requesting the viewer's review (directly or via a team).
  repeated PullRequest review_requested = 4;
  // Pull requests merged in the last 7 days that the viewer authored, reviewed, or is
  // assigned to, most recently updated first.
  repeated PullRequest recently_merged = 5;
  // Global (all of GitHub) monthly stats.
  ActivityStats stats = 6;
  // When the dashboards were last fetched; unset if never.
  google.protobuf.Timestamp fetched_at = 7;
  string last_error = 8;
  // The tracked repositories the lists were filtered to (lower case).
  repeated string tracked_slugs = 9;
  // Open pull requests the viewer reviewed and did not author, except those in
  // review_requested, most recently updated first.
  repeated PullRequest reviewed = 10;
  // github.dashboards_enabled is off: the lists are empty and not polled.
  bool dashboards_disabled = 11;
}

message GetRepoActivityRequest {
  string repo_slug = 1;
}

// The default branch's head commit and its checks.
message DefaultBranchStatus {
  string branch = 1;
  string sha = 2;
  // Commit message headline.
  string headline = 3;
  google.protobuf.Timestamp committed_at = 4;
  CheckRollup rollup = 5;
  // Failed checks (failure, error, cancelled, timed out, action required, startup
  // failure), failed first by workflow and name.
  repeated CheckRun failing = 6;
  // When a poll last confirmed this state.
  google.protobuf.Timestamp fetched_at = 7;
  // The last poll's error for this repository (e.g. not found); the fields above are
  // then the last known state.
  string last_error = 8;
}

message GetRepoActivityResponse {
  string repo_slug = 1;
  bool tracked = 2;
  // The viewer's activity in this repository.
  ActivityStats stats = 3;
  // Unset until a poll included the repository.
  DefaultBranchStatus default_branch = 4;
  // The dashboard's recently merged pull requests in this repository.
  repeated PullRequest recently_merged = 5;
}

message GetBranchPullRequestsRequest {
  string repo_slug = 1;
  string head_ref = 2;
}

message GetBranchPullRequestsResponse {
  repeated PullRequest pull_requests = 1;
  google.protobuf.Timestamp fetched_at = 2;
  string last_error = 3;
}

// ---- Pull request detail (GetPullRequestDetail) -----------------------------------

message GetPullRequestDetailRequest {
  string repo_slug = 1;
  int32 number = 2;
  // Fetch from GitHub even when the cached detail is fresh.
  bool refresh = 3;
}

message GetPullRequestDetailResponse {
  PullRequestDetail detail = 1;
}

// Which side of a diff a review thread is anchored to.
enum DiffSide {
  DIFF_SIDE_UNSPECIFIED = 0;
  // The base (deleted lines).
  DIFF_SIDE_LEFT = 1;
  // The head (added and context lines).
  DIFF_SIDE_RIGHT = 2;
}

// What a PullRequestComment is.
enum PullRequestCommentKind {
  PULL_REQUEST_COMMENT_KIND_UNSPECIFIED = 0;
  // A comment on the conversation tab.
  PULL_REQUEST_COMMENT_KIND_ISSUE_COMMENT = 1;
  // A submitted review (its summary body may be empty); review_state is set.
  PULL_REQUEST_COMMENT_KIND_REVIEW = 2;
  // An inline comment on a diff line (in review threads); path is set.
  PULL_REQUEST_COMMENT_KIND_REVIEW_COMMENT = 3;
}

message PullRequestDetail {
  // The summary fields, as GetPullRequest returns them. checks is the head commit's
  // rollup.
  PullRequest pull_request = 1;
  // Markdown, as written.
  string body = 2;
  repeated PullRequestLabel labels = 3;
  // One entry per reviewer: a latest review, a pending request, or both. Requested
  // first, then most recent review first.
  repeated PullRequestReviewer reviewers = 4;
  // The last 100 commits, oldest first.
  repeated PullRequestCommit commits = 5;
  // All commits on the pull request (commits holds the last 100).
  int32 commit_count = 6;
  // Issue comments and submitted reviews (the last 100 of each), oldest first. Inline
  // review comments are in review_threads.
  repeated PullRequestComment comments = 7;
  // More issue comments or reviews exist than comments holds.
  bool comments_truncated = 8;
  // The last 50 review threads, oldest first.
  repeated PullRequestReviewThread review_threads = 9;
  // More review threads exist than review_threads holds.
  bool review_threads_truncated = 10;
  // Every check on the head commit, failed first.
  repeated CheckRun checks = 11;
  // Merged pull requests: the merge commit and who merged.
  string merge_commit_sha = 12;
  string merged_by = 13;
  // Closed or merged pull requests.
  google.protobuf.Timestamp closed_at = 14;
  // GitHub's node id.
  string node_id = 15;
  // The viewer has write access to the repository (viewer_permission admin, maintain,
  // or write): they may request reviewers and revert.
  bool viewer_can_update = 16;
  // When this detail was fetched; unset if never.
  google.protobuf.Timestamp fetched_at = 17;
  // The last fetch's error when this is the cached copy.
  string last_error = 18;
  // The viewer's permission on the repository, lower case ("admin", "maintain",
  // "write", "triage", "read"); empty if unknown.
  string viewer_permission = 19;
}

message PullRequestLabel {
  string name = 1;
  // Hex color without "#", e.g. "d73a4a".
  string color = 2;
}

message PullRequestReviewer {
  // User login, or "org/team" for a team.
  string login = 1;
  bool is_team = 2;
  // The latest submitted review's state; UNSPECIFIED when the reviewer has only been
  // requested.
  PullRequestReviewState state = 3;
  google.protobuf.Timestamp submitted_at = 4;
  // A review request is pending (after a review too: re-requested).
  bool requested = 5;
  // Commits landed after the latest review (it reviewed an older head).
  bool stale = 6;
  string avatar_url = 7;
  bool is_bot = 8;
}

message PullRequestCommit {
  string sha = 1;
  string headline = 2;
  // GitHub login of the commit author; empty when the email maps to no account.
  string author_login = 3;
  // Git author name.
  string author_name = 4;
  google.protobuf.Timestamp committed_at = 5;
}

message PullRequestComment {
  // GitHub's node id.
  string id = 1;
  PullRequestCommentKind kind = 2;
  // Author login; empty for deleted accounts.
  string author = 3;
  bool author_is_bot = 4;
  string author_avatar_url = 5;
  // Markdown, as written.
  string body = 6;
  google.protobuf.Timestamp created_at = 7;
  string url = 8;
  // Review comments: the file.
  string path = 9;
  // Reviews: the review's state.
  PullRequestReviewState review_state = 10;
}

message PullRequestReviewThread {
  // GitHub's node id.
  string id = 1;
  string path = 2;
  // The line in the current diff or, when outdated, the line it was written on.
  int32 line = 3;
  DiffSide side = 4;
  bool is_resolved = 5;
  // The diff moved on: the line no longer exists as commented.
  bool is_outdated = 6;
  // The first 20 comments, oldest first (kind REVIEW_COMMENT).
  repeated PullRequestComment comments = 7;
  bool comments_truncated = 8;
}

// ---- Reviewer requests (ListReviewerCandidates, SetReviewRequest) -----------------

enum ReviewerKind {
  REVIEWER_KIND_UNSPECIFIED = 0;
  REVIEWER_KIND_USER = 1;
  REVIEWER_KIND_TEAM = 2;
}

message ListReviewerCandidatesRequest {
  string repo_slug = 1;
  int32 number = 2;
}

message ListReviewerCandidatesResponse {
  repeated ReviewerCandidate candidates = 1;
  // The repository has more assignable users than were listed (100).
  bool truncated = 2;
}

message ReviewerCandidate {
  // GitHub's node id.
  string id = 1;
  ReviewerKind kind = 2;
  // User login, or "org/team" for a team.
  string login = 3;
  string name = 4;
  string avatar_url = 5;
  // A review request is pending.
  bool is_requested = 6;
}

message SetReviewRequestRequest {
  string repo_slug = 1;
  int32 number = 2;
  // User login, or the team as "org/team" (or its slug alone).
  string login = 3;
  // UNSPECIFIED means USER.
  ReviewerKind kind = 4;
  // True requests a review; false withdraws the request.
  bool requested = 5;
}

message SetReviewRequestResponse {
  // The pending requests afterwards, as GitHub reports them: user logins and
  // "org/team".
  repeated string requested = 1;
}

// ---- Revert (RevertPullRequest) ---------------------------------------------------

message RevertPullRequestRequest {
  string repo_slug = 1;
  int32 number = 2;
}

message RevertPullRequestResponse {
  // The new pull request that reverts the merged one.
  int32 number = 1;
  string url = 2;
}
