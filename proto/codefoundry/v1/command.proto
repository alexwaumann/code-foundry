syntax = "proto3";

package codefoundry.v1;

// CommandService exposes the daemon's command registry. Every user action is a command.
// The palette, keybindings, and CLI verbs are all generated from List.
service CommandService {
  // List returns commands available in the given context (all commands when
  // include_unavailable is set, with `available` filled in).
  rpc List(ListCommandsRequest) returns (ListCommandsResponse) {}
  // Invoke runs a command with string-encoded args.
  rpc Invoke(InvokeCommandRequest) returns (InvokeCommandResponse) {}
}

// UiContext describes what the caller is looking at. The daemon never guesses it.
message UiContext {
  string active_terminal_id = 1;
  string active_thread_id = 2;
  string active_project_id = 3;
  string active_worktree_path = 4;
  // Logical view name, e.g. "terminal", "project", "dashboard". Empty from the CLI, and
  // from a page's bridge, which runs a verb as the CLI inside the page's thread would:
  // active_thread_id that thread, nothing else (docs/notes/bridge-1-daemon.md).
  string active_view = 5;
  // Workspace that owns what is active: the active thread's workspace, or the workspace
  // a composer or page is for. Empty for project threads and from the CLI.
  string active_workspace_id = 6;
  // 7 was active_session_rendered until 2026-10-12 (every thread is rendered now).
  reserved 7;
  reserved "active_session_rendered";
}

enum ArgType {
  ARG_TYPE_UNSPECIFIED = 0;
  ARG_TYPE_STRING = 1;
  ARG_TYPE_BOOL = 2;
  ARG_TYPE_INT = 3;
  ARG_TYPE_ENUM = 4;
  // A path on disk; the palette may offer a picker.
  ARG_TYPE_PATH = 5;
}

message ArgSpec {
  string name = 1;
  ArgType type = 2;
  bool required = 3;
  string description = 4;
  repeated string enum_values = 5;
  string default_value = 6;
  // Positional args take bare words on the CLI, in declaration order
  // (`code-foundry settings set <key> <value>`). The flag form still works.
  bool positional = 7;
  // The CLI sends its working directory when the flag is not given (a thread's Claude
  // runs `code-foundry workspace members` from the worktree it works in).
  bool default_to_cwd = 8;
  // The CLI sends $CODE_FOUNDRY_THREAD (the thread its Claude runs in) when the flag is
  // not given; an empty value (--flag=) opts out. thread.new's created-by.
  bool default_to_thread_env = 9;
  // The CLI reads the value from a file when it is @<path>, or from stdin when it is -
  // (thread.report's data).
  bool file_or_stdin = 10;
  // The CLI takes the flag more than once and sends the values joined by newlines
  // (thread.subscribe's --arg k=v).
  bool repeatable = 11;
  // The arg is an id (a full id or a unique suffix of one). The CLI refuses an
  // explicitly empty value, and names it when a stray word looks like one.
  bool id = 12;
  // The arg defaults to a field of the caller's context (the active thread, terminal,
  // project, worktree). The CLI refuses an explicitly empty value, which would
  // otherwise mean the active one.
  bool context_bound = 13;
  // The last positional arg takes every bare word left on the CLI, joined by spaces
  // (`code-foundry memory add always open PRs as drafts`).
  bool rest = 14;
}

message Command {
  // Dotted, stable identifier, e.g. "terminal.new", "project.add".
  string name = 1;
  // Palette title, e.g. "New Terminal".
  string title = 2;
  string description = 3;
  // Palette group, e.g. "Terminal", "Project".
  string category = 4;
  repeated ArgSpec args = 5;
  // Default keybindings in the GUI's chord syntax, e.g. "cmd+n".
  repeated string keybindings = 6;
  // Whether the command is available in the requested context.
  bool available = 7;
  // Invoke fails with FailedPrecondition and a ConfirmationRequired detail unless
  // InvokeCommandRequest.confirmed is set. Clients ask the user, then re-invoke.
  bool requires_confirmation = 8;
  // The command only reads: it creates, changes, sends, runs, opens or writes nothing and
  // moves no window. A page's bridge runs these freely and any other command only from a
  // user gesture in the page (docs/notes/bridge-1-daemon.md). A plugin's commands never are.
  bool read_only = 9;
  // The GUI palette does not list it: a query whose only output is a text toast, a verb
  // for the model or the CLI to drive the app, or one whose required arg is an opaque id
  // the palette can only take as typed text. The CLI, pages and chords still have it.
  bool no_palette = 10;
}

message ListCommandsRequest {
  UiContext context = 1;
  bool include_unavailable = 2;
}

message ListCommandsResponse {
  repeated Command commands = 1;
}

message InvokeCommandRequest {
  string name = 1;
  UiContext context = 2;
  map<string, string> args = 3;
  // The user confirmed a destructive command (Command.requires_confirmation).
  bool confirmed = 4;
}

message InvokeCommandResponse {
  // Human-readable result for the palette toast or CLI stdout. May be empty.
  string message = 1;
  // Optional structured result for CLI --json; JSON-encoded.
  string result_json = 2;
  // A process exit status the command reports (action.run --wait: the action's exit
  // code). The CLI prints the result, then exits with it when it is not 0.
  int32 exit_code = 3;
  // Notes about the result the CLI prints to stderr, one "warning: " line each, so
  // stdout stays the result (settings.get warns when settings.toml does not parse).
  repeated string warnings = 4;
}

// ConfirmationRequired is the error detail of an Invoke that needs confirmation.
message ConfirmationRequired {
  string command = 1;
  // Rendered prompt, e.g. "Remove worktree /x? This deletes files on disk."
  string message = 2;
  // Command title, for the dialog's confirm button.
  string title = 3;
  // Set on a second-stage confirmation: one a command raises after the user already
  // confirmed it once (removing a worktree turned out to delete uncommitted work:
  // {"force": "true"}). If the user agrees, invoke again with these args merged over
  // the original ones and confirmed set. A client applies them only to the command it
  // invoked (command equals InvokeCommandRequest.name) and never on the user's behalf:
  // the CLI's --yes does not accept one, so an agent passes the flag (--force) itself.
  map<string, string> args = 4;
  // What the command already did and answers when the user declines a second-stage
  // confirmation (a bulk worktree cleanup removed the clean worktrees before asking
  // about the ones with uncommitted changes). Clients show it as the result. Unset:
  // declining leaves nothing done, and the CLI's --yes fails with the message.
  InvokeCommandResponse declined = 5;
  // Set on a command's own (first) confirmation when its yes must stay bound to what
  // was shown (plugin consent: {"consent-digest": "<digest of the message>"}). If the
  // user agrees, invoke again with these args merged over the original ones and
  // confirmed set; unlike args it is not a second stage, so the command's own presenter
  // still asks. A client applies them only to the command it invoked. The CLI's --yes
  // never sees this confirmation and sends none: the command then does what it does
  // today.
  map<string, string> bind = 6;
  // The confirm button's words when the command names them ("Forget all"); empty: the
  // title without a "Category: " prefix.
  string confirm_label = 7;
}

// CommandFailed is the error detail of an Invoke whose command could not do what it was
// asked on its own terms, not because the caller got it wrong: a plugin's command
// answered with an error, or its plugin is not running. The code still says what kind
// of failure it is (InvalidArgument, FailedPrecondition); clients show the message as it
// is, and the CLI exits 1 (not 2, its usage status) without pointing at help.
message CommandFailed {
  string command = 1;
}
