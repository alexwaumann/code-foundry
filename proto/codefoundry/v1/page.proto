syntax = "proto3";

package codefoundry.v1;

// PageService answers for the HTML pages the GUI shows in frames with the bridge
// (docs/notes/page-ownership-daemon.md): who owns a page file, whether the user allowed a
// page no thread owns, and the bridge's cf.storage and cf.fetch for such a page. The
// daemon keeps every answer, so the GUI never needs a thread's log to decide. The user's
// answer is changed only by the page.allow and page.disallow commands
// (CommandService.Invoke), so the GUI's question, the palette and the CLI run the same
// thing.
//
// A page is named by its file's path (absolute, or "~/"-prefixed); the daemon resolves
// its symlinks, and every answer is keyed by the resolved path (PageAccess.path). A path
// that is not a regular .html or .htm file under home (or a thread's pages directory) is
// InvalidArgument, a missing file NotFound, and a file in a folder the preview never
// serves (Code Foundry's own data, credentials, ~/Library) PermissionDenied.
service PageService {
  // GetPage says who owns the page and whether it may use the bridge.
  rpc GetPage(GetPageRequest) returns (GetPageResponse) {}
  // PageStorage is what a page keeps with cf.storage: one JSON object per page file,
  // whichever thread the page acts for and whether or not a thread owns it
  // (docs/notes/page-storage-per-file.md), handed back to the page as it loads. Any page
  // the bridge is given may use it: one a thread owns, or one the user allowed.
  // FailedPrecondition while no thread owns the page and the user has not answered for
  // it (NOT_ASKED), PermissionDenied when they did not allow it.
  rpc PageStorage(PageFileStorageRequest) returns (PageFileStorageResponse) {}
  // SetPageStorage sets or removes one key of a page's storage and returns the storage
  // after. InvalidArgument for an empty or too long key (1 KiB), a value that is not
  // JSON, or a storage that would grow over 256 KiB per page (nothing is written then).
  // The consent errors of PageStorage.
  rpc SetPageStorage(SetPageFileStorageRequest) returns (SetPageFileStorageResponse) {}
  // ProxyFetch is ThreadService.ProxyFetch for a page no thread owns: the same rules,
  // limits and errors, at most 8 requests at once per page file (more wait). The consent
  // errors of PageStorage.
  rpc ProxyFetch(PageProxyFetchRequest) returns (PageProxyFetchResponse) {}
}

// The user's answer for a page, and whether the page may use the bridge.
enum PageConsent {
  // An older daemon: no answer; read FilesystemService.PreviewFile's page_thread alone.
  PAGE_CONSENT_UNSPECIFIED = 0;
  // A thread owns the page (owner_thread): allowed without asking.
  PAGE_CONSENT_OWNED = 1;
  // No thread owns it and the user allowed it: the bridge without a thread.
  PAGE_CONSENT_ALLOWED = 2;
  // No thread owns it and the user did not allow it: no bridge, not asked again.
  PAGE_CONSENT_REFUSED = 3;
  // No thread owns it and the user has not answered: ask (page.allow, page.disallow).
  PAGE_CONSENT_NOT_ASKED = 4;
  // Not a page the bridge is ever given (a file outside home, not .html or .htm, a link
  // whose target is gone): no bridge, nothing to ask. Only in PreviewFileResponse.page.
  PAGE_CONSENT_UNAVAILABLE = 5;
}

// How a thread came to own a page.
enum PageOwnerSource {
  PAGE_OWNER_SOURCE_UNSPECIFIED = 0;
  // The thread showed it (view.inline, view.open.page), the last it did with the page.
  PAGE_OWNER_SOURCE_SHOWN = 1;
  // The thread's Claude wrote or edited it (Write, Edit, MultiEdit), the last it did
  // with the page.
  PAGE_OWNER_SOURCE_WRITTEN = 2;
  // It lies in the thread's pages directory (<home>/pages/<thread id>/), and the thread
  // neither showed nor wrote it.
  PAGE_OWNER_SOURCE_PAGES_DIRECTORY = 3;
}

// PageOwner is one thread that owns a page.
message PageOwner {
  string thread_id = 1;
  PageOwnerSource source = 2;
}

// PageAccess is what the daemon says about one page file.
message PageAccess {
  // The file's absolute path with its symlinks resolved: the key the answer, the storage
  // and the fetch cap are kept by. Empty with UNAVAILABLE when it could not be resolved.
  string path = 1;
  // The page's first owner (owners[0]): the thread a page acts for where no thread of its
  // own is given, such as a File tab linked to a thread that is not one of its owners
  // (docs/notes/page-storage-per-file.md). It stays the same while that thread exists,
  // whoever shows or writes the page later. Empty: no thread owns it.
  string owner_thread = 2;
  // How owner_thread came to own the page.
  PageOwnerSource owner_source = 3;
  // Whether the page may use the bridge: OWNED and ALLOWED may.
  PageConsent consent = 4;
  // The user's own answer, kept even while a thread owns the page (it counts once none
  // does): ALLOWED, REFUSED or NOT_ASKED.
  PageConsent answer = 5;
  // Why the page is UNAVAILABLE, for the frame's notice.
  string unavailable_reason = 6;
  // Every thread that owns the page: each that showed or wrote it, and the thread whose
  // pages directory holds it; that thread first, then the others by when they first
  // showed or wrote it, oldest first. A removed thread's claim goes with it; the page is
  // no thread's only once none is left. A File tab acts for its own thread when that is
  // one of them, else for owner_thread; a thread's card acts for its thread.
  repeated PageOwner owners = 7;
  // The page's cf.storage is its file's (PageService.PageStorage), whichever thread the
  // page acts for. Set by every daemon that keeps storage per page file; unset (an older
  // daemon), a thread's page keeps it in the thread's (ThreadService.PageStorage).
  bool storage_per_file = 8;
}

message GetPageRequest {
  string path = 1;
}

message GetPageResponse {
  PageAccess page = 1;
}

message PageFileStorageRequest {
  string path = 1;
}

message PageFileStorageResponse {
  // Key → the value's JSON text, as the page stored it.
  map<string, string> values = 1;
}

message SetPageFileStorageRequest {
  string path = 1;
  string key = 2;
  // The value's JSON text; unset removes the key.
  optional string value = 3;
}

message SetPageFileStorageResponse {
  // The page's storage after the change.
  map<string, string> values = 1;
}

message PageProxyFetchRequest {
  // The page's file.
  string path = 1;
  // An absolute http or https URL.
  string url = 2;
  // GET when empty.
  string method = 3;
  // Header name → value, as the page set them.
  map<string, string> headers = 4;
  bytes body = 5;
  // 30 s when zero; at most 120 s.
  uint32 timeout_ms = 6;
}

message PageProxyFetchResponse {
  uint32 status = 1;
  // Lower-case header name → value, several values joined with ", "; no Set-Cookie.
  map<string, string> headers = 2;
  bytes body = 3;
  // The URL answered, after redirects.
  string url = 4;
  // The status's text ("Not Found"), without the code.
  string status_text = 5;
}

// PageEvent says which pages the daemon may now answer otherwise for (an owner, the user's
// answer), so a client showing one reads its answer again (FilesystemService.PreviewFile or
// GetPage) and every frame on it follows: a page refused in one window or from the CLI stops
// in every window, and a page whose last owning thread is removed is asked about again. It is
// EventService's page source (EVENT_SOURCE_PAGE). It names pages, never their answer, and
// may name one whose answer did not change. It also names pages whose storage changed
// (storage_paths), never the values.
message PageEvent {
  // The resolved paths (PageAccess.path) that got an owner (owners) or another answer.
  repeated string paths = 1;
  // A thread that was removed: every page it owned lost it from owners (and has no owner
  // now when it was the last).
  string removed_thread = 2;
  // Any page may have changed: the source's snapshot (on connect, and after the client
  // missed events). Read every page shown again. Its storage too.
  bool all = 3;
  // The resolved paths whose cf.storage a write changed (SetPageStorage), from any client:
  // a client with frames on one reads it again (PageStorage) and hands it to them, so every
  // open copy of a page hears another's write (docs/notes/page-storage-change-event.md). Not
  // a change of answer: paths stays empty for it. An event names only one of the two.
  repeated string storage_paths = 4;
}
