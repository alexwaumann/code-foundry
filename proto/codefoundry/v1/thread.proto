syntax = "proto3";

package codefoundry.v1;

import "codefoundry/v1/heartbeat.proto";
import "codefoundry/v1/theme.proto";
import "codefoundry/v1/thread_lifecycle.proto";
import "codefoundry/v1/thread_prompts.proto";
import "codefoundry/v1/thread_subscriptions.proto";
import "google/protobuf/timestamp.proto";

// ThreadService manages threads, the primary unit of the app, and drives their
// conversations. A thread runs Claude Code headlessly (claude -p over stream-json) and
// the daemon records the conversation as items the GUI draws. A connected thread owns
// one claude process; a disconnected thread owns none and the next message resumes it
// (claude --resume). The lifecycle messages (Thread, CreateThreadRequest, ...) are in
// thread_lifecycle.proto. See docs/notes/rendered-threads-1-daemon.md and
// docs/notes/rendered-only.md.
service ThreadService {
  // Create spawns claude in a worktree and returns the thread in STARTING state.
  rpc Create(CreateThreadRequest) returns (CreateThreadResponse) {}
  // Fork starts a new thread that continues an existing thread's conversation.
  rpc Fork(ForkThreadRequest) returns (ForkThreadResponse) {}
  // List returns all threads.
  rpc List(ListThreadsRequest) returns (ListThreadsResponse) {}
  // Get returns one thread.
  rpc Get(GetThreadRequest) returns (GetThreadResponse) {}
  // Wait blocks until a thread meets a condition (ThreadWaitCondition), returning at
  // once when it already does, or until the timeout (timed_out set, not an error). It
  // follows the thread list's changes, never polls. NOT_FOUND for an unknown thread or
  // one removed while waiting. The thread.wait command (docs/notes/agents-1-wait-events.md).
  rpc Wait(WaitThreadRequest) returns (WaitThreadResponse) {}
  // Rename sets a user-chosen name and disables auto-naming for the thread.
  rpc Rename(RenameThreadRequest) returns (RenameThreadResponse) {}
  // RegenerateName names the thread again with the naming model, from its most recent
  // turns (the last three user messages and the replies around them), replacing any
  // name, a hand-typed one too. It ignores threads.auto_name; threads.naming_model
  // applies. Synchronous: it returns the renamed thread once the model answered, bounded
  // by the naming timeout. While it runs the thread's naming flag is set. FAILED_PRECONDITION
  // for a resident thread, a thread with no user message yet, or one already being
  // renamed. See docs/notes/regenerate-thread-name.md.
  rpc RegenerateName(RegenerateNameRequest) returns (RegenerateNameResponse) {}
  // Close ends the Claude process gracefully (interrupt, stdin closed, bounded wait,
  // then kill). The thread remains, DISCONNECTED, until Remove. No command calls it
  // since 2026-10-15: the daemon starts a thread's process when a message is sent
  // (Send) and stops it at the prompt cache expiry (docs/notes/thread-lifecycle.md).
  // Kept for compatibility.
  rpc Close(CloseThreadRequest) returns (CloseThreadResponse) {}
  // Reconnect resumes a DISCONNECTED thread in a new claude process, without a
  // prompt. No command calls it since 2026-10-15 (a message starts a stopped thread).
  // Kept for compatibility.
  rpc Reconnect(ReconnectThreadRequest) returns (ReconnectThreadResponse) {}
  // Remove forgets a thread. Stops its Claude first if it runs. Removing also removes,
  // the same way and first, every thread below it that is not shown in the sidebar
  // (Thread.in_sidebar), through hidden threads only, archived ones included: a shown
  // thread and everything below it stays (ThreadFilter.archive_cascade_of lists them,
  // with include_archived). A thread of those that fails is skipped, shown in the
  // sidebar and named in the error, which then comes after the thread itself was removed.
  rpc Remove(RemoveThreadRequest) returns (RemoveThreadResponse) {}
  // RunIn moves a thread's cwd to another of its checkouts (Checkouts): that member
  // becomes the primary. A live thread gets set_cwd once it is idle
  // (pending_worktree_path shows the queued target until then) and the row's
  // worktree_path and project_id change when Claude accepts it. A disconnected thread's
  // row changes at once; the next start resumes there. Refused for a thread without a
  // project and for a target that is not one of its checkouts.
  rpc RunIn(RunInThreadRequest) returns (RunInThreadResponse) {}
  // AddProject adds a project to a thread's set. Its checkout is placed by Create's rule:
  // in worktree mode a git project's worktree for the thread's branch (shared when one
  // is on it, else made; Create's refusals for a main checkout on the branch or a
  // default path holding another checkout), a plain folder its folder; in checkout mode
  // the project's own checkout. RemoveProject drops a member: refused for the cwd's
  // project; its checkout stays on disk. Either clears the thread's workspace_id (it no
  // longer follows that workspace; the workspace is untouched) and adds a timeline
  // note. A live Claude restarts, resuming the conversation, for its new --add-dir list
  // once it is idle at its prompt; a stopped thread takes it at its next start. Refused
  // for a thread without a project and for one running in its workspace's folder. See
  // docs/notes/thread-project-set.md.
  rpc AddProject(AddThreadProjectRequest) returns (AddThreadProjectResponse) {}
  rpc RemoveProject(RemoveThreadProjectRequest) returns (RemoveThreadProjectResponse) {}
  // Checkouts resolves a thread (by id, else the thread one of whose checkouts holds the
  // cwd, the deepest winning) and lists one checkout per project in its set: the primary
  // at its cwd; in worktree mode a git member's worktree on the thread's branch, a plain
  // folder the folder; otherwise each member's own checkout. See
  // docs/notes/workspaces-v2-1-threads.md.
  rpc Checkouts(ThreadCheckoutsRequest) returns (ThreadCheckoutsResponse) {}
  // CheckPlacement reports where a new thread with these projects, branch and mode would
  // go, per project, without making or changing anything: a new worktree at a path, an
  // existing checkout it would share, a plain folder, or the refusal Create would give
  // (with its message). It runs Create's own placement checks, so the two agree; like and
  // creator inheritance are not considered. See docs/notes/thread-info-facts.md.
  rpc CheckPlacement(CheckPlacementRequest) returns (CheckPlacementResponse) {}
  // Pin pins or unpins a thread. Pinned threads sit in their own section at the top of
  // the GUI's thread list. Persisted; any state.
  rpc Pin(PinThreadRequest) returns (PinThreadResponse) {}
  // Archive archives or unarchives a thread. Archiving ends Claude gracefully like
  // Close (the thread is DISCONNECTED), kills and removes the thread's shells, unpins
  // it and records archived_at (kept when it is already archived). Unarchiving only
  // clears archived_at: the thread stays disconnected until a Reconnect. Reconnect,
  // Pin (pinned) and Send unarchive a thread implicitly. Persisted; any state.
  // Archiving also archives, the same way and first, every thread below it that is not
  // shown in the sidebar (Thread.in_sidebar), through hidden threads only: a shown
  // thread and everything below it stays (ThreadFilter.archive_cascade_of lists them).
  // A thread of those that fails is skipped and named in the error, which then comes
  // after the thread itself was archived. Unarchiving does not cascade.
  rpc Archive(ArchiveThreadRequest) returns (ArchiveThreadResponse) {}
  // SetSidebar shows or hides a thread another thread created in the GUI's sidebar
  // (Thread.in_sidebar), overriding the threads.show_created_threads setting for it:
  // shown hands it to the user, hidden back to its creator. INVALID_ARGUMENT for a
  // thread the user created (always shown). Persisted; any state.
  rpc SetSidebar(SetThreadSidebarRequest) returns (SetThreadSidebarResponse) {}
  // SetWorkspace sets or clears a thread's workspace reference (Thread.workspace_id:
  // the workspace whose instructions and skills reach the thread); workspace is an id or
  // a name, "" clears it. The project set does not change. Persisted; any state; it
  // applies from the thread's next spawn (a live process keeps what it started with).
  // NOT_FOUND for an unknown workspace; FAILED_PRECONDITION to clear or change the
  // reference of a thread whose primary is its workspace's folder (empty project_id with
  // a workspace_id), whose cwd is that folder.
  rpc SetWorkspace(SetThreadWorkspaceRequest) returns (SetThreadWorkspaceResponse) {}
  // Snooze snoozes a thread until a time, or unsnoozes it (until unset). Snoozing ends
  // Claude gracefully like Close (the thread is DISCONNECTED), kills and removes the
  // thread's shells, unpins and unarchives it and records snoozed_until (a re-snooze
  // replaces it). until must be in the future (INVALID_ARGUMENT otherwise). When the
  // time comes the daemon wakes the thread: snoozed_until is cleared and the thread,
  // still disconnected, becomes NEEDS_ATTENTION "snooze ended" (status_changed_at = the
  // wake time). Unsnoozing before then only clears snoozed_until. Reconnect, Pin
  // (pinned), Send and Archive (archived) clear a snooze implicitly. Persisted.
  rpc Snooze(SnoozeThreadRequest) returns (SnoozeThreadResponse) {}
  // Label adds and removes a thread's labels (clear first, then remove, then add) and
  // returns the thread. Any state. Persisted. See docs/notes/agents-2-metadata.md.
  rpc Label(LabelThreadRequest) returns (LabelThreadResponse) {}
  // Report records the thread's report (status, summary, JSON data), replacing the
  // previous one, stamped report_at. Any state. Persisted.
  rpc Report(ReportThreadRequest) returns (ReportThreadResponse) {}
  // SetBudget sets the thread's spending limit (Thread.budget_usd; 0 clears it). A
  // budget above the thread's cost re-arms the budget stop. Any state. Persisted.
  rpc SetBudget(SetThreadBudgetRequest) returns (SetThreadBudgetResponse) {}
  // ClearFlags removes plugins' flags from a thread (Thread.flags): one plugin's, or
  // every one with plugin empty. NOT_FOUND when the thread has none to clear.
  rpc ClearFlags(ClearThreadFlagsRequest) returns (ClearThreadFlagsResponse) {}
  // Subscribe makes a wake subscription: when the target (a thread, or an action run)
  // meets the condition, the daemon sends the subscriber a message (a user_message item
  // with origin WAKE) through Send, which starts a stopped subscriber and unsnoozes it.
  // Edge-triggered, and once at once when the target already meets the condition.
  // FAILED_PRECONDITION for a subscription to itself or the reverse of an existing one.
  // See docs/notes/agents-4-wake.md.
  rpc Subscribe(SubscribeThreadRequest) returns (SubscribeThreadResponse) {}
  // Unsubscribe removes a subscription by id, or every subscription of a subscriber to a
  // target. NOT_FOUND when nothing matched.
  rpc Unsubscribe(UnsubscribeThreadRequest) returns (UnsubscribeThreadResponse) {}
  // ListSubscriptions lists one subscriber's subscriptions, or every thread's.
  rpc ListSubscriptions(ListThreadSubscriptionsRequest) returns (ListThreadSubscriptionsResponse) {}
  // Watch streams changes to the thread list (every thread's record, not its items).
  // The first event is a snapshot. WatchThread streams one thread's conversation.
  rpc Watch(WatchThreadsRequest) returns (stream ThreadListEvent) {}
  // StageAttachment stores an image or PDF a message refers to and returns its path.
  // The file comes as bytes or as an absolute path the daemon reads (a file dropped on
  // or picked in the GUI). Create and Send append an "Attached image: <path>" or "Attached PDF: <path> (<N>
  // pages)" line per attachment and send its content as an image or document block; a
  // PDF over 10 pages goes only as its path, and Claude reads it with its Read tool.
  // Only image types and PDFs are accepted, with size limits (images 10 MiB, PDFs
  // 20 MiB, 24 MiB sent inline per message); unused staged files are reaped by the
  // daemon.
  rpc StageAttachment(StageAttachmentRequest) returns (StageAttachmentResponse) {}
  // ReadAttachment returns a staged attachment's bytes (a user message shows its
  // images and PDFs). Only files directly in the attachments directory;
  // NOT_FOUND once the file was reaped.
  rpc ReadAttachment(ReadAttachmentRequest) returns (ReadAttachmentResponse) {}

  // ListItems returns a thread's items (the streaming one included) and its pending
  // requests. Works while disconnected (items persist).
  rpc ListItems(ListThreadItemsRequest) returns (ListThreadItemsResponse) {}
  // ListPrompts lists the prompts the user sent in one thread, in the threads sharing a
  // project with it (or with a project set), or in every thread, newest first, from
  // their user_message items. Only the user's own: wake messages, messages another
  // thread sent (SendThreadMessageRequest.by_thread_id, a created thread's first prompt)
  // and attachment-only messages are left out, and so are threads a plugin owns and,
  // for PROJECT and ALL, hidden child threads. Archived threads count. See
  // docs/notes/prompt-history-1-daemon.md.
  rpc ListPrompts(ListPromptsRequest) returns (ListPromptsResponse) {}
  // WatchThread streams one thread: a snapshot first, then appended/updated items, text
  // deltas and pending-request changes. While a WatchThread is open the thread counts as
  // looked at: a finished turn is seen at once. Apply only
  // events whose seq is greater than the snapshot's.
  rpc WatchThread(WatchThreadRequest) returns (stream ThreadEvent) {}
  // Send sends a user message. Allowed while a turn runs: Claude queues it or folds it
  // in. A thread that is not running starts with the message as its first prompt: the
  // returned item is in the timeline at once, and a start that fails is an error item
  // ("Claude did not start: <reason>", status ERROR "did not start"), not an RPC error.
  // The RPC returns at once with the item: a message to a starting thread is delivered
  // after its handshake, one to a closing thread once a new process started after the
  // old one exited. A message whose first non-blank line starts with a
  // slash command the app replaces (/model, /effort, /fast, /mcp, /rename, /clear, and
  // the aliases /reset, /new, /name) is INVALID_ARGUMENT, nothing sent or recorded; the
  // error's message is a sentence pointing at the app's control, shown as it is.
  rpc Send(SendThreadMessageRequest) returns (SendThreadMessageResponse) {}
  // Respond answers a pending permission request or question. A thread that is not
  // running has none (FAILED_PRECONDITION).
  rpc Respond(RespondThreadRequest) returns (RespondThreadResponse) {}
  // Interrupt stops the running turn; pending requests are withdrawn. A no-op on a
  // thread that is not running.
  rpc Interrupt(InterruptThreadRequest) returns (InterruptThreadResponse) {}
  // SetModel switches a running thread's model (from its next request) and records it
  // for later spawns; on a thread that is not running it only records it.
  rpc SetModel(SetThreadModelRequest) returns (SetThreadModelResponse) {}
  // SetPermissionMode switches a thread's permission mode: SUPERVISED, ACCEPT_EDITS or
  // AUTO (UNSPECIFIED, Claude's default, cannot be selected live). On a thread that is
  // not running it only records it.
  rpc SetPermissionMode(SetThreadPermissionModeRequest) returns (SetThreadPermissionModeResponse) {}
  // SetEffort changes a thread's effort level. Claude has no live effort switch, so the
  // daemon restarts a running process with --resume and the new --effort: at once when
  // the thread is idle, else once the running turn ends (Thread.effort_pending says so
  // meanwhile). The row records the effort for later spawns either way; a thread that is
  // not running only records it.
  rpc SetEffort(SetThreadEffortRequest) returns (SetThreadEffortResponse) {}
  // Restart restarts a running thread's Claude process with the same conversation
  // (--resume), the way an effort change does, so it picks up what changed outside the
  // conversation, such as a plugin's session environment (Thread.plugin_env_stale). A
  // running turn is interrupted first (a pending permission request or question with
  // it); the thread's background agents and shells stop with the old process. Messages
  // sent meanwhile go to the new process. A thread whose Claude is not running is left
  // as it is (restarted false): its next message starts Claude with the current
  // environment anyway. See docs/notes/plugins-env-restart.md.
  rpc Restart(RestartThreadRequest) returns (RestartThreadResponse) {}
  // Reseed gives a thread a fresh Claude session with a seed: its next process starts
  // a new conversation (no --resume) with the request's system prompt append and
  // add-dirs, which replace the thread's (empty clears them) and every later spawn uses,
  // and the first message of that session starts with prefix (UserMessageItem.seed_prefix).
  // The thread's items are kept; Thread.epoch goes up by one, context_tokens goes to 0.
  // A thread idle at its prompt with nothing running stops at once; a working one stops
  // once its turn and background work end (Thread.reseed_pending meanwhile); a stopped
  // one only records it. What "allow for session" granted dies with the old process, as
  // at any stop; the MCP status is kept until the new process reports. Any thread may be
  // reseeded; a resident thread is the main user. See docs/notes/ember-1-primitives.md.
  rpc Reseed(ReseedThreadRequest) returns (ReseedThreadResponse) {}
  // StopShell stops one of the thread's own background shells (Thread.background_shells):
  // its process group gets SIGTERM, then SIGKILL 3 seconds later. A note in the thread's
  // conversation records it, and Claude learns of it as of any shell that ends. NOT_FOUND
  // when the thread runs no such shell; FAILED_PRECONDITION when its process cannot be
  // found. See docs/notes/thread-servers.md.
  rpc StopShell(StopThreadShellRequest) returns (StopThreadShellResponse) {}
  // McpStatus returns the thread's MCP servers as last checked. The daemon asks Claude
  // (mcp_status) at the start of every turn, again every few seconds while a server is
  // still connecting, and after McpReconnect; WatchThread carries each new answer (the `mcp`
  // event). The last answer is kept while the thread is not running, also across daemon
  // restarts. refresh asks Claude now, starting a stopped thread without a prompt.
  // Without it a running thread not checked yet is asked once; status is unset when
  // Claude never reported. See docs/notes/mcp-panel.md.
  rpc McpStatus(McpStatusRequest) returns (McpStatusResponse) {}
  // McpReconnect reconnects one MCP server of a thread, starting a stopped thread
  // without a prompt (also how a login made out of band, `claude /mcp` in a shell, is
  // picked up), then checks the servers again.
  // A server that still fails is not an RPC error: the response's error says why and the
  // status shows it. An unknown server is NOT_FOUND.
  rpc McpReconnect(McpReconnectRequest) returns (McpReconnectResponse) {}
  // SlashCommands returns the slash commands a running thread offers (the composer's
  // "/" completion): what Claude reported in its initialize reply, replaced by each
  // list it pushes when skills change, minus the commands the daemon denies (replaced by
  // the app's own controls, terminal-only, or retired; never a skill or a user, project
  // or plugin command). In Claude's order: its skills, then its built-ins, then plugin
  // skills. What Claude last reported, kept while the thread is not running (also across
  // daemon restarts); empty when it never answered a handshake. WatchThread carries every change (the
  // `commands` event). See docs/notes/slash-commands-1-daemon.md.
  rpc SlashCommands(SlashCommandsRequest) returns (SlashCommandsResponse) {}
  // ShowHtml shows an HTML page inline in a thread's conversation: an `html` item at the
  // thread's current position (inside the running turn when one is live, else after the
  // last item), which the GUI renders as a sandboxed frame (code-foundry view.inline;
  // docs/notes/inline-html.md). The file must be a regular .html or .htm file under the
  // home directory (InvalidArgument otherwise, NotFound when missing).
  rpc ShowHtml(ShowThreadHtmlRequest) returns (ShowThreadHtmlResponse) {}
  // ShowTheme puts a theme card in a thread's conversation: a `theme` item at the thread's
  // current position, as ShowHtml places a page. code-foundry theme save adds one when it
  // runs from the thread (docs/notes/theme-model-flow.md). The theme must be a valid theme
  // file (InvalidArgument otherwise); nothing is written to the themes directory.
  rpc ShowTheme(ShowThreadThemeRequest) returns (ShowThreadThemeResponse) {}
  // PageStorage returns what the thread's pages keep with the bridge's cf.storage: the
  // GUI host hands it to a page as it loads (docs/notes/bridge-fix-storage.md). Kept by
  // the daemon, one file per thread, because WebKit keeps a page frame's own
  // localStorage for the session only. NotFound for an unknown thread.
  rpc PageStorage(PageStorageRequest) returns (PageStorageResponse) {}
  // SetPageStorage sets or removes one key of a thread's page storage and returns the
  // storage after. InvalidArgument for an empty or too long key (1 KiB), a value that is
  // not JSON, or a storage that would grow over 256 KiB (nothing is written then).
  rpc SetPageStorage(SetPageStorageRequest) returns (SetPageStorageResponse) {}
  // ProxyFetch makes one HTTP request for a page of the thread (the bridge's cf.fetch,
  // docs/notes/bridge-fetch.md): the daemon is not subject to the browser's CORS check, so
  // a page reaches an API that does not allow the pages origin. No cookies, no Origin, no
  // Code Foundry token; up to 5 redirects of the same scheme; a request body of 1 MiB and a
  // response body of 8 MiB at most; at most 8 at once per thread (more wait). A non-2xx
  // status is a response, not an error. InvalidArgument for a bad URL, a scheme other than
  // http(s), a header the daemon does not send, a body too big or a destination it refuses
  // (loopback, link-local, unspecified, the daemon's own ports); DeadlineExceeded after
  // timeout_ms; ResourceExhausted for a response too big; Unavailable for a network error;
  // NotFound for an unknown thread. Cancelling the call aborts the request.
  rpc ProxyFetch(ProxyFetchRequest) returns (ProxyFetchResponse) {}
}

// One entry of a rendered thread's conversation. The payload's case is the kind.
message ThreadItem {
  // Stable for the item's life (the user message's uuid, "<message id>/<index>" for
  // text and thinking, the tool_use id, "perm-"/"q-" + the request id, ...).
  string id = 1;
  // Order in the thread: assigned when the item first appears, only grows, not dense.
  int64 ordinal = 2;
  // The Agent tool_use a subagent's item belongs to; empty for the thread's own.
  string parent_tool_use_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  // Still arriving: text and tool input grow through deltas until an update with
  // streaming false.
  bool streaming = 6;
  // A user message Claude read later than it arrived (it was queued while Claude worked):
  // the ordinal of the item it is shown after, behind any other message placed there with
  // a smaller ordinal. 0 for every other item. Order the log by (placed_after or ordinal,
  // placed, ordinal); the ordinal stays what since/after compare
  // (docs/notes/orch-queued-placement.md).
  int64 placed_after = 7;
  oneof payload {
    UserMessageItem user_message = 10;
    AssistantTextItem assistant_text = 11;
    ThinkingItem thinking = 12;
    ToolCallItem tool_call = 13;
    // A permission prompt (can_use_tool), or a call denied without one.
    ThreadRequestItem permission = 14;
    // An AskUserQuestion prompt.
    ThreadRequestItem question = 15;
    TurnEndItem turn_end = 16;
    ErrorItem error = 17;
    CompactionItem compaction = 18;
    CommandOutputItem command_output = 19;
    // A line the daemon adds, not Claude (a fork's "Forked from <parent>").
    NoteItem note = 20;
    // An HTML page shown inline (ThreadService.ShowHtml).
    HtmlItem html = 21;
    // A theme the thread saved (ThreadService.ShowTheme).
    ThemeItem theme = 22;
  }
}

// An HTML page the model showed inline (code-foundry view.inline). The GUI renders the
// file live in a sandboxed frame (FilesystemService.PreviewFile), from disk each time.
message HtmlItem {
  // Relative to the thread's cwd when the file is inside it, else absolute.
  string path = 1;
  // The page's title as the caller gave it; empty: the GUI shows the file name.
  string title = 2;
  // The thread's cwd when the item was made: the base a relative path resolves against.
  string base_dir = 3;
}

// A theme the thread saved (code-foundry theme save from the thread;
// docs/notes/theme-model-flow.md). The GUI draws a card from the file as it was saved, so a
// later save of the same id (another card) leaves this one as it was.
message ThemeItem {
  // The file as saved: id, name, scheme, from, pair, base and pins (path is empty).
  UserTheme theme = 1;
  // The save changed what a slot shows: --apply, or a save of the theme a slot already has.
  bool applied = 2;
  // When applied: what the slot showed immediately before this save, which Undo puts back
  // (docs/notes/theme-fuzz-daemon.md): another theme's id, or this theme's own id with
  // previous_version when the save replaced the theme the slot already showed. Empty when
  // there is nothing to undo (unknown, or a save that changed no colour). Undo is offered
  // only while the slot still shows this card's colours.
  string previous = 3;
  // With previous = this theme's id: the version of its file this save replaced, kept in
  // the themes directory's history (theme.restore puts it back).
  string previous_version = 4;
  // What previous (and previous_version) name was not there to put back when the card was
  // made (a slot on a theme that is gone, a version that could not be kept). The GUI
  // checks again against the themes it has (a theme deleted since, a version dropped).
  bool previous_gone = 5;
}

// What the user sent: text as sent (file tags stay "@cf-file://<project id>/<path>" tokens,
// not the paths Claude got) and, when it came from the GUI's composer, the composer's
// own text, from which the GUI draws the message's tags.
message UserMessageItem {
  string text = 1;
  // Staged image and PDF paths (StageAttachment); Claude got each as a path line and,
  // unless a PDF over 10 pages, an image or document block.
  repeated string attachments = 2;
  // The composer's text with its tags as Markdown-link tokens (gui lib/prompt.ts):
  // "[/name](cf-skill://<project id or ~>/<name>)", "[base](cf-file://<project id>/<path>)",
  // and "![name](cf-attachment://<n>)" where n is the attachment's index in
  // attachments (not a number: the chip had lost its file). Empty for a message without tags or sent
  // without the composer (the CLI): text is then shown as is. Stored, never interpreted.
  string composer_text = 3;
  // Who sent it: the user (USER; UNSPECIFIED on items from before the field), or the
  // daemon for a wake subscription (WAKE: text is the header line and a fenced JSON
  // block, as Claude got it; docs/notes/agents-4-wake.md).
  MessageOrigin origin = 4;
  // WAKE only: the header line without its "[code-foundry wake] " prefix, e.g.
  // `Thread "Fix the login" (s-…) is idle: finished.`
  string wake_title = 5;
  // WAKE only: the JSON payload of the fenced block (kind, subscription_id, condition,
  // fired_at, and the thread or the run).
  string wake_json = 6;
  // The resume note Claude got before the text, when something other than the user
  // (the budget stop, another thread's interrupt, an app restart) stopped its previous
  // turn: one line starting "[code-foundry] " (docs/notes/orch-child-context.md).
  // Empty for most messages.
  string resume_note = 7;
  // Claude has the message but has not read it yet: it came while Claude worked, and Claude
  // reads it at its next tool call or when its reply ends. Once read the flag clears and
  // the item moves there (ThreadItem.placed_after).
  bool queued = 8;
  // The seed prefix Claude got before the text (and the resume note): the first message
  // of a fresh session a ThreadService.Reseed asked for starts with it. Empty for most
  // messages.
  string seed_prefix = 9;
}

// MessageOrigin is who sent a user_message item.
enum MessageOrigin {
  // An item recorded before origins existed: the user's.
  MESSAGE_ORIGIN_UNSPECIFIED = 0;
  // The user (the GUI's composer, the CLI's thread send, an agent's CLI).
  MESSAGE_ORIGIN_USER = 1;
  // The daemon, for a wake subscription (ThreadService.Subscribe).
  MESSAGE_ORIGIN_WAKE = 2;
}

// One text block of Claude's reply (markdown).
message AssistantTextItem {
  string text = 1;
  // Claude Code's synthetic API-error message (the request failed: authentication,
  // rate limit, timeout, overload): text is its error wording, not a reply.
  bool api_error = 2;
}

// One thinking block. Text is usually empty: Claude streams only its progress.
message ThinkingItem {
  string text = 1;
}

enum ToolCallStatus {
  TOOL_CALL_STATUS_UNSPECIFIED = 0;
  TOOL_CALL_STATUS_RUNNING = 1;
  TOOL_CALL_STATUS_DONE = 2;
  // The tool failed, was denied, or the process ended before it finished.
  TOOL_CALL_STATUS_ERROR = 3;
}

message ToolCallItem {
  string tool_use_id = 1;
  // "Bash", "Read", "Write", "Edit", "Agent", "AskUserQuestion", "mcp__...", ...
  string name = 2;
  // The tool's input as JSON; partial JSON while streaming.
  string input_json = 3;
  ToolCallStatus status = 4;
  // The tool_result's text.
  string output = 5;
  bool is_error = 6;
  // The tool's structured result when Claude sent one (Write/Edit: filePath,
  // structuredPatch, originalFile; ...); empty when absent or over 256 KiB.
  string result_json = 7;
}

enum ThreadRequestState {
  THREAD_REQUEST_STATE_UNSPECIFIED = 0;
  THREAD_REQUEST_STATE_PENDING = 1;
  // Allowed; a question: answered.
  THREAD_REQUEST_STATE_ALLOWED = 2;
  THREAD_REQUEST_STATE_DENIED = 3;
  // Withdrawn by Claude (an interrupt) or the process ended first.
  THREAD_REQUEST_STATE_CANCELLED = 4;
}

// A can_use_tool request (permission or AskUserQuestion) and its resolution.
message ThreadRequestItem {
  // Answer with ThreadService.Respond(request_id). Empty for an auto-denied call.
  string request_id = 1;
  string tool_name = 2;
  string display_name = 3;
  string title = 4;
  // What the call touches, e.g. a file name.
  string description = 5;
  // The tool_call item this request is about.
  string tool_use_id = 6;
  // Set when a subagent asked.
  string agent_id = 7;
  string blocked_path = 8;
  string decision_reason = 9;
  // The tool's input JSON. A question's: {"questions": [{question, header, options:
  // [{label, description}], multiSelect}]}.
  string input_json = 10;
  // Claude's permission_suggestions (JSON); "allow for session" applies them. Empty
  // when there are none.
  string suggestions_json = 11;
  ThreadRequestState state = 12;
  // "allow", "allow_session", "deny" or "auto_denied" once resolved.
  string decision = 13;
  // The deny message, or why it was cancelled or auto-denied.
  string message = 14;
  // A question's answers: question -> chosen label(s), several joined with ", ".
  map<string, string> answers = 15;
}

// The end of a turn (Claude's result).
message TurnEndItem {
  // "success", "error_during_execution", "error_max_turns", ...
  string subtype = 1;
  bool is_error = 2;
  // Stopped by an interrupt.
  bool interrupted = 3;
  string stop_reason = 4;
  string terminal_reason = 5;
  int64 duration_ms = 6;
  int32 num_turns = 7;
  // Claude's cost estimate for the process so far (cumulative over its turns). The
  // turn's own is turn_cost_usd.
  double cost_usd = 8;
  int64 input_tokens = 9;
  int64 output_tokens = 10;
  int64 cache_read_tokens = 11;
  int64 cache_write_tokens = 12;
  repeated string errors = 13;
  // This turn's cost: the difference of Claude's running total from the previous
  // result of the same process, or for a process's first turn from the totals Claude
  // restored on --resume (the daemon reads them from the transcript). Unset when the
  // daemon could not tell (an interrupt that reported no total, totals that do not fit
  // what Claude should have restored) and on turns recorded before it computed it.
  optional double turn_cost_usd = 14;
  // The model of the turn's own replies as Claude names it ("claude-haiku-5-5"); empty
  // when the turn had none (a local command, an interrupt before any reply) or was
  // recorded before the daemon kept it.
  string model = 15;
}

// Something that went wrong outside a turn's result (the process failed to start or
// exited mid-turn).
message ErrorItem {
  string text = 1;
}

// A compaction (/compact or automatic).
message CompactionItem {
  // "manual" or "auto".
  string trigger = 1;
  int64 pre_tokens = 2;
  int64 post_tokens = 3;
  // The summary Claude continues from, once it arrived.
  string summary = 4;
}

// A local slash command's output (/cost, /compact's "Compacted", ...).
message CommandOutputItem {
  string text = 1;
}

// A system line in the conversation: something the daemon records about the thread
// rather than anything Claude said or did. A fork's items start with a copy of its
// parent's, ended by the note "Forked from <parent's name at fork time>".
message NoteItem {
  string text = 1;
  // The creator thread's id when this is the "Created by <name> · brief: <brief>" note
  // the daemon writes at the top of a thread another thread's agent made (a fork's copy
  // of it keeps it); empty for every other note. The GUI resolves it against the thread
  // list for the creator's current name; the text keeps the name at creation, the
  // fallback for a removed creator.
  string created_by = 2;
}

// A request waiting on the user.
message ThreadPendingRequest {
  string request_id = 1;
  // The permission or question item.
  string item_id = 2;
  bool question = 3;
  string tool_name = 4;
  // One line: "Write hello.txt", or the question.
  string summary = 5;
}

message ThreadItemsSnapshot {
  string thread_id = 1;
  // The thread's event sequence number included in the snapshot.
  uint64 seq = 2;
  repeated ThreadItem items = 3;
  repeated ThreadPendingRequest pending = 4;
  // The thread's MCP servers as last checked, kept while it is not running; unset when
  // Claude never reported them.
  ThreadMcpStatus mcp = 5;
  // The slash commands the thread offers (ThreadService.SlashCommands), kept while it
  // is not running; empty when Claude never answered a handshake.
  repeated SlashCommand commands = 6;
  // The thread's subagent runs, in spawn order (never reordered by status); also while
  // it is not running (the runs persist). See docs/notes/agents-1-daemon.md.
  repeated ThreadAgentRun agents = 7;
}

// Text appended to a streaming item.
message ThreadItemDelta {
  string thread_id = 1;
  uint64 seq = 2;
  string item_id = 3;
  int64 ordinal = 4;
  enum Field {
    FIELD_UNSPECIFIED = 0;
    // assistant_text.text or thinking.text.
    FIELD_TEXT = 1;
    // tool_call.input_json (partial JSON).
    FIELD_INPUT = 2;
  }
  Field field = 5;
  string text = 6;
}

message ThreadItemChange {
  string thread_id = 1;
  uint64 seq = 2;
  ThreadItem item = 3;
}

// A thread's pending requests changed (the whole list).
message ThreadPending {
  string thread_id = 1;
  uint64 seq = 2;
  repeated ThreadPendingRequest pending = 3;
}

// The pending requests of every rendered thread that has any: EventService's
// snapshot for the thread source. Replace what you have.
message ThreadPendingSnapshot {
  repeated ThreadPending threads = 1;
}

message ThreadEvent {
  oneof event {
    // ThreadService.WatchThread's first event (and a resync after drops).
    ThreadItemsSnapshot snapshot = 1;
    // WatchThread only: items and their streaming deltas.
    ThreadItemChange appended = 2;
    ThreadItemChange updated = 3;
    ThreadItemDelta delta = 4;
    // WatchThread and EventService: the thread's pending requests changed.
    ThreadPending pending = 5;
    // EventService only: the snapshot of the thread source.
    ThreadPendingSnapshot pending_snapshot = 6;
    // WatchThread only: the thread's MCP servers were checked again.
    ThreadMcpChange mcp = 7;
    // WatchThread only: the thread's slash commands changed (Claude's list changed).
    ThreadSlashCommandsChange commands = 8;
    // WatchThread only: nothing else was sent for a while (see StreamHeartbeat). It does not
    // advance seq.
    StreamHeartbeat heartbeat = 9;
    // WatchThread only: the thread's subagent runs changed (the whole list). A run's status,
    // report or a new run comes at once; its progress (activity, last tool, counters) at
    // most once a second.
    ThreadAgentsChange agents = 10;
  }
}

// An MCP server's status as Claude reports it.
enum McpServerStatus {
  // A status this daemon does not know (a newer Claude's).
  MCP_SERVER_STATUS_UNSPECIFIED = 0;
  MCP_SERVER_STATUS_CONNECTED = 1;
  // It could not start or connect; McpServer.error says why.
  MCP_SERVER_STATUS_FAILED = 2;
  // It needs a login (OAuth). Claude cannot log in headlessly: run `claude` in a
  // shell and use /mcp, then McpReconnect.
  MCP_SERVER_STATUS_NEEDS_AUTH = 3;
  // Still connecting.
  MCP_SERVER_STATUS_PENDING = 4;
  // Disabled in Claude's configuration: not passed to Claude.
  MCP_SERVER_STATUS_DISABLED = 5;
}

// What made the daemon check a thread's MCP servers.
enum McpCheckTrigger {
  MCP_CHECK_TRIGGER_UNSPECIFIED = 0;
  // system/init: the start of a turn.
  MCP_CHECK_TRIGGER_TURN_START = 1;
  // McpStatus asked for it (refresh, or the first read), or a follow-up while a server
  // was still connecting.
  MCP_CHECK_TRIGGER_REFRESH = 2;
  // After McpReconnect of ThreadMcpStatus.server.
  MCP_CHECK_TRIGGER_RECONNECT = 3;
}

// One tool of a connected MCP server. The hints are the ones the server set to true
// (MCP tool annotations); an unset read_only means the tool may write.
message McpTool {
  string name = 1;
  // Empty when Claude sends none (claude.ai connectors).
  string description = 2;
  bool read_only = 3;
  bool destructive = 4;
  // It reaches outside the server (the open web, other services).
  bool open_world = 5;
}

message McpServer {
  // The config key, untrusted text ("github", "claude.ai Gmail").
  string name = 1;
  McpServerStatus status = 2;
  // What a connected server says about itself.
  string server_name = 3;
  string version = 4;
  // Why it failed.
  string error = 5;
  // The configuration scope: user, project, local, dynamic, claudeai, managed, ...
  string scope = 6;
  // Where the definition came from: the scope names, plus plugin and sdk.
  string source = 7;
  // stdio, sse, http, sdk or claudeai-proxy.
  string transport = 8;
  // A connected server's tools, in Claude's order.
  repeated McpTool tools = 9;
}

// A thread's MCP servers at one check.
message ThreadMcpStatus {
  google.protobuf.Timestamp checked_at = 1;
  McpCheckTrigger trigger = 2;
  // The server reconnected (MCP_CHECK_TRIGGER_RECONNECT).
  string server = 3;
  // In Claude's order.
  repeated McpServer servers = 4;
}

// A thread's MCP status changed (ThreadService.WatchThread).
message ThreadMcpChange {
  string thread_id = 1;
  uint64 seq = 2;
  // Always set since 2026-10-15 (the status outlives the process); unset was "none any
  // more".
  ThreadMcpStatus status = 3;
}

// A subagent run's lifecycle.
enum ThreadAgentStatus {
  THREAD_AGENT_STATUS_UNSPECIFIED = 0;
  THREAD_AGENT_STATUS_RUNNING = 1;
  // Claude reported it completed.
  THREAD_AGENT_STATUS_DONE = 2;
  // Claude reported it failed, killed or stopped, or its process ended first.
  THREAD_AGENT_STATUS_FAILED = 3;
}

// One subagent run of a thread (an Agent tool call, foreground or background, also one
// spawned by another run), as the stream's task frames report it. A run woken again by
// SendMessage goes back to RUNNING in place (resumed_at). Persisted, with Thread.agent_runs.
message ThreadAgentRun {
  // Claude's agent id (the task id).
  string id = 1;
  // The Agent tool_use that spawned it: its thread item's id. Empty if unknown.
  string tool_use_id = 2;
  // The run that spawned this one (spawn_depth 2 and up); empty for the thread's own.
  string parent_id = 3;
  // The run's name: the Agent call's description.
  string description = 4;
  // "general-purpose", "Explore", ...
  string agent_type = 5;
  // As requested ("haiku"); empty when inherited from the thread.
  string model = 6;
  string effort = 7;
  // Launched in the background (run_in_background): the thread can go on meanwhile.
  bool background = 8;
  // 1: spawned by the thread; 2 and up: by another run.
  int32 spawn_depth = 9;
  ThreadAgentStatus status = 10;
  // What it is doing now (Claude's own line, e.g. "Running Sleep 6 seconds"), as of its
  // last progress; kept once it ends.
  string activity = 11;
  // Its latest tool's name.
  string last_tool = 12;
  // Claude's counters: the tokens of its latest request, its tool uses and running time
  // (summed over its wakes).
  int64 total_tokens = 13;
  int64 tool_uses = 14;
  int64 duration_ms = 15;
  // Its report once DONE (the handed-back report, else Claude's summary).
  string summary = 16;
  // Why it FAILED: Claude's summary, its status word ("stopped"), or "the thread's
  // process ended before the agent finished".
  string error = 17;
  // When it started (the order of the list), when SendMessage last woke it (unset if
  // never), when it last ended (unset while running and when unknown).
  google.protobuf.Timestamp started_at = 18;
  google.protobuf.Timestamp resumed_at = 19;
  google.protobuf.Timestamp ended_at = 20;
  // The note item that announced a background run's end ("Agent finished · ..."); empty
  // for none.
  string note_item_id = 21;
}

// A thread's subagent runs changed (ThreadService.WatchThread).
message ThreadAgentsChange {
  string thread_id = 1;
  uint64 seq = 2;
  // The whole list, in spawn order.
  repeated ThreadAgentRun agents = 3;
}

message ListThreadItemsRequest {
  string thread_id = 1;
  // Unset: the whole snapshot. Set: one page of items (ListThreadItemsResponse.page),
  // for an agent reading another thread (thread.read; docs/notes/agents-5-cli.md).
  ThreadItemsQuery query = 2;
}

message ListThreadItemsResponse {
  // Set when the request had no query.
  ThreadItemsSnapshot snapshot = 1;
  // Set when the request had a query.
  ThreadItemsPage page = 2;
}

// ThreadItemRole groups item kinds for ThreadItemsQuery.role.
enum ThreadItemRole {
  // Any item.
  THREAD_ITEM_ROLE_UNSPECIFIED = 0;
  // The user's messages (not wakes).
  THREAD_ITEM_ROLE_USER = 1;
  // Claude's text replies.
  THREAD_ITEM_ROLE_ASSISTANT = 2;
  // Tool calls, permission requests and questions.
  THREAD_ITEM_ROLE_TOOL = 3;
  // The daemon's notes.
  THREAD_ITEM_ROLE_NOTE = 4;
  // Wake messages (UserMessageItem.origin WAKE).
  THREAD_ITEM_ROLE_WAKE = 5;
}

// ThreadItemsQuery selects a page of a thread's items: those of role (every item when
// UNSPECIFIED); with since, the first last of them after it (oldest first, so paging
// with next_since leaves no gap), else the last last of them. last 0: no limit.
message ThreadItemsQuery {
  int32 last = 1;
  // An item id, or an ordinal in decimal: only items after it. NOT_FOUND for an id
  // that is not the thread's.
  string since = 2;
  ThreadItemRole role = 3;
}

message ThreadItemsPage {
  string thread_id = 1;
  repeated ThreadItem items = 2;
  // Pass as since to read on: the id of the page's last item, or of the last one before
  // a text still streaming (which the next read returns again, complete by then); the
  // request's since when the page has nothing settled. Items change after they were
  // read (a tool call gets its result, a request its answer): read from an earlier
  // since, or the whole snapshot, to see that.
  string next_since = 3;
  // More items match after this page (only with since and last).
  bool more = 4;
}

message WatchThreadRequest {
  string thread_id = 1;
}

message SendThreadMessageRequest {
  string thread_id = 1;
  // As typed; "@cf-file://<project id>/<path>" tags become absolute paths for Claude.
  string text = 2;
  // StageAttachment paths.
  repeated string attachments = 3;
  // The composer's text (UserMessageItem.composer_text), kept on the item for display.
  string composer_text = 4;
  // The thread that sends it (the CLI sends $CODE_FOUNDRY_THREAD); empty for the user.
  // Kept on the item, so prompt history (ListPrompts) leaves the message out.
  string by_thread_id = 5;
}

message SendThreadMessageResponse {
  // The user_message item.
  ThreadItem item = 1;
}

enum ThreadDecision {
  THREAD_DECISION_UNSPECIFIED = 0;
  THREAD_DECISION_ALLOW = 1;
  // Allow and apply Claude's permission suggestions for the rest of the session.
  THREAD_DECISION_ALLOW_FOR_SESSION = 2;
  THREAD_DECISION_DENY = 3;
}

message RespondThreadRequest {
  string thread_id = 1;
  string request_id = 2;
  ThreadDecision decision = 3;
  // A question's answers (required to allow one): question -> chosen label(s).
  map<string, string> answers = 4;
  // DENY: the user's reason. Claude sees it inside Claude Code's own rejection text
  // ("The user doesn't want to proceed with this tool use. … the user said: <message>");
  // without one, the plain rejection ("… STOP what you are doing and wait for the user to
  // tell you how to proceed."). A question is denied (skipped) the same way.
  string message = 5;
  // DENY: also stop the turn.
  bool interrupt = 6;
}

message RespondThreadResponse {
  // The resolved permission or question item.
  ThreadItem item = 1;
}

message InterruptThreadRequest {
  string thread_id = 1;
  // The thread that asks for it (the CLI sends $CODE_FOUNDRY_THREAD); empty for the
  // user. A turn another thread stopped leaves a resume note: the next message Claude
  // gets starts with a line saying who stopped it (docs/notes/orch-child-context.md).
  string by_thread_id = 2;
}

message InterruptThreadResponse {}

message SetThreadModelRequest {
  string thread_id = 1;
  string model = 2;
}

message SetThreadModelResponse {
  Thread thread = 1;
}

message SetThreadPermissionModeRequest {
  string thread_id = 1;
  PermissionMode permission_mode = 2;
}

message SetThreadPermissionModeResponse {
  Thread thread = 1;
}

message SetThreadEffortRequest {
  string thread_id = 1;
  // low, medium, high, xhigh or max.
  string effort = 2;
}

message SetThreadEffortResponse {
  // effort_pending is set when the restart waits for the running turn.
  Thread thread = 1;
}

message RestartThreadRequest {
  string id = 1;
}

message RestartThreadResponse {
  Thread thread = 1;
  // False when Claude was not running for the thread (nothing to restart).
  bool restarted = 2;
}

message StopThreadShellRequest {
  string thread_id = 1;
  // BackgroundShell.task_id.
  string task_id = 2;
}

message StopThreadShellResponse {
  Thread thread = 1;
}

message ReseedThreadRequest {
  string id = 1;
  // Appended to Claude's system prompt on every spawn of the thread from now on (after
  // the app's own line and a workspace's); at most 64 KiB, no NUL. Empty: none.
  string system_prompt_append = 2;
  // Absolute directories passed as --add-dir on every spawn from now on (missing ones
  // are skipped at spawn). Empty: none.
  repeated string add_dirs = 3;
  // Prepended, with a blank line, to the first message of the fresh session; at most
  // 256 KiB, no NUL. Empty: none.
  string prefix = 4;
}

message ReseedThreadResponse {
  // epoch is the new one; reseed_pending is set when the stop waits for the turn.
  Thread thread = 1;
  // Claude was running and stopped at once for the reseed.
  bool stopped = 2;
}

message McpStatusRequest {
  string thread_id = 1;
  // Ask Claude now instead of returning the last check.
  bool refresh = 2;
}

message McpStatusResponse {
  // Unset when the thread is not running.
  ThreadMcpStatus status = 1;
}

message McpReconnectRequest {
  string thread_id = 1;
  // The server's name as McpServer.name has it.
  string server_name = 2;
}

message McpReconnectResponse {
  // The servers checked after the attempt.
  ThreadMcpStatus status = 1;
  // Claude's answer when the attempt failed (the server still fails); empty when it
  // went through.
  string error = 2;
}

// One slash command a thread offers: "/" + name runs it.
message SlashCommand {
  // What follows "/" ("compact", "anthropic-skills:deep-research").
  string name = 1;
  // Claude's one-line description; a project skill's ends in " (project)". May be long
  // (a skill's whole description).
  string description = 2;
  // Shown after the name ("[interval] [prompt]", "<file>"); empty for none.
  string argument_hint = 3;
  // Other names that run the same command ("/cost" runs usage).
  repeated string aliases = 4;
  // Claude Code's own command (bundled skills included); false for a user, project or
  // plugin skill or command.
  bool builtin = 5;
}

// A thread's slash commands changed (ThreadService.WatchThread).
message ThreadSlashCommandsChange {
  string thread_id = 1;
  uint64 seq = 2;
  // The whole new list.
  repeated SlashCommand commands = 3;
}

message ShowThreadHtmlRequest {
  string thread_id = 1;
  // Absolute (the CLI resolves a relative path against its own directory).
  string path = 2;
  string title = 3;
  // A second card even when this page's card is still live (see reused).
  bool again = 4;
  // The page also opens in the side panel (view.inline --panel): a card of it anywhere
  // in the thread is reused, not only one since the last user message.
  bool panel = 5;
}

message ShowThreadHtmlResponse {
  ThreadItem item = 1;
  // The page was already shown in this thread since its last user message (with panel,
  // at all), so no card was added: item is that card (its title updated when one was
  // given). The GUI reloads a page's card when its file changes.
  bool reused = 2;
  // When a card was added: an older card of the same page in the thread (shown before
  // the last user message), which reloaded with the edit too; "" when none.
  string earlier_item_id = 3;
}

message ShowThreadThemeRequest {
  string thread_id = 1;
  ThemeItem theme = 2;
}

message ShowThreadThemeResponse {
  ThreadItem item = 1;
}

message PageStorageRequest {
  string thread_id = 1;
}

message PageStorageResponse {
  // Key → the value's JSON text, as the page stored it.
  map<string, string> values = 1;
}

message SetPageStorageRequest {
  string thread_id = 1;
  string key = 2;
  // The value's JSON text; unset removes the key.
  optional string value = 3;
}

message SetPageStorageResponse {
  // The thread's page storage after the change.
  map<string, string> values = 1;
}

message ProxyFetchRequest {
  string thread_id = 1;
  // An absolute http or https URL.
  string url = 2;
  // GET when empty.
  string method = 3;
  // Header name → value, as the page set them.
  map<string, string> headers = 4;
  bytes body = 5;
  // 30 s when zero; at most 120 s.
  uint32 timeout_ms = 6;
}

message ProxyFetchResponse {
  uint32 status = 1;
  // Lower-case header name → value, several values joined with ", "; no Set-Cookie.
  map<string, string> headers = 2;
  bytes body = 3;
  // The URL answered, after redirects.
  string url = 4;
  // The status's text ("Not Found"), without the code.
  string status_text = 5;
}

message SlashCommandsRequest {
  string thread_id = 1;
}

message SlashCommandsResponse {
  // Empty when Claude never answered the thread's handshake.
  repeated SlashCommand commands = 1;
}

message ClearThreadFlagsRequest {
  string id = 1;
  // The plugin whose flag to clear; empty clears every flag.
  string plugin = 2;
}

message ClearThreadFlagsResponse {
  Thread thread = 1;
  // How many flags were removed.
  int32 cleared = 2;
}
