syntax = "proto3";

package codefoundry.v1;

import "codefoundry/v1/heartbeat.proto";
import "codefoundry/v1/session.proto";
import "google/protobuf/timestamp.proto";

// ThreadService drives threads: Claude Code runs headlessly (claude -p over
// stream-json) and the conversation is recorded by the daemon as items the GUI draws.
// See docs/notes/rendered-threads-1-daemon.md and docs/notes/rendered-only.md.
service ThreadService {
  // ListItems returns a thread's items (the streaming one included) and its pending
  // requests. Works while disconnected (items persist).
  rpc ListItems(ListThreadItemsRequest) returns (ListThreadItemsResponse) {}
  // Watch streams one thread: a snapshot first, then appended/updated items, text
  // deltas and pending-request changes. While a Watch is open the thread counts as
  // looked at: a finished turn is seen at once. Apply only
  // events whose seq is greater than the snapshot's.
  rpc Watch(WatchThreadRequest) returns (stream ThreadEvent) {}
  // Send sends a user message to a connected thread. Allowed while a turn runs:
  // Claude queues it or folds it in. A message whose first non-blank line starts with a
  // slash command the app replaces (/model, /effort, /fast, /mcp, /rename, /clear, and
  // the aliases /reset, /new, /name) is INVALID_ARGUMENT, nothing sent or recorded; the
  // error's message is a sentence pointing at the app's control, shown as it is.
  rpc Send(SendThreadMessageRequest) returns (SendThreadMessageResponse) {}
  // Respond answers a pending permission request or question.
  rpc Respond(RespondThreadRequest) returns (RespondThreadResponse) {}
  // Interrupt stops the running turn; pending requests are withdrawn.
  rpc Interrupt(InterruptThreadRequest) returns (InterruptThreadResponse) {}
  // SetModel switches a connected thread's model (from its next request) and records
  // it for later spawns.
  rpc SetModel(SetThreadModelRequest) returns (SetThreadModelResponse) {}
  // SetPermissionMode switches a connected thread's permission mode: SUPERVISED,
  // ACCEPT_EDITS or AUTO (UNSPECIFIED, Claude's default, cannot be selected live).
  rpc SetPermissionMode(SetThreadPermissionModeRequest) returns (SetThreadPermissionModeResponse) {}
  // SetEffort changes a connected thread's effort level. Claude has no live effort
  // switch, so the daemon restarts the process with --resume and the new --effort: at
  // once when the thread is idle, else once the running turn ends (Session.effort_pending
  // says so meanwhile). The row records the effort for later spawns either way.
  rpc SetEffort(SetThreadEffortRequest) returns (SetThreadEffortResponse) {}
  // McpStatus returns the thread's MCP servers as last checked. The daemon asks Claude
  // (mcp_status) at the start of every turn, again every few seconds while a server is
  // still connecting, and after McpReconnect; Watch carries each new answer (the `mcp`
  // event). refresh asks Claude now (a connected thread only). Without it a connected
  // thread not checked yet is asked once; a thread that is not running has none (status
  // unset). See docs/notes/mcp-panel.md.
  rpc McpStatus(McpStatusRequest) returns (McpStatusResponse) {}
  // McpReconnect reconnects one MCP server of a connected thread (also how a login made
  // out of band, `claude /mcp` in a shell, is picked up), then checks the servers again.
  // A server that still fails is not an RPC error: the response's error says why and the
  // status shows it. An unknown server is NOT_FOUND.
  rpc McpReconnect(McpReconnectRequest) returns (McpReconnectResponse) {}
  // SlashCommands returns the slash commands a running thread offers (the composer's
  // "/" completion): what Claude reported in its initialize reply, replaced by each
  // list it pushes when skills change, minus the commands the daemon denies (replaced by
  // the app's own controls, terminal-only, or retired; never a skill or a user, project
  // or plugin command). In Claude's order: its skills, then its built-ins, then plugin
  // skills. Empty when the thread is not running. Watch carries every change (the
  // `commands` event). See docs/notes/slash-commands-1-daemon.md.
  rpc SlashCommands(SlashCommandsRequest) returns (SlashCommandsResponse) {}
}

// One entry of a rendered thread's conversation. The payload's case is the kind.
message ThreadItem {
  // Stable for the item's life (the user message's uuid, "<message id>/<index>" for
  // text and thinking, the tool_use id, "perm-"/"q-" + the request id, ...).
  string id = 1;
  // Order in the thread: assigned when the item first appears, only grows, not dense.
  int64 ordinal = 2;
  // The Agent tool_use a subagent's item belongs to; empty for the thread's own.
  string parent_tool_use_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  // Still arriving: text and tool input grow through deltas until an update with
  // streaming false.
  bool streaming = 6;
  oneof payload {
    UserMessageItem user_message = 10;
    AssistantTextItem assistant_text = 11;
    ThinkingItem thinking = 12;
    ToolCallItem tool_call = 13;
    // A permission prompt (can_use_tool), or a call denied without one.
    ThreadRequestItem permission = 14;
    // An AskUserQuestion prompt.
    ThreadRequestItem question = 15;
    TurnEndItem turn_end = 16;
    ErrorItem error = 17;
    CompactionItem compaction = 18;
    CommandOutputItem command_output = 19;
    // A line the daemon adds, not Claude (a fork's "Forked from <parent>").
    NoteItem note = 20;
  }
}

// What the user sent: text as sent (file tags stay "@cf-file://<repo>/<path>" tokens,
// not the paths Claude got) and, when it came from the GUI's composer, the composer's
// own text, from which the GUI draws the message's tags.
message UserMessageItem {
  string text = 1;
  // Staged image paths (StageAttachment); Claude got each as an image block and a
  // path line.
  repeated string attachments = 2;
  // The composer's text with its tags as Markdown-link tokens (gui lib/prompt.ts):
  // "[/name](cf-skill://<repo id or ~>/<name>)", "[base](cf-file://<repo id>/<path>)",
  // and "![name](cf-attachment://<n>)" where n is the image's index in attachments
  // (not a number: the chip had lost its image). Empty for a message without tags or sent
  // without the composer (the CLI): text is then shown as is. Stored, never interpreted.
  string composer_text = 3;
}

// One text block of Claude's reply (markdown).
message AssistantTextItem {
  string text = 1;
}

// One thinking block. Text is usually empty: Claude streams only its progress.
message ThinkingItem {
  string text = 1;
}

enum ToolCallStatus {
  TOOL_CALL_STATUS_UNSPECIFIED = 0;
  TOOL_CALL_STATUS_RUNNING = 1;
  TOOL_CALL_STATUS_DONE = 2;
  // The tool failed, was denied, or the process ended before it finished.
  TOOL_CALL_STATUS_ERROR = 3;
}

message ToolCallItem {
  string tool_use_id = 1;
  // "Bash", "Read", "Write", "Edit", "Agent", "AskUserQuestion", "mcp__...", ...
  string name = 2;
  // The tool's input as JSON; partial JSON while streaming.
  string input_json = 3;
  ToolCallStatus status = 4;
  // The tool_result's text.
  string output = 5;
  bool is_error = 6;
  // The tool's structured result when Claude sent one (Write/Edit: filePath,
  // structuredPatch, originalFile; ...); empty when absent or over 256 KiB.
  string result_json = 7;
}

enum ThreadRequestState {
  THREAD_REQUEST_STATE_UNSPECIFIED = 0;
  THREAD_REQUEST_STATE_PENDING = 1;
  // Allowed; a question: answered.
  THREAD_REQUEST_STATE_ALLOWED = 2;
  THREAD_REQUEST_STATE_DENIED = 3;
  // Withdrawn by Claude (an interrupt) or the process ended first.
  THREAD_REQUEST_STATE_CANCELLED = 4;
}

// A can_use_tool request (permission or AskUserQuestion) and its resolution.
message ThreadRequestItem {
  // Answer with ThreadService.Respond(request_id). Empty for an auto-denied call.
  string request_id = 1;
  string tool_name = 2;
  string display_name = 3;
  string title = 4;
  // What the call touches, e.g. a file name.
  string description = 5;
  // The tool_call item this request is about.
  string tool_use_id = 6;
  // Set when a subagent asked.
  string agent_id = 7;
  string blocked_path = 8;
  string decision_reason = 9;
  // The tool's input JSON. A question's: {"questions": [{question, header, options:
  // [{label, description}], multiSelect}]}.
  string input_json = 10;
  // Claude's permission_suggestions (JSON); "allow for session" applies them. Empty
  // when there are none.
  string suggestions_json = 11;
  ThreadRequestState state = 12;
  // "allow", "allow_session", "deny" or "auto_denied" once resolved.
  string decision = 13;
  // The deny message, or why it was cancelled or auto-denied.
  string message = 14;
  // A question's answers: question -> chosen label(s), several joined with ", ".
  map<string, string> answers = 15;
}

// The end of a turn (Claude's result).
message TurnEndItem {
  // "success", "error_during_execution", "error_max_turns", ...
  string subtype = 1;
  bool is_error = 2;
  // Stopped by an interrupt.
  bool interrupted = 3;
  string stop_reason = 4;
  string terminal_reason = 5;
  int64 duration_ms = 6;
  int32 num_turns = 7;
  // Claude's cost estimate for the process so far (cumulative over its turns). The
  // turn's own is turn_cost_usd.
  double cost_usd = 8;
  int64 input_tokens = 9;
  int64 output_tokens = 10;
  int64 cache_read_tokens = 11;
  int64 cache_write_tokens = 12;
  repeated string errors = 13;
  // This turn's cost: the difference of Claude's running total from the previous
  // result of the same process, or for a process's first turn from the totals Claude
  // restored on --resume (the daemon reads them from the transcript). Unset when the
  // daemon could not tell (an interrupt that reported no total, totals that do not fit
  // what Claude should have restored) and on turns recorded before it computed it.
  optional double turn_cost_usd = 14;
  // The model of the turn's own replies as Claude names it ("claude-haiku-5-5"); empty
  // when the turn had none (a local command, an interrupt before any reply) or was
  // recorded before the daemon kept it.
  string model = 15;
}

// Something that went wrong outside a turn's result (the process failed to start or
// exited mid-turn).
message ErrorItem {
  string text = 1;
}

// A compaction (/compact or automatic).
message CompactionItem {
  // "manual" or "auto".
  string trigger = 1;
  int64 pre_tokens = 2;
  int64 post_tokens = 3;
  // The summary Claude continues from, once it arrived.
  string summary = 4;
}

// A local slash command's output (/cost, /compact's "Compacted", ...).
message CommandOutputItem {
  string text = 1;
}

// A system line in the conversation: something the daemon records about the thread
// rather than anything Claude said or did. A fork's items start with a copy of its
// parent's, ended by the note "Forked from <parent's name at fork time>".
message NoteItem {
  string text = 1;
}

// A request waiting on the user.
message ThreadPendingRequest {
  string request_id = 1;
  // The permission or question item.
  string item_id = 2;
  bool question = 3;
  string tool_name = 4;
  // One line: "Write hello.txt", or the question.
  string summary = 5;
}

message ThreadItemsSnapshot {
  string session_id = 1;
  // The thread's event sequence number included in the snapshot.
  uint64 seq = 2;
  repeated ThreadItem items = 3;
  repeated ThreadPendingRequest pending = 4;
  // The thread's MCP servers as last checked; unset when not checked since its process
  // started, or when it is not running.
  ThreadMcpStatus mcp = 5;
  // The slash commands the running thread offers (ThreadService.SlashCommands); empty
  // when it is not running.
  repeated SlashCommand commands = 6;
}

// Text appended to a streaming item.
message ThreadItemDelta {
  string session_id = 1;
  uint64 seq = 2;
  string item_id = 3;
  int64 ordinal = 4;
  enum Field {
    FIELD_UNSPECIFIED = 0;
    // assistant_text.text or thinking.text.
    FIELD_TEXT = 1;
    // tool_call.input_json (partial JSON).
    FIELD_INPUT = 2;
  }
  Field field = 5;
  string text = 6;
}

message ThreadItemChange {
  string session_id = 1;
  uint64 seq = 2;
  ThreadItem item = 3;
}

// A thread's pending requests changed (the whole list).
message ThreadPending {
  string session_id = 1;
  uint64 seq = 2;
  repeated ThreadPendingRequest pending = 3;
}

// The pending requests of every rendered thread that has any: EventService's
// snapshot for the thread source. Replace what you have.
message ThreadPendingSnapshot {
  repeated ThreadPending threads = 1;
}

message ThreadEvent {
  oneof event {
    // ThreadService.Watch's first event (and a resync after drops).
    ThreadItemsSnapshot snapshot = 1;
    // Watch only: items and their streaming deltas.
    ThreadItemChange appended = 2;
    ThreadItemChange updated = 3;
    ThreadItemDelta delta = 4;
    // Watch and EventService: the thread's pending requests changed.
    ThreadPending pending = 5;
    // EventService only: the snapshot of the thread source.
    ThreadPendingSnapshot pending_snapshot = 6;
    // Watch only: the thread's MCP servers were checked again, or dropped (status unset:
    // the process ended).
    ThreadMcpChange mcp = 7;
    // Watch only: the thread's slash commands changed (Claude's list changed, or the
    // process ended: empty).
    ThreadSlashCommandsChange commands = 8;
    // Watch only: nothing else was sent for a while (see StreamHeartbeat). It does not
    // advance seq.
    StreamHeartbeat heartbeat = 9;
  }
}

// An MCP server's status as Claude reports it.
enum McpServerStatus {
  // A status this daemon does not know (a newer Claude's).
  MCP_SERVER_STATUS_UNSPECIFIED = 0;
  MCP_SERVER_STATUS_CONNECTED = 1;
  // It could not start or connect; McpServer.error says why.
  MCP_SERVER_STATUS_FAILED = 2;
  // It needs a login (OAuth). Claude cannot log in headlessly: run `claude` in a
  // shell and use /mcp, then McpReconnect.
  MCP_SERVER_STATUS_NEEDS_AUTH = 3;
  // Still connecting.
  MCP_SERVER_STATUS_PENDING = 4;
  // Disabled in Claude's configuration: not passed to Claude.
  MCP_SERVER_STATUS_DISABLED = 5;
}

// What made the daemon check a thread's MCP servers.
enum McpCheckTrigger {
  MCP_CHECK_TRIGGER_UNSPECIFIED = 0;
  // system/init: the start of a turn.
  MCP_CHECK_TRIGGER_TURN_START = 1;
  // McpStatus asked for it (refresh, or the first read), or a follow-up while a server
  // was still connecting.
  MCP_CHECK_TRIGGER_REFRESH = 2;
  // After McpReconnect of ThreadMcpStatus.server.
  MCP_CHECK_TRIGGER_RECONNECT = 3;
}

// One tool of a connected MCP server. The hints are the ones the server set to true
// (MCP tool annotations); an unset read_only means the tool may write.
message McpTool {
  string name = 1;
  // Empty when Claude sends none (claude.ai connectors).
  string description = 2;
  bool read_only = 3;
  bool destructive = 4;
  // It reaches outside the server (the open web, other services).
  bool open_world = 5;
}

message McpServer {
  // The config key, untrusted text ("github", "claude.ai Gmail").
  string name = 1;
  McpServerStatus status = 2;
  // What a connected server says about itself.
  string server_name = 3;
  string version = 4;
  // Why it failed.
  string error = 5;
  // The configuration scope: user, project, local, dynamic, claudeai, managed, ...
  string scope = 6;
  // Where the definition came from: the scope names, plus plugin and sdk.
  string source = 7;
  // stdio, sse, http, sdk or claudeai-proxy.
  string transport = 8;
  // A connected server's tools, in Claude's order.
  repeated McpTool tools = 9;
}

// A thread's MCP servers at one check.
message ThreadMcpStatus {
  google.protobuf.Timestamp checked_at = 1;
  McpCheckTrigger trigger = 2;
  // The server reconnected (MCP_CHECK_TRIGGER_RECONNECT).
  string server = 3;
  // In Claude's order.
  repeated McpServer servers = 4;
}

// A thread's MCP status changed (ThreadService.Watch).
message ThreadMcpChange {
  string session_id = 1;
  uint64 seq = 2;
  // Unset: the thread has none any more (its process ended).
  ThreadMcpStatus status = 3;
}

message ListThreadItemsRequest {
  string session_id = 1;
}

message ListThreadItemsResponse {
  ThreadItemsSnapshot snapshot = 1;
}

message WatchThreadRequest {
  string session_id = 1;
}

message SendThreadMessageRequest {
  string session_id = 1;
  // As typed; "@cf-file://<repo id>/<path>" tags become absolute paths for Claude.
  string text = 2;
  // StageAttachment paths.
  repeated string attachments = 3;
  // The composer's text (UserMessageItem.composer_text), kept on the item for display.
  string composer_text = 4;
}

message SendThreadMessageResponse {
  // The user_message item.
  ThreadItem item = 1;
}

enum ThreadDecision {
  THREAD_DECISION_UNSPECIFIED = 0;
  THREAD_DECISION_ALLOW = 1;
  // Allow and apply Claude's permission suggestions for the rest of the session.
  THREAD_DECISION_ALLOW_FOR_SESSION = 2;
  THREAD_DECISION_DENY = 3;
}

message RespondThreadRequest {
  string session_id = 1;
  string request_id = 2;
  ThreadDecision decision = 3;
  // A question's answers (required to allow one): question -> chosen label(s).
  map<string, string> answers = 4;
  // DENY: the user's reason. Claude sees it inside Claude Code's own rejection text
  // ("The user doesn't want to proceed with this tool use. … the user said: <message>");
  // without one, the plain rejection ("… STOP what you are doing and wait for the user to
  // tell you how to proceed."). A question is denied (skipped) the same way.
  string message = 5;
  // DENY: also stop the turn.
  bool interrupt = 6;
}

message RespondThreadResponse {
  // The resolved permission or question item.
  ThreadItem item = 1;
}

message InterruptThreadRequest {
  string session_id = 1;
}

message InterruptThreadResponse {}

message SetThreadModelRequest {
  string session_id = 1;
  string model = 2;
}

message SetThreadModelResponse {
  Session session = 1;
}

message SetThreadPermissionModeRequest {
  string session_id = 1;
  PermissionMode permission_mode = 2;
}

message SetThreadPermissionModeResponse {
  Session session = 1;
}

message SetThreadEffortRequest {
  string session_id = 1;
  // low, medium, high, xhigh or max.
  string effort = 2;
}

message SetThreadEffortResponse {
  // effort_pending is set when the restart waits for the running turn.
  Session session = 1;
}

message McpStatusRequest {
  string session_id = 1;
  // Ask Claude now instead of returning the last check.
  bool refresh = 2;
}

message McpStatusResponse {
  // Unset when the thread is not running.
  ThreadMcpStatus status = 1;
}

message McpReconnectRequest {
  string session_id = 1;
  // The server's name as McpServer.name has it.
  string server_name = 2;
}

message McpReconnectResponse {
  // The servers checked after the attempt.
  ThreadMcpStatus status = 1;
  // Claude's answer when the attempt failed (the server still fails); empty when it
  // went through.
  string error = 2;
}

// One slash command a thread offers: "/" + name runs it.
message SlashCommand {
  // What follows "/" ("compact", "anthropic-skills:deep-research").
  string name = 1;
  // Claude's one-line description; a project skill's ends in " (project)". May be long
  // (a skill's whole description).
  string description = 2;
  // Shown after the name ("[interval] [prompt]", "<file>"); empty for none.
  string argument_hint = 3;
  // Other names that run the same command ("/cost" runs usage).
  repeated string aliases = 4;
  // Claude Code's own command (bundled skills included); false for a user, project or
  // plugin skill or command.
  bool builtin = 5;
}

// A thread's slash commands changed (ThreadService.Watch).
message ThreadSlashCommandsChange {
  string session_id = 1;
  uint64 seq = 2;
  // The whole new list; empty when the process ended.
  repeated SlashCommand commands = 3;
}

message SlashCommandsRequest {
  string session_id = 1;
}

message SlashCommandsResponse {
  // Empty when the thread is not running.
  repeated SlashCommand commands = 1;
}
