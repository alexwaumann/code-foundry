syntax = "proto3";

package codefoundry.v1;

import "google/protobuf/timestamp.proto";

// SettingsService reads and edits the user's settings file ($CONFIG/settings.toml).
// The file is the source of truth: edits made by hand while the daemon runs are picked
// up and published like edits made through Update.
//
// Every value travels as a string, encoded by its field's type (bool "true"/"false",
// int in decimal, everything else verbatim), like command args. The schema describes
// each field, so a client renders a form without hardcoding any setting.
service SettingsService {
  // GetSchema returns every field, the file groups they belong to, and the pages and
  // sections the settings page shows them under.
  rpc GetSchema(GetSettingsSchemaRequest) returns (GetSettingsSchemaResponse) {}
  // Get returns the current values.
  rpc Get(GetSettingsRequest) returns (GetSettingsResponse) {}
  // Update applies a partial change: only the given keys change. An empty value resets
  // that key to its default. The whole change is validated first and applied atomically;
  // on failure nothing is written and the error (InvalidArgument) carries a
  // SettingsValidationErrors detail with one entry per rejected key.
  rpc Update(UpdateSettingsRequest) returns (UpdateSettingsResponse) {}
  // Watch streams the current snapshot, then one snapshot per change. The GUI receives
  // the same events on EventService instead.
  rpc Watch(WatchSettingsRequest) returns (stream SettingsEvent) {}

  // Backdrop images: copies of pictures the user added, in the backdrops directory of
  // the Code Foundry home, that appearance.backdrop = custom shows (the one named by
  // appearance.backdrop_file).
  //
  // ListBackdrops returns the images, oldest first.
  rpc ListBackdrops(ListBackdropsRequest) returns (ListBackdropsResponse) {}
  // ImportBackdrop copies the PNG, JPEG, WebP or GIF at an absolute path in (at most
  // 24 MiB; the type is sniffed) and selects it: appearance.backdrop = custom and
  // appearance.backdrop_file = its name. The name comes from the content, so adding the
  // same picture again keeps one copy. Unsupported content, a directory or a file over
  // the cap is InvalidArgument; a missing path NotFound.
  rpc ImportBackdrop(ImportBackdropRequest) returns (ImportBackdropResponse) {}
  // RemoveBackdrop deletes an image. When appearance.backdrop_file names it, that is
  // cleared, and a custom backdrop falls back to forest. NotFound when it is gone.
  rpc RemoveBackdrop(RemoveBackdropRequest) returns (RemoveBackdropResponse) {}
  // ReadBackdrop returns an image's bytes. Only names directly inside the directory:
  // anything with a separator, or hidden, is InvalidArgument; a missing file NotFound.
  rpc ReadBackdrop(ReadBackdropRequest) returns (ReadBackdropResponse) {}
}

enum SettingType {
  SETTING_TYPE_UNSPECIFIED = 0;
  SETTING_TYPE_STRING = 1;
  SETTING_TYPE_INT = 2;
  SETTING_TYPE_BOOL = 3;
  // One of enum_values. The empty string, when listed, means "no preference".
  SETTING_TYPE_ENUM = 4;
  // A filesystem path; ~ is expanded.
  SETTING_TYPE_PATH = 5;
  // A keyboard chord in the GUI's syntax ("cmd+shift+n"), or "none" to unbind.
  SETTING_TYPE_KEYBINDING = 6;
}

message SettingField {
  // Dotted key, "<group>.<name>", e.g. "threads.default_model". Keybinding fields are
  // "keybindings.<command name>", e.g. "keybindings.thread.new".
  string key = 1;
  string title = 2;
  string description = 3;
  // Group id (SettingGroup.id).
  string group = 4;
  SettingType type = 5;
  repeated string enum_values = 6;
  string default_value = 7;
  // The daemon reads this value only at start; a change applies after a restart.
  bool restart_required = 8;
  // Inclusive bounds for SETTING_TYPE_INT.
  int64 min = 9;
  int64 max = 10;
  // Free-form hint for the input (e.g. a template or an example).
  string placeholder = 11;
  // Display names for enum_values, parallel to it; empty when the values are shown as is.
  // threads.default_model carries the model registry's labels ("Opus 4.8").
  repeated string enum_labels = 12;
  // Page id (SettingPage.id) the settings page shows the field on. Display only: the
  // field's table in the file is its group.
  string page = 13;
  // Section id (SettingSection.id) within the page.
  string section = 14;
  // Unit shown as a suffix inside a number input ("s", "pt", "%"); empty for none.
  string unit = 15;
  // Key of a SETTING_TYPE_BOOL field this one depends on: while that field is false,
  // this one renders indented and dimmed. Empty for none.
  string depends_on = 16;
  // Fields of a section sharing a non-empty row id render side by side in one row
  // (model and effort), each under its own title, with the first field's description
  // under the row.
  string row = 17;
}

// SettingGroup is a table of the settings file ([threads], [github], ...).
message SettingGroup {
  string id = 1;
  string title = 2;
  string description = 3;
}

// SettingPage is one page (tab) of the settings page. Pages and their sections are
// display only and independent of the file's groups: a page may show fields of several
// groups.
message SettingPage {
  string id = 1;
  string title = 2;
  // Optional caption under the page title.
  string description = 3;
  // In display order. The keybindings page has one section per command category.
  repeated SettingSection sections = 4;
}

message SettingSection {
  string id = 1;
  // Empty for a page's single unnamed section.
  string title = 2;
  // Optional caption under the section title.
  string description = 3;
}

message SettingIssue {
  string key = 1;
  string message = 2;
}

message SettingsSnapshot {
  // Every field's effective value, keyed by SettingField.key. Defaults included.
  map<string, string> values = 1;
  // Absolute path of the settings file.
  string path = 2;
  // Increments with every published change.
  uint64 revision = 3;
  // Set when the file could not be parsed; the previous values stay in effect.
  string load_error = 4;
  // Values in the file that were rejected (and replaced by their defaults), and unknown
  // keys.
  repeated SettingIssue issues = 5;
  // restart_required keys whose value differs from the one the daemon started with.
  repeated string restart_pending = 6;
}

// SettingsValidationErrors is the error detail of a rejected Update.
message SettingsValidationErrors {
  repeated SettingIssue errors = 1;
}

message SettingsEvent {
  oneof event {
    SettingsSnapshot snapshot = 1;
  }
}

message GetSettingsSchemaRequest {}

message GetSettingsSchemaResponse {
  // The file's tables, in file order.
  repeated SettingGroup groups = 1;
  // Every field. Within a section, fields are in display order.
  repeated SettingField fields = 2;
  // Pages in display order; every field's page and section are listed here.
  repeated SettingPage pages = 3;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  SettingsSnapshot settings = 1;
}

message UpdateSettingsRequest {
  map<string, string> values = 1;
}

message UpdateSettingsResponse {
  SettingsSnapshot settings = 1;
}

message WatchSettingsRequest {}

// Backdrop is one image in the backdrops directory.
message Backdrop {
  // File name in the directory, <32 hex of the content>.<ext> for an import; the value
  // of appearance.backdrop_file that shows it.
  string name = 1;
  int64 size = 2;
  // Pixel size from the image's header; 0 when it does not say.
  int32 width = 3;
  int32 height = 4;
  google.protobuf.Timestamp added_at = 5;
}

message ListBackdropsRequest {}

message ListBackdropsResponse {
  repeated Backdrop backdrops = 1;
}

message ImportBackdropRequest {
  // Absolute path of the picture to copy in.
  string path = 1;
}

message ImportBackdropResponse {
  Backdrop backdrop = 1;
}

message RemoveBackdropRequest {
  string name = 1;
}

message RemoveBackdropResponse {}

message ReadBackdropRequest {
  string name = 1;
}

message ReadBackdropResponse {
  bytes data = 1;
  // Sniffed: image/png, image/jpeg, image/webp or image/gif.
  string mime_type = 2;
}
