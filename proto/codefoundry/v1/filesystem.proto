syntax = "proto3";

package codefoundry.v1;

// FilesystemService answers questions about the local filesystem that the GUI cannot
// (the frontend has no filesystem access). Every path it accepts or returns is under
// the user's home directory.
service FilesystemService {
  // ListDirectories completes a typed path prefix ("~", "~/co", "/Users/me/co") to the
  // directories it could name. The prefix's last segment is matched case-insensitively
  // against the entries of its parent directory; a prefix ending in "/" lists that
  // directory. Dot-directories are listed only when the last segment starts with ".".
  // A prefix that resolves outside the home directory is InvalidArgument.
  rpc ListDirectories(ListDirectoriesRequest) returns (ListDirectoriesResponse) {}

  // ListSkills lists the skills and slash commands Claude Code would offer in the given
  // checkouts (the composer's "/" completion): .claude/skills/<name>/SKILL.md and
  // .claude/commands/**/*.md in each source, then ~/.claude/skills and
  // ~/.claude/commands/*.md when include_user. Project skills come in request order,
  // sorted by name within a source; user skills last. Unreadable entries are skipped,
  // and so is a source whose project or checkout is gone (logged). A source without a
  // project id, or with a path that is relative or outside the home directory, is
  // InvalidArgument.
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse) {}

  // SearchFiles fuzzy-matches query against the files and directories of one checkout
  // (the composer's "@" completion). A git checkout lists tracked plus untracked, not
  // ignored files (and their parent directories); a project without git is walked,
  // skipping .git, node_modules and dot-directories, at most 50,000 entries. The
  // candidate list is cached for a few seconds per checkout. An empty query returns
  // the shallowest entries. An unknown project is NotFound; a path outside the home
  // directory is InvalidArgument.
  rpc SearchFiles(SearchFilesRequest) returns (SearchFilesResponse) {}

  // ReadFile reads one file for the file viewer. path is absolute, or relative to
  // base_dir (a thread's worktree, or the home directory); "~/" is the home
  // directory. Symlinks are followed, and the file they lead to must be under the
  // home directory too: InvalidArgument otherwise (also for a relative path without
  // an absolute base_dir). A missing path is not_found and a directory is_dir, not
  // errors. Contents are at most max_bytes (default and limit 1 MiB).
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse) {}
}

message ListDirectoriesRequest {
  // A path prefix as typed: "~", "~/", "~/co", or an absolute path.
  string prefix = 1;
}

message DirectoryEntry {
  // Absolute path of the directory, with no trailing slash.
  string path = 1;
  // Base name.
  string name = 2;
  // The directory contains a ".git" entry (a repository or a worktree).
  bool is_git = 3;
  // The directory is already a registered project.
  bool registered = 4;
}

message ListDirectoriesResponse {
  // Matching directories, sorted by name (case-insensitively), at most 200.
  repeated DirectoryEntry entries = 1;
  // The longest completion of the prefix every entry shares, in the prefix's own
  // spelling ("~/co" -> "~/code-"; the entry plus "/" when exactly one matches).
  // Equal to the prefix when nothing extends it.
  string completion = 2;
  // More directories matched than were returned.
  bool truncated = 3;
}

// SkillSource is one checkout to read skills from.
message SkillSource {
  // The registered project.
  string project_id = 1;
  // Absolute path of the checkout to read (a worktree of the project). Empty: the
  // project's main worktree.
  string path = 2;
}

message ListSkillsRequest {
  repeated SkillSource sources = 1;
  // Also list the user's skills and commands under ~/.claude.
  bool include_user = 2;
}

enum SkillScope {
  SKILL_SCOPE_UNSPECIFIED = 0;
  // ~/.claude/skills or ~/.claude/commands.
  SKILL_SCOPE_USER = 1;
  // <checkout>/.claude/skills or <checkout>/.claude/commands.
  SKILL_SCOPE_PROJECT = 2;
}

message Skill {
  // What follows "/": the skill's directory name, or a command file's stem.
  string name = 1;
  // The SKILL.md frontmatter's description, or a command file's first non-empty line
  // that is not a heading (frontmatter skipped). May be empty.
  string description = 2;
  SkillScope scope = 3;
  // The project, for SKILL_SCOPE_PROJECT.
  string project_id = 4;
  // Absolute path of the SKILL.md or command .md file.
  string path = 5;
}

message ListSkillsResponse {
  repeated Skill skills = 1;
}

message SearchFilesRequest {
  // The registered project.
  string project_id = 1;
  // Absolute path of the checkout to search (a worktree of the project). Empty: the
  // project's main worktree.
  string path = 2;
  // Typed text after "@". Matched as a case-insensitive subsequence.
  string query = 3;
  // Maximum matches. Zero means 50; at most 200.
  int32 limit = 4;
}

message FileMatch {
  // Relative to the checkout, forward slashes, no leading "./", no trailing "/".
  string path = 1;
  bool is_dir = 2;
}

message SearchFilesResponse {
  // Best match first.
  repeated FileMatch matches = 1;
  // More entries matched than were returned.
  bool truncated = 2;
}

message ReadFileRequest {
  // Absolute directory a relative path is resolved against. Ignored for an absolute
  // path.
  string base_dir = 1;
  // Absolute, "~/"-prefixed, or relative to base_dir.
  string path = 2;
  // Maximum bytes of contents. Zero means 1 MiB, which is also the limit.
  int64 max_bytes = 3;
}

message ReadFileResponse {
  // The first max_bytes of the file.
  bytes contents = 1;
  // The file's full size in bytes.
  int64 size = 2;
  // size > len(contents).
  bool truncated = 3;
  // NUL in the first 8 KiB, or a MIME type that is not text (images, PDFs, archives).
  // Contents are returned anyway (the viewer shows images inline).
  bool binary = 4;
  // From the extension, else sniffed from the contents ("text/markdown",
  // "image/png", "text/plain; charset=utf-8", "application/octet-stream").
  string mime_type = 5;
  // Modification time, unix milliseconds.
  int64 modified_at = 6;
  // Absolute, cleaned path as asked for (before following symlinks).
  string resolved_path = 7;
  // Nothing exists at resolved_path; the other fields are empty.
  bool not_found = 8;
  // resolved_path is a directory; only size and modified_at are set.
  bool is_dir = 9;
}
