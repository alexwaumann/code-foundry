syntax = "proto3";

package codefoundry.v1;

// FilesystemService answers questions about the local filesystem that the GUI cannot
// (the frontend has no filesystem access). Every path it accepts or returns is under
// the user's home directory.
service FilesystemService {
  // ListDirectories completes a typed path prefix ("~", "~/co", "/Users/me/co") to the
  // directories it could name. The prefix's last segment is matched case-insensitively
  // against the entries of its parent directory; a prefix ending in "/" lists that
  // directory. Dot-directories are listed only when the last segment starts with ".".
  // A prefix that resolves outside the home directory is InvalidArgument.
  rpc ListDirectories(ListDirectoriesRequest) returns (ListDirectoriesResponse) {}

  // ListSkills lists the skills and slash commands Claude Code would offer in the given
  // checkouts (the composer's "/" completion): .claude/skills/<name>/SKILL.md and
  // .claude/commands/**/*.md in each source, then ~/.claude/skills and
  // ~/.claude/commands/*.md when include_user. Project skills come in request order,
  // sorted by name within a source; user skills last. Unreadable entries are skipped,
  // and so is a source whose project or checkout is gone (logged). A source without a
  // project id, or with a path that is relative or outside the home directory, is
  // InvalidArgument.
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse) {}

  // SearchFiles fuzzy-matches query against the files and directories of one or more
  // checkouts (the composer's "@" completion with one, the file finder with a thread's
  // checkouts) and ranks them in one list. A git checkout lists tracked plus untracked,
  // not ignored files (and their parent directories); a project without git is walked,
  // skipping .git, node_modules and dot-directories, at most 50,000 entries. The
  // candidate list is cached for a few seconds per checkout. An empty query returns
  // the shallowest entries.
  //
  // Words: the query is split at whitespace into words, and every word must match the
  // path on its own, as a case-insensitive subsequence, in any order ("comp tsx" finds
  // src/components/Composer.tsx). Each word gets a tier: exact base name > base-name
  // prefix > base-name subsequence > whole-path subsequence; within a tier, characters
  // at segment starts and in runs add a bonus.
  //
  // Ranking: the weakest word's tier first (so a file where every word lands in the
  // base name beats any file where a word matches only across directories), then the
  // sum of the words' tiers, then the sum of their bonuses, then the shorter path, then
  // the path, then the earlier source. A one-word query ranks as before.
  //
  // Project words, only with more than one source: a run of words at the start or at
  // the end of the query, leaving at least one word for the path, may match the
  // source's project name instead of the path, each word on its own a case-insensitive
  // subsequence of the name. A file ranks by its best split (all words on the path, or
  // such a run on the name and the rest on the path), scored over its path words alone;
  // on equal scores, the split with more words on the path. So a single word never
  // touches the name, a word stays on the path unless moving it lifts the weakest path
  // word, and "ghostty tree" ranks the tree files of a project named ghostty-playground
  // as if "tree" had been typed there.
  //
  // An unknown project is NotFound; a path outside the home directory, a source without
  // a project, both sources and project_id/path, more than 16 sources, or a query of
  // more than 8 words is InvalidArgument.
  rpc SearchFiles(SearchFilesRequest) returns (SearchFilesResponse) {}

  // ReadFile reads one file for the file viewer. path is absolute, or relative to
  // base_dir (a thread's worktree, or the home directory); "~/" is the home
  // directory. Symlinks are followed, and the file they lead to must be under the
  // home directory too: InvalidArgument otherwise (also for a relative path without
  // an absolute base_dir). A missing path is not_found and a directory is_dir, not
  // errors. Contents are at most max_bytes (zero means 1 MiB): a text file is always
  // capped at 1 MiB, any other file (images, PDFs) at 32 MiB.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse) {}

  // WriteFile replaces one file for the file viewer, or creates it. path is as for
  // ReadFile, and symlinks are written through: the file they lead to is replaced, never
  // the link, and it must be under the home directory too.
  //
  // Editing: modified_at and size say what the read saw. A file that differs from them,
  // or that is gone, is conflict, not an error, and nothing is written; force skips the
  // check, and writes a file that is gone anew (mode 0600). Creating: create makes a file
  // that does not exist, mode 0600, in a directory that does; anything already at path is
  // conflict. Neither flag on a missing file is conflict with not_found.
  //
  // The write is atomic (a temp file beside the target, then a rename) and keeps the
  // existing file's mode. It replaces the file: another hard link keeps the old contents,
  // and extended attributes are not carried over. InvalidArgument: a path outside the
  // home directory, or relative without an absolute base_dir; a directory or anything
  // else that is not a regular file; contents over 1 MiB; create with force; create or
  // force in a directory that does not exist; force on a symlink that leads nowhere; a
  // path in the config home outside its checkouts (its worktrees and projects).
  // PermissionDenied: macOS's privacy protection refused the write.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse) {}

  // PreviewFile grants the File tab's HTML preview a URL on the daemon's loopback
  // listener that serves the file, and everything else under its scope, without the
  // bearer token: the scope is the registered checkout holding the file, else its
  // directory. A sandboxed frame loads the page from there so its scripts run and its
  // relative links, stylesheets, scripts and images resolve. The grant is an
  // unguessable id in the URL, scoped to that directory tree and never reaching above
  // it, outside the home directory or into a protected folder (symlinks resolved); it
  // lasts until the daemon stops. A scope is never home itself, the config home or an
  // ancestor of it, or a credentials folder: a file whose directory is one of those gets
  // a grant for the file alone (single_file). path is as for ReadFile: InvalidArgument
  // when it is outside the home directory, relative without an absolute base_dir, not a
  // regular file, or in a protected folder (the config home outside its checkouts,
  // ~/.ssh, ~/Library and other credential folders).
  rpc PreviewFile(PreviewFileRequest) returns (PreviewFileResponse) {}
}

message ListDirectoriesRequest {
  // A path prefix as typed: "~", "~/", "~/co", or an absolute path.
  string prefix = 1;
}

message DirectoryEntry {
  // Absolute path of the directory, with no trailing slash.
  string path = 1;
  // Base name.
  string name = 2;
  // The directory contains a ".git" entry (a repository or a worktree).
  bool is_git = 3;
  // The directory is already a registered project.
  bool registered = 4;
}

message ListDirectoriesResponse {
  // Matching directories, sorted by name (case-insensitively), at most 200.
  repeated DirectoryEntry entries = 1;
  // The longest completion of the prefix every entry shares, in the prefix's own
  // spelling ("~/co" -> "~/code-"; the entry plus "/" when exactly one matches).
  // Equal to the prefix when nothing extends it.
  string completion = 2;
  // More directories matched than were returned.
  bool truncated = 3;
}

// SkillSource is one checkout to read skills from.
message SkillSource {
  // The registered project.
  string project_id = 1;
  // Absolute path of the checkout to read (a worktree of the project). Empty: the
  // project's main worktree.
  string path = 2;
}

message ListSkillsRequest {
  repeated SkillSource sources = 1;
  // Also list the user's skills and commands under ~/.claude.
  bool include_user = 2;
}

enum SkillScope {
  SKILL_SCOPE_UNSPECIFIED = 0;
  // ~/.claude/skills or ~/.claude/commands.
  SKILL_SCOPE_USER = 1;
  // <checkout>/.claude/skills or <checkout>/.claude/commands.
  SKILL_SCOPE_PROJECT = 2;
}

message Skill {
  // What follows "/": the skill's directory name, or a command file's stem.
  string name = 1;
  // The SKILL.md frontmatter's description, or a command file's first non-empty line
  // that is not a heading (frontmatter skipped). May be empty.
  string description = 2;
  SkillScope scope = 3;
  // The project, for SKILL_SCOPE_PROJECT.
  string project_id = 4;
  // Absolute path of the SKILL.md or command .md file.
  string path = 5;
}

message ListSkillsResponse {
  repeated Skill skills = 1;
}

// FileSource is one checkout to search.
message FileSource {
  // The registered project.
  string project_id = 1;
  // Absolute path of the checkout to search (a worktree of the project). Empty: the
  // project's main worktree.
  string path = 2;
}

message SearchFilesRequest {
  // The registered project, for a one-checkout search. Unset when sources is set.
  string project_id = 1;
  // Absolute path of the checkout to search (a worktree of the project). Empty: the
  // project's main worktree. Unset when sources is set.
  string path = 2;
  // Typed text after "@", or the file finder's query. Its whitespace-separated words
  // each match as a case-insensitive subsequence (see SearchFiles).
  string query = 3;
  // Maximum matches across all sources. Zero means 50; at most 200.
  int32 limit = 4;
  // The checkouts to search, in order (ties go to the earlier one; a thread sends its
  // primary project first). At most 16; a checkout named twice is searched once.
  // Empty: the one checkout of project_id and path.
  repeated FileSource sources = 5;
  // Drop directories from the candidates.
  bool files_only = 6;
}

message FileMatch {
  // Relative to the checkout, forward slashes, no leading "./", no trailing "/".
  string path = 1;
  bool is_dir = 2;
  // The project of the source this match is from.
  string project_id = 3;
  // Absolute path of the checkout path is relative to: the source's path as given
  // (cleaned), or the project's main worktree.
  string checkout = 4;
  // Indices of the characters of path the query's path words matched, every word's,
  // ascending and without repeats. Characters are Unicode code points (Go runes; in
  // JavaScript the indices of Array.from(path)), not bytes. Empty for an empty query.
  repeated int32 path_positions = 5;
  // Indices (code points, as path_positions) of the characters of the project's name
  // that project words matched, ascending and without repeats; empty when every word
  // matched the path.
  repeated int32 project_positions = 6;
}

message SearchFilesResponse {
  // Best match first, across all sources.
  repeated FileMatch matches = 1;
  // More entries matched than were returned.
  bool truncated = 2;
}

message ReadFileRequest {
  // Absolute directory a relative path is resolved against. Ignored for an absolute
  // path.
  string base_dir = 1;
  // Absolute, "~/"-prefixed, or relative to base_dir.
  string path = 2;
  // Maximum bytes of contents. Zero means 1 MiB. A text file (a text MIME type and no
  // NUL in the first 8 KiB) is always capped at 1 MiB whatever this asks; any other
  // file (images, PDFs, archives) is read up to this, at most 32 MiB.
  int64 max_bytes = 3;
}

message ReadFileResponse {
  // The first max_bytes of the file (zero: 1 MiB), at most 1 MiB for text and 32 MiB
  // for anything else.
  bytes contents = 1;
  // The file's full size in bytes.
  int64 size = 2;
  // size > len(contents).
  bool truncated = 3;
  // NUL in the first 8 KiB, or a MIME type that is not text (images, PDFs, archives).
  // Contents are returned anyway (the viewer shows images inline).
  bool binary = 4;
  // From the extension, else sniffed from the contents ("text/markdown",
  // "image/png", "text/plain; charset=utf-8", "application/octet-stream").
  string mime_type = 5;
  // Modification time, unix milliseconds.
  int64 modified_at = 6;
  // Absolute, cleaned path as asked for (before following symlinks).
  string resolved_path = 7;
  // Nothing exists at resolved_path; the other fields are empty.
  bool not_found = 8;
  // resolved_path is a directory; only size and modified_at are set.
  bool is_dir = 9;
}

message WriteFileRequest {
  // Absolute directory a relative path is resolved against. Ignored for an absolute
  // path.
  string base_dir = 1;
  // Absolute, "~/"-prefixed, or relative to base_dir.
  string path = 2;
  // The file's new contents, at most 1 MiB. Never logged.
  bytes contents = 3;
  // What the read saw: ReadFileResponse.modified_at, unix milliseconds. Ignored with
  // force or create.
  int64 modified_at = 4;
  // What the read saw: ReadFileResponse.size. Ignored with force or create.
  int64 size = 5;
  // Write whatever is there now (the viewer's Overwrite), even if the file is gone.
  bool force = 6;
  // Create a file that does not exist. Not with force.
  bool create = 7;
}

message WriteFileResponse {
  // Modification time, unix milliseconds: of the file as written, so a later edit's
  // baseline matches, or of the file found there on a conflict. Zero with not_found.
  int64 modified_at = 1;
  // Size in bytes: as modified_at. Zero with not_found.
  int64 size = 2;
  // Absolute, cleaned path as asked for (before following symlinks).
  string resolved_path = 3;
  // Nothing was written: the file is not what the request expected.
  bool conflict = 4;
  // With conflict: no file is at resolved_path (a symlink that leads nowhere counts).
  bool not_found = 5;
}

message PreviewFileRequest {
  // Absolute directory a relative path is resolved against. Ignored for an absolute
  // path.
  string base_dir = 1;
  // Absolute, "~/"-prefixed, or relative to base_dir.
  string path = 2;
}

message PreviewFileResponse {
  // Root-relative URL of the file on the daemon's loopback listener
  // ("/preview/<grant>/docs/index.html"); the GUI joins it to the daemon's base URL.
  string url = 1;
  // Absolute directory the grant serves: the checkout holding the file, else its
  // directory; the file itself when single_file.
  string scope = 2;
  // The grant serves only this file, not its directory: the directory is home, holds the
  // config home, or is otherwise too broad to hand a page (so its relative links to other
  // files do not load).
  bool single_file = 3;
}
