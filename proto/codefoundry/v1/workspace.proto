syntax = "proto3";

package codefoundry.v1;

import "google/protobuf/timestamp.proto";

// WorkspaceService manages workspaces: saved sets of projects with a place for the
// instructions and skills that span them (the managed dir). A workspace has no branch
// and no worktrees: a thread's project set and branch decide those
// (ThreadService.Checkouts). See docs/notes/workspaces-v2-handoff.md and
// docs/notes/workspaces-v2-2-workspaces.md.
service WorkspaceService {
  // List returns every workspace, sorted by name.
  rpc List(ListWorkspacesRequest) returns (ListWorkspacesResponse) {}
  // Create saves a workspace and makes its managed dir (for a rooted one, the symlinks
  // to the root's CLAUDE.md, AGENTS.md and .claude).
  rpc Create(CreateWorkspaceRequest) returns (CreateWorkspaceResponse) {}
  // AddProject adds a member project.
  rpc AddProject(AddWorkspaceProjectRequest) returns (AddWorkspaceProjectResponse) {}
  // RemoveProject drops a member project (nothing on disk changes). The default primary,
  // when it was the removed project, moves to the first member left of a synthetic
  // workspace, else to "workspace". The daemon does the same for a project that is
  // unregistered.
  rpc RemoveProject(RemoveWorkspaceProjectRequest) returns (RemoveWorkspaceProjectResponse) {}
  // Rename renames a workspace (names are unique, case-insensitively).
  rpc Rename(RenameWorkspaceRequest) returns (RenameWorkspaceResponse) {}
  // SetDefaultPrimary sets where new threads in the workspace start: a member project id,
  // or "workspace" (the managed dir, or the root of a rooted workspace).
  rpc SetDefaultPrimary(SetWorkspaceDefaultPrimaryRequest) returns (SetWorkspaceDefaultPrimaryResponse) {}
  // SetRoot points a rooted workspace at another folder (moved or renamed), validated
  // as Create's root_path; the managed dir's links are made again. A synthetic
  // workspace is FailedPrecondition.
  rpc SetRoot(SetWorkspaceRootRequest) returns (SetWorkspaceRootResponse) {}
  // Remove forgets a workspace. A synthetic one's managed dir is deleted with its
  // instructions and skills (FailedPrecondition, naming them, while a thread that is
  // not archived runs in it); a rooted one loses only the symlinks (the root is the
  // user's). Threads that reference it keep running without it.
  rpc Remove(RemoveWorkspaceRequest) returns (RemoveWorkspaceResponse) {}
  // Watch sends a snapshot, then every change. A client that falls behind gets a new
  // snapshot. Subscribing reads every workspace's folder again first (instructions,
  // skills, links), so hand edits show without a spawn.
  rpc Watch(WatchWorkspacesRequest) returns (stream WorkspaceEvent) {}
}

message Workspace {
  // "w-" + 12 hex digits.
  string id = 1;
  // Unique display name (case-insensitively); editable.
  string name = 2;
  // 3 was the v1 branch, 4 the v1 member worktrees.
  reserved 3, 4;
  reserved "branch";
  google.protobuf.Timestamp created_at = 5;
  // Member project ids, sorted by id.
  repeated string members = 6;
  // A real folder the workspace came from (its CLAUDE.md, AGENTS.md and .claude are
  // symlinked into the managed dir); empty for a synthetic workspace. Under home, never
  // home itself, and never in a registered project's checkout or worktree.
  string root_path = 7;
  // Where new threads start: a member project id, or "workspace" (managed_dir, or
  // root_path when set).
  string default_primary = 8;
  // <config home>/workspaces/<id>: given to every thread that references the workspace
  // as an --add-dir (unless it runs there), the place for its CLAUDE.md, AGENTS.md and
  // .claude/skills.
  string managed_dir = 9;
  // The workspace's instructions file: CLAUDE.md, else AGENTS.md (the first that is a
  // regular file), in root_path when set, else in the managed dir. Empty when there is
  // neither. Read from disk when the store builds the snapshot entry, at every
  // EnsureDirs (start, a spawn of a thread that references it), when such a thread ends
  // a turn and when a client subscribes to Watch.
  string instructions = 10;
  // The skills in .claude/skills of the same folder: the names of its folders that hold
  // a SKILL.md, sorted. Read like instructions.
  repeated string skills = 11;
  // root_path is set and is not a folder now (moved or renamed): SetRoot repairs it.
  bool root_missing = 12;
}

message ListWorkspacesRequest {}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message CreateWorkspaceRequest {
  string name = 1;
  // 2 was the v1 branch, 3 the v1 member specs, 4 and 5 their base and fetch.
  reserved 2, 3, 4, 5;
  reserved "branch", "base_ref", "fetch";
  // Projects (id, name when unique, or an absolute path inside one). At least one unless
  // root_path is set.
  repeated string members = 6;
  // An absolute folder under home; empty for a synthetic workspace.
  string root_path = 7;
  // A member (id or name) or "workspace". Empty: "workspace" for a rooted workspace,
  // else the first member given.
  string default_primary = 8;
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

message AddWorkspaceProjectRequest {
  // Workspace id or name.
  string workspace = 1;
  reserved 2, 4, 5;
  reserved "cwd", "base_ref", "fetch";
  // Project id, name (when unique), or a path inside it.
  string project = 3;
}

message AddWorkspaceProjectResponse {
  Workspace workspace = 1;
}

message RemoveWorkspaceProjectRequest {
  // Workspace id or name.
  string workspace = 1;
  reserved 2, 4, 5;
  reserved "cwd", "force", "delete_branch";
  // Project id or name (a member).
  string project = 3;
}

message RemoveWorkspaceProjectResponse {
  Workspace workspace = 1;
}

message RenameWorkspaceRequest {
  // Workspace id or name.
  string workspace = 1;
  string name = 2;
}

message RenameWorkspaceResponse {
  Workspace workspace = 1;
}

message SetWorkspaceDefaultPrimaryRequest {
  // Workspace id or name.
  string workspace = 1;
  // A member project (id or name), or "workspace".
  string default_primary = 2;
}

message SetWorkspaceDefaultPrimaryResponse {
  Workspace workspace = 1;
}

message SetWorkspaceRootRequest {
  // Workspace id or name.
  string workspace = 1;
  // The folder it lives in now: absolute, under home.
  string root_path = 2;
}

message SetWorkspaceRootResponse {
  Workspace workspace = 1;
}

message RemoveWorkspaceRequest {
  // Workspace id or name.
  string workspace = 1;
  reserved 2, 3;
  reserved "force", "delete_branch";
}

message RemoveWorkspaceResponse {}

message WatchWorkspacesRequest {}

message WorkspaceEvent {
  oneof event {
    WorkspaceSnapshot snapshot = 1;
    Workspace updated = 2;
    string removed_id = 3;
  }
}

message WorkspaceSnapshot {
  repeated Workspace workspaces = 1;
}
