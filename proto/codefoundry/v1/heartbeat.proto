syntax = "proto3";

package codefoundry.v1;

// StreamHeartbeat is sent on a long-lived server stream the GUI holds
// (ThreadService.WatchThread, TerminalService.Attach, EventService.Watch,
// EmberService.WatchBoard, PluginService.WatchSurface, DictationService.Watch and
// Session, SearchService.Watch and WatchRecent) once the stream has carried
// nothing else for 5 s (api.HeartbeatInterval). It carries no state and no seq.
//
// It is the stream's sign of life: a hung or stopped daemon keeps the socket open and
// sends nothing, so a client treats a stream that has gone silent for several intervals
// as dead and reconnects (docs/notes/ws-stall-workarounds.md).
message StreamHeartbeat {}
