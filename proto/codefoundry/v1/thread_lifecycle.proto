syntax = "proto3";

package codefoundry.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "codefoundry/v1/project.proto";

// Thread lifecycle messages: the thread record (Thread), its state and status, and the
// requests and events of ThreadService's lifecycle RPCs (Create, Fork, List, Get, Rename,
// Close, Reconnect, Remove, RunIn, Pin, Archive, Snooze, Label, Report, SetBudget, Watch,
// StageAttachment, ReadAttachment). The service itself is in thread.proto.

// PermissionMode maps to claude --permission-mode. Full access (bypassPermissions) is
// deliberately not offered.
enum PermissionMode {
  // Claude's default (manual).
  PERMISSION_MODE_UNSPECIFIED = 0;
  // --permission-mode manual: edits and commands are confirmed; reads, searches and
  // read-only commands run unconfirmed (Claude's own rules).
  PERMISSION_MODE_SUPERVISED = 1;
  // --permission-mode acceptEdits: file edits are accepted, the rest is confirmed.
  PERMISSION_MODE_ACCEPT_EDITS = 2;
  // --permission-mode auto: Claude's auto-mode classifier decides.
  PERMISSION_MODE_AUTO = 3;
}

// ThreadState is the lifecycle of the Claude process behind a thread. The daemon
// manages it (docs/notes/thread-lifecycle.md): a message starts a stopped thread, and a
// thread idle at its prompt past its prompt cache expiry stops. Users never need to know
// it; clients may use it internally (a thread that is STARTING has not answered yet).
enum ThreadState {
  THREAD_STATE_UNSPECIFIED = 0;
  // Process spawned, the stream-json initialize handshake not yet done. Messages sent
  // meanwhile wait for it.
  THREAD_STATE_STARTING = 1;
  // Claude is running.
  THREAD_STATE_CONNECTED = 2;
  // A stop is under way (idle, archive, snooze, remove); waiting for the process to
  // exit. A message sent meanwhile starts a new process once it has.
  THREAD_STATE_CLOSING = 3;
  // No process: stopped by the daemon (idle, archive, snooze), exited by Claude, crashed,
  // or not started since the daemon started. The next message starts it.
  THREAD_STATE_DISCONNECTED = 4;
}

// ThreadStatus is what Claude is doing, derived by observing output and the transcript.
enum ThreadStatus {
  THREAD_STATUS_UNSPECIFIED = 0;
  THREAD_STATUS_BUSY = 1;
  THREAD_STATUS_IDLE = 2;
  // Claude is waiting on the user: a permission prompt, a question, or a dialog.
  THREAD_STATUS_NEEDS_ATTENTION = 3;
  // The thread's process ended while Claude was working: status_reason "interrupted"
  // when it was closed or the daemon stopped mid-turn, "crashed" when it died or exited
  // on its own (no one stopped it); or
  // Claude did not start for a message (status_reason "did not start"; the timeline has
  // an error item saying why). Set only on a DISCONNECTED thread; the next start
  // replaces it. Claude-reported API errors stay NEEDS_ATTENTION "error: <code>".
  THREAD_STATUS_ERROR = 4;
}

// Projects: a thread has a project set (project_ids, sorted by id) and one primary
// (project_id and worktree_path: its cwd). The thread owns one checkout per member, by
// path (checkout_paths): in worktree mode (created_worktree) a git member's worktree the
// app made (or reused) for branch, a plain folder the folder; otherwise each member's own
// checkout. What a checkout has checked out is read from it (ThreadService.Checkouts,
// ProjectService's worktree at the path), never from the thread: a checkout whose branch
// moved is the same checkout. See docs/notes/thread-checkouts.md.
// A thread without a project (CreateThreadRequest.no_project) has an empty set and runs
// in the daemon's home directory. workspace_id is an optional reference to a workspace,
// independent of the set. Rows from before projects were required may also have an
// empty project_id with a worktree_path inside a project; clients may place those by the
// path. See docs/notes/workspaces-v2-1-threads.md.
message Thread {
  // Our stable id (survives reconnects).
  string id = 1;
  // Claude's own session id, once discovered from the transcript directory. Needed for
  // resume; empty until known.
  string claude_session_id = 2;
  // The primary: the project of the cwd. Empty for a thread without a project.
  string project_id = 3;
  // The project set, sorted by id, project_id included; empty for a thread without a
  // project. One entry for a single-project thread.
  repeated string project_ids = 68;
  // The cwd: the worktree claude runs in (the home directory for a thread without a
  // project).
  string worktree_path = 4;
  // Display name: a short natural title ("Fix the login redirect"). Auto-generated
  // unless the user named or renamed it.
  string name = 5;
  bool auto_named = 6;
  // name is provisional: the daemon derived it from the first prompt (its first line or
  // sentence, at most 48 characters) while the naming model works; the model's title
  // replaces it and clears this. A rename clears it too and is never replaced. False
  // with an empty name (a prompt of only an image). Persisted.
  bool name_provisional = 53;
  // Model and effort as passed to claude (e.g. "opus", "high"). Empty means claude's default.
  string model = 7;
  string effort = 8;
  // 9 was terminal_id (threads ran in a PTY until 2026-10-12).
  reserved 9;
  reserved "terminal_id";
  ThreadState state = 10;
  ThreadStatus status = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp last_activity_at = 13;
  // Exit code of the last process, valid when DISCONNECTED after a process ran.
  int32 exit_code = 14;
  // Why the thread is DISCONNECTED: "idle" (stopped at its prompt cache expiry),
  // "closed" (archive, snooze, remove), "exited", "crashed", "daemon stopped", "daemon
  // restarted", "spawn failed" (Claude did not start or never answered its handshake),
  // or empty. Internal detail for clients; the next message starts the thread whatever it
  // says.
  string disconnect_reason = 15;
  string last_error = 16;
  // Forked from this thread id, if any.
  string parent_id = 17;
  // Short explanation of status from the detector, e.g. "finished", "at prompt",
  // "permission: Do you want to proceed?", "snooze ended" (NEEDS_ATTENTION on a
  // disconnected thread whose snooze ran out; cleared like "finished" on a disconnected
  // thread, by the next start), "budget reached" (NEEDS_ATTENTION: the thread's cost
  // reached budget_usd mid-turn and the daemon interrupted Claude; cleared by the next
  // message, or once seen like "finished"), "wake limit" (NEEDS_ATTENTION: the thread's
  // wake subscriptions woke it 60 times within an hour and further wakes are dropped;
  // cleared by the next message, or once seen), or "interrupted" / "crashed" / "did not
  // start" for ERROR. Persisted with status: a DISCONNECTED thread keeps the status and reason it had when its process
  // ended (a busy one becomes ERROR "interrupted", or "crashed" when its process died on
  // its own, or IDLE "archived" when an archive stopped it), across daemon restarts. Empty when
  // unknown.
  string status_reason = 18;
  // Permission mode passed to claude; re-passed on Reconnect.
  PermissionMode permission_mode = 19;
  // Ref the thread's worktree branch was created from, when Create made the worktree.
  string base_ref = 20;
  // Worktree mode: every git member works in its worktree on branch, made at spawn when
  // missing and removed by an archive when nothing else has it. False: checkout mode,
  // each member in its own checkout.
  bool created_worktree = 21;
  // The branch the thread was created for, a record: a worktree-mode thread's (with
  // created_worktree; a fork, and a thread placed like it, has the copied thread's).
  // When a cleanup removed a member's worktree, a start of the thread makes it again on
  // this branch at the same path. Not what its checkouts have checked out now: that is
  // each one's HEAD (ThreadCheckout.branch; moved when they differ). Empty in checkout
  // mode.
  string branch = 52;
  // An optional reference to a workspace (its instructions and skills), independent of
  // project_ids; empty without one. Until the workspace store's reshape, a spawn also
  // gets --add-dir for the referenced workspace's member worktrees.
  string workspace_id = 22;
  // Member worktree a queued RunIn will move the thread to once it is idle; empty when
  // nothing is queued. Not persisted: a thread that disconnects first moves its row
  // there instead.
  string pending_worktree_path = 23;
  // The user pinned the thread (ThreadService.Pin). Persisted.
  bool pinned = 24;
  // Pull requests Claude linked to the conversation. Source: the "pr-link" records Claude
  // Code writes to its transcript whenever it sees a pull request for the
  // repository (created in the conversation, by a subagent, or named in a prompt). Claude
  // re-emits the record at nearly every turn and it can flip back to an earlier pull
  // request, so this is every distinct URL (deduplicated by URL) in first-seen order;
  // entries are never removed. A reconnected thread is backfilled from its transcript's
  // history. Also included: the links of the threads it created (created_by,
  // transitively), and the pull requests whose head is a branch the thread works on (its
  // worktree's or each workspace member's) in the project's repository, as the GitHub
  // store's cached lists know them. Persisted. See docs/notes/linked-prs.md,
  // linked-prs-children.md and linked-prs-branch.md.
  repeated LinkedPullRequest linked_pull_requests = 25;
  // When status or status_reason last changed. Persisted with them; unset if never
  // known (a row from before status persistence).
  google.protobuf.Timestamp status_changed_at = 26;
  // Token usage of the thread: one bucket per (model, tier, speed, UTC day), sorted by
  // day, model, tier, speed. A pure fold over the assistant records (each API request
  // counted once) of every transcript the thread has used (a /clear starts a new one)
  // and of every subagent run under them (agent_runs); a reconnect rescans them all
  // from the start and replaces it. Persisted. See docs/notes/session-usage.md.
  repeated UsageBucket usage = 27;
  // The price of usage in USD at first-party Claude API rates, computed when sent
  // (never stored). Excludes unpriced buckets.
  double cost_usd = 28;
  // Some bucket's model (or tier, or speed) has no known rate: cost_usd is a lower
  // bound and the UI says "unpriced" rather than showing $0 for it.
  bool unpriced = 29;
  // The thread's subagent runs, by start time (unknown last). Their usage is included
  // in usage. The count of runs is the length. Persisted.
  repeated AgentRun agent_runs = 30;
  // 31 was render (terminal | rendered) until 2026-10-12; every thread is rendered now.
  reserved 31;
  reserved "render";
  // An effort change (ThreadService.SetEffort) not applied yet: effort is
  // the new level, and Claude restarts with it (--resume) once the running turn ends.
  // Never set on a thread that is not running (its next start passes the row's
  // effort). Not persisted.
  bool effort_pending = 32;
  // The thread's context size after its last turn: the last top-level API
  // response's input + cache read + cache write + output tokens (Claude Code's own
  // definition, what get_context_usage reports as totalTokens). Re-sent on the next
  // message: read from cache while it is warm, written again once it expired. 0 before
  // the first result. Persisted. See
  // docs/notes/rendered-threads-cold-cache.md.
  int64 context_tokens = 33;
  // The context window of the thread's current model (Thread.model) in tokens, from the
  // daemon's model registry (internal/model); 0 when the registry does not list the
  // model. context_tokens over it is how full the context is.
  int64 context_window = 71;
  // When the prompt cache of the thread's conversation expires: its last result
  // plus the threads.cache_ttl_seconds setting (the cache refreshes on every hit, so
  // the last request is what counts). Recomputed when the setting changes. Unset
  // before the first result.
  google.protobuf.Timestamp cache_expires_at = 34;
  // What re-reading context_tokens costs once the cache expired: context_tokens at the
  // cache-write rate of the model that answered the last turn (the 1 h rate when the
  // TTL is over 5 minutes, else the 5 min rate), first-party Claude API prices,
  // computed when sent. 0 when the model has no known rate.
  double context_reread_usd = 35;
  // Set while Claude waits to retry a failed API request (a 429, a 529, a 5xx, a
  // connection error); unset once any other frame follows or the process ends. Not
  // persisted. See docs/notes/api-retry-note.md.
  ApiRetry retry = 36;
  // When the user archived the thread (ThreadService.Archive); unset when it is not
  // archived. An archived thread is disconnected, unpinned and has no shells; the GUI
  // lists it apart. Reconnect, Pin (pinned) and Send clear it. Persisted.
  google.protobuf.Timestamp archived_at = 37;
  // When a snoozed thread wakes (ThreadService.Snooze); unset when it is not snoozed.
  // A snoozed thread is disconnected, unpinned, not archived and has no shells; the GUI
  // lists it apart. The daemon checks the wall clock (every 30 s and at startup, so a
  // snooze that ended while the Mac slept or the daemon was stopped wakes as soon as it
  // can): waking clears this field and sets status NEEDS_ATTENTION with status_reason
  // "snooze ended". Reconnect, Pin (pinned), Send and Archive (archived) clear it.
  // Persisted.
  google.protobuf.Timestamp snoozed_until = 38;
  // Subagent runs still running: all of them (nested ones too), and those the thread
  // launched in the background itself (spawn depth 1, run_in_background), which run on
  // after its turn ends. The thread's runs in detail: ThreadItemsSnapshot.agents. See
  // docs/notes/agents-1-daemon.md.
  int32 agents_running = 39;
  int32 background_agents_running = 40;
  // The thread's own background shells still running: Bash calls with
  // run_in_background and Monitor calls, which run on after its turn ends (a subagent's
  // shells are not counted). They die with the thread's process, so 0 once it ended
  // and after a daemon restart. See docs/notes/background-shells.md.
  int32 background_shells_running = 41;
  // A background shell or agent run ended while Claude was at its prompt, and the turn
  // Claude starts by itself to report it has not ended yet (a few seconds at most).
  // Stopping Claude now loses that report: archive, snooze and restarts confirm it like
  // running background work. Not persisted. See docs/notes/thread-lifecycle.md.
  bool background_wake_pending = 42;
  // The thread whose agent created this one (thread.new run from that thread's Claude:
  // the CLI sends $CODE_FOUNDRY_THREAD); empty when the user made it. Set once at
  // Create; Fork does not set it. The creator may since have been removed.
  string created_by = 43;
  // The creator's display name (its id when it had none) when this thread was created,
  // kept verbatim when the creator is renamed, archived or removed.
  string created_by_name = 44;
  // What the thread was started for, in its creator's words (thread.new --brief):
  // trimmed, at most 500 characters, empty when none. Persisted.
  string brief = 45;
  // Labels: lowercase tokens of letters, digits and - _ . / (1 to 40 characters each,
  // at most 32), deduplicated and sorted. Set at Create and by Label. Persisted.
  repeated string labels = 46;
  // The thread's latest report (Report; thread.report): its agent saying how its task
  // went. A new report replaces the previous one. UNSPECIFIED with the other report
  // fields empty when the thread never reported. Persisted.
  ThreadReportStatus report_status = 47;
  // At most 1000 characters.
  string report_summary = 48;
  // A JSON object (compacted), at most 16 KiB; empty when the report had none.
  string report_data = 49;
  // When the report was made; unset when none.
  google.protobuf.Timestamp report_at = 50;
  // Spending limit in USD at the same first-party API rates as cost_usd; 0 for none.
  // When cost_usd first reaches it while Claude is working, the daemon interrupts the
  // turn, sets NEEDS_ATTENTION "budget reached" and appends a note to the thread. Once
  // per budget value: setting a budget above the cost re-arms it. Messages can still be
  // sent. Set at Create and by SetBudget. Persisted.
  double budget_usd = 51;
  // Flags plugins raised on the thread (thread/setFlag; docs/notes/plugins-3-events-flags-env.md):
  // at most one per plugin, an overlay on status that never changes it. The GUI counts a
  // flagged thread as needing attention (error flags sort with errors) and shows the
  // top flag's reason on the row. Cleared by the plugin, when the plugin is disabled or
  // removed, when the thread is archived, and for until_seen flags when the thread is
  // opened. Persisted. Sorted by level (error first), then newest first.
  repeated ThreadFlag flags = 54;
  // Who owns the thread when the user does not: "plugin:<name>" for a plugin's thread
  // (thread/create; docs/notes/plugins-6-thread-terminal.md). Owned threads are hidden:
  // not in the sidebar, attention counts, dock alerts, the Threads panel or lineage, and
  // left out of a filtered List unless filter.all or filter.owner asks for them. Their
  // usage still counts. Set once at Create. Empty for the user's threads.
  string owner = 55;
  // The plugins' session environment for the thread's scope changed since its running
  // Claude process started (a plugin pushed new values, or was enabled, disabled or
  // removed): the process still has the old one, and ThreadService.Restart applies the
  // new one. The daemon compares a fingerprint of what the process got (keys, hashed
  // values, PATH entries, add-dirs); setting the same values again is no change. Cleared
  // by the next spawn or restart and when the process ends. Never set on a thread that
  // is not running. Not persisted. See docs/notes/plugins-env-restart.md.
  bool plugin_env_stale = 56;
  // With plugin_env_stale, what changed, by plugin display name and variable names,
  // never values: "GitHub Actions added 2 variables", "Hello removed CF_HELLO". Empty
  // otherwise.
  string plugin_env_change = 57;
  // The thread the caller runs in (its context thread, $CODE_FOUNDRY_THREAD): set by the
  // thread.list command on that row of its answer, so an agent tells its own thread from
  // another's. Never set by ThreadService.
  bool is_caller = 58;
  // The request a "permission: …" or "question: …" status describes; set by
  // ThreadService.Get with with_detail only.
  ThreadPendingDetail pending = 59;
  // The report was made before the thread's last message (a follow-up or a wake), so it
  // describes an older turn: the wake's report_stale rule. Set by ThreadService.Get with
  // with_detail only.
  bool report_stale = 60;
  // How far below ThreadFilter.descendants_of the thread is (0: that thread, 1: a
  // thread it created); set by a List with that filter only.
  optional int32 depth = 61;
  // Whether a thread another thread created (created_by set) is shown in the GUI's
  // sidebar: the per-thread override of the threads.show_created_threads setting
  // (ThreadService.SetSidebar, thread.sidebar, thread.new --sidebar). Unset follows the
  // setting; always unset on a thread the user created. Persisted.
  //
  // Effective visibility, the one rule (the daemon's thread.Thread.InSidebar; the GUI
  // reimplements it from created_by, in_sidebar and the setting):
  //   created_by empty  -> shown (the user's own thread);
  //   in_sidebar set    -> in_sidebar;
  //   otherwise         -> threads.show_created_threads (default false: hidden).
  // A shown thread is the user's to manage; a hidden one its creator's: it stays out of
  // the sidebar and the Dock badge, is listed in its creator's Threads tab, and is
  // archived with its creator (ThreadService.Archive). See
  // docs/notes/hidden-children-1-daemon.md.
  optional bool in_sidebar = 62;
  // What kind of thread it is. RESIDENT: the daemon's own long-lived agent thread
  // (resident_name names it; one per name), made by the daemon only. A resident thread has
  // no project or worktree (it runs in its own directory), is never auto-named, and
  // cannot be archived, snoozed, removed or forked (FAILED_PRECONDITION). It is left out
  // of a filtered List unless filter.include_resident or filter.all asks for it, and
  // clients keep it out of the user's lists (sidebar, attention counts, dock alerts);
  // Watch and Get carry it. Set once. See docs/notes/ember-1-primitives.md.
  ThreadKind kind = 63;
  // With kind RESIDENT: its name ("ember"). Empty otherwise.
  string resident_name = 64;
  // The thread's session epoch: 1 until its first ThreadService.Reseed, then one more per
  // reseed. Persisted.
  int32 epoch = 65;
  // A reseed (ThreadService.Reseed) waits for the running turn to end: Claude still runs
  // the old session and stops once it is back at its prompt with nothing running; the
  // next message starts the fresh one. Set until the old process is gone, also while
  // it closes for the reseed. Never set on a stopped thread (its next start is fresh).
  // Not persisted.
  bool reseed_pending = 66;
  // A reseed's prefix waits for the fresh session's first message (it is prepended to
  // what Claude gets; UserMessageItem.seed_prefix shows it). Persisted.
  bool seed_pending = 67;
  // The thread is stopped and Claude Code deleted its conversation's transcript (its
  // cleanupPeriodDays setting), so it cannot continue: a message, a fork and the queries
  // that would start Claude fail with FAILED_PRECONDITION. A reseed clears it (the next
  // start is fresh); archive and remove work. Computed at daemon start and when the
  // process ends, never per snapshot; not persisted. See docs/notes/transcript-deleted.md.
  bool transcript_missing = 69;
  // Every member's checkout, the thread's own, in project id order: one per project_ids
  // entry, the primary's path is worktree_path. An empty path is a member with none
  // recorded yet (a thread from before checkouts were recorded, or a worktree missing
  // when they were), which the next start resolves and records. What each has checked
  // out is ProjectService's worktree at the path. See docs/notes/thread-checkouts.md.
  repeated ThreadCheckoutPath checkout_paths = 70;
}

// One member's checkout as the thread records it (Thread.checkout_paths).
message ThreadCheckoutPath {
  string project_id = 1;
  string path = 2;
}

// ThreadKind is what kind of thread a Thread is.
enum ThreadKind {
  // An ordinary thread (the user's, another thread's or a plugin's).
  THREAD_KIND_UNSPECIFIED = 0;
  // A resident thread: the daemon's own long-lived agent (Thread.kind).
  THREAD_KIND_RESIDENT = 1;
}

// ThreadFlagLevel is how loud a plugin's flag is.
enum ThreadFlagLevel {
  THREAD_FLAG_LEVEL_UNSPECIFIED = 0;
  // Amber: the thread needs the user.
  THREAD_FLAG_LEVEL_ATTENTION = 1;
  // Red: something failed.
  THREAD_FLAG_LEVEL_ERROR = 2;
}

// ThreadFlag is one plugin's flag on a thread (Thread.flags).
message ThreadFlag {
  // The plugin's name ("gh-actions").
  string plugin = 1;
  // Its display name when the flag was set ("GitHub Actions"): the GUI writes the reason
  // as "<display name>: <reason>".
  string plugin_display_name = 2;
  ThreadFlagLevel level = 3;
  // One line, at most 80 characters ("deploy failed").
  string reason = 4;
  google.protobuf.Timestamp set_at = 5;
  // Cleared when the user opens the thread (a WatchThread stream starts), or at once
  // when one is open.
  bool until_seen = 6;
}

// How a thread's task went, as its agent reports it (Thread.report_status).
enum ThreadReportStatus {
  THREAD_REPORT_STATUS_UNSPECIFIED = 0;
  // The task is done.
  THREAD_REPORT_STATUS_DONE = 1;
  // The agent cannot go on without help (an answer, an access, a decision).
  THREAD_REPORT_STATUS_BLOCKED = 2;
  // The task failed.
  THREAD_REPORT_STATUS_FAILED = 3;
  // Work in progress: an intermediate report.
  THREAD_REPORT_STATUS_PROGRESS = 4;
}

// ApiRetry is a thread's pending API retry: Claude's system/api_retry frame.
message ApiRetry {
  // Counts from 1 to max_retries.
  int32 attempt = 1;
  int32 max_retries = 2;
  // When the retry is due.
  google.protobuf.Timestamp retry_at = 3;
  // The HTTP status of the failed request; 0 for a connection error with no response.
  int32 error_status = 4;
  // Claude's category: "rate_limit", "overloaded", "server_error", ...
  string error = 5;
}

// Whether a subagent run is still running (ThreadAgentRun.status in detail).
enum AgentRunStatus {
  AGENT_RUN_STATUS_UNSPECIFIED = 0;
  // Running: its end has not been reported yet (a background run runs on after the
  // turn).
  AGENT_RUN_STATUS_OPEN = 1;
  // It ended (completed, failed, stopped), its process ended first, or it was idle past
  // the safety net.
  AGENT_RUN_STATUS_CLOSED = 2;
}

// One subagent run of a thread (Thread.agent_runs): a Claude Code Agent tool call,
// with its own transcript.
message AgentRun {
  // Claude's agent id.
  string id = 1;
  string description = 2;
  // "general-purpose", "Explore", ...
  string agent_type = 3;
  // As requested, e.g. "haiku"; empty when inherited from the thread.
  string model = 4;
  string effort = 5;
  // Launched in the background (run_in_background).
  bool background = 6;
  AgentRunStatus status = 7;
  // 1: spawned by the thread; 2 and up: by another run.
  int32 spawn_depth = 8;
  // Time of the run's first record; unset if unknown.
  google.protobuf.Timestamp started_at = 9;
  // The run's own usage, sorted like Thread.usage, priced the same way.
  repeated UsageBucket usage = 10;
  double cost_usd = 11;
  bool unpriced = 12;
}

// Token counters for one model on one UTC day (of one thread, or of the retired
// ledger).
message UsageBucket {
  // Canonical model id as Claude wrote it, e.g. "claude-opus-5-5".
  string model = 1;
  // "" or "long" (Claude Haiku 5.5 requests whose prompt is over 100K tokens).
  string tier = 2;
  // "" (standard) or "fast".
  string speed = 3;
  // UTC date "YYYY-MM-DD" of the requests; "unknown" when a record had no timestamp.
  string day = 4;
  int64 requests = 5;
  int64 input = 6;
  // Includes thinking tokens.
  int64 output = 7;
  int64 cache_read = 8;
  int64 cache_write_5m = 9;
  int64 cache_write_1h = 10;
  // The bucket's price in USD; 0 when unpriced.
  double cost_usd = 11;
  // The bucket's (model, tier, speed) has no known rate.
  bool unpriced = 12;
  // cost_usd split by token kind (the side panel's token table); all 0 when unpriced.
  double input_cost_usd = 13;
  double output_cost_usd = 14;
  double cache_read_cost_usd = 15;
  double cache_write_5m_cost_usd = 16;
  double cache_write_1h_cost_usd = 17;
  // What the bucket's cache reads saved in USD: cache_read x (input rate - cache read
  // rate) at the bucket's (model, tier, speed). 0 when unpriced.
  double cache_savings_usd = 18;
}

// A pull request linked to a thread (Thread.linked_pull_requests).
message LinkedPullRequest {
  string slug = 1; // "owner/name"
  int32 number = 2;
  string url = 3;
  // The first pr-link record for url (when it was seen, if the record had no time); a
  // child thread's link keeps its time; a branch link has the pull request's creation.
  google.protobuf.Timestamp linked_at = 4;
}

message CreateThreadRequest {
  string project_id = 1;
  string worktree_path = 2;
  string model = 3;
  string effort = 4;
  // Optional explicit name; disables auto-naming.
  string name = 5;
  // Optional first prompt, sent as the thread's first user message once Claude has
  // started (attachments as image or document blocks).
  string initial_prompt = 6;
  PermissionMode permission_mode = 7;
  // When set, Create makes a new worktree for the thread before claude starts and
  // worktree_path is ignored. The branch is cf/<slug>, the slug of the explicit name,
  // else of the title named from initial_prompt (bounded wait), else cf/<thread id>.
  NewWorktree new_worktree = 8;
  // Paths returned by StageAttachment, appended to initial_prompt.
  repeated string attachments = 9;
  // Workspace (id or name) the thread references (Thread.workspace_id): its instructions
  // and skills reach the thread. Without project_ids its members are the set. The primary
  // is project_id, else the workspace's default_primary, else the first member;
  // "workspace" as project_id (or as the default) runs the thread in the workspace's
  // managed dir, or its root when it has one, with every member as an --add-dir.
  string workspace_id = 10;
  // 11 was new_workspace (a v1 branch-set workspace made with the thread) until the
  // workspace reshape (docs/notes/workspaces-v2-2-workspaces.md).
  reserved 11;
  reserved "new_workspace";
  // 12 was render until 2026-10-12.
  reserved 12;
  reserved "render";
  // The composer's text of initial_prompt, kept on the first user message for display
  // (ThreadItem UserMessageItem.composer_text).
  string composer_prompt = 13;
  // When set, the thread has no project: it runs in the daemon's home directory with an
  // empty project_id and workspace_id (see the ownership rule on Thread). Exclusive with
  // project_id, worktree_path, new_worktree and workspace_id
  // (InvalidArgument). RunIn refuses such a thread; Fork and Reconnect keep its cwd.
  bool no_project = 14;
  // The thread whose agent asks for this one (Thread.created_by); it must exist
  // (INVALID_ARGUMENT otherwise). The CLI sends $CODE_FOUNDRY_THREAD; the GUI never
  // sets it. The daemon writes a "Created by <name> · brief: <brief>" note as the new
  // thread's first item.
  string created_by = 15;
  // Thread.brief: trimmed, at most 500 characters (INVALID_ARGUMENT otherwise).
  string brief = 16;
  // Thread.labels: each validated (lowercased first), then deduplicated and sorted.
  repeated string labels = 17;
  // Thread.budget_usd; 0 for none, never negative.
  double budget_usd = 18;
  // With created_by: also subscribe the creator to the new thread, condition SETTLED,
  // repeat (ThreadService.Subscribe), so the creator's agent is woken each time the new
  // thread settles. INVALID_ARGUMENT without created_by. See
  // docs/notes/agents-4-wake.md.
  bool notify = 19;
  // An idempotency key (at most 128 characters): a Create with a key its creator
  // (created_by, or the user when empty) already used within the last 24 hours returns
  // the thread that first Create made (CreateThreadResponse.reused) and starts nothing;
  // the repeat's other fields are ignored. A Create still making the thread for the
  // key is waited for. Persisted (a removed thread forgets its key). See
  // docs/notes/agents-5-cli.md.
  string request_id = 20;
  // Thread.in_sidebar at creation: show (true) or hide (false) the new thread in the
  // sidebar whatever the threads.show_created_threads setting says. Only with
  // created_by (INVALID_ARGUMENT otherwise). Unset follows the setting.
  optional bool in_sidebar = 21;
  // model (effort) was filled from the user's settings, not chosen: the CLI's thread.new
  // without --model (--effort) sets it. A thread Ember (or a thread below it) creates then
  // runs on Ember's worker model (effort) instead, as with an empty one
  // (docs/notes/ember-2-store.md). An explicit model always wins.
  bool model_defaulted = 22;
  bool effort_defaulted = 23;
  // Appended to Claude's system prompt on every spawn of the thread (Thread's own append,
  // as ReseedThreadRequest.system_prompt_append sets it): context the model needs that is
  // not the user's words, so it stays out of the first message (theme.ask's "the user
  // asked on the Themes page"). At most 64 KiB, no NUL. Empty: none.
  string system_prompt_append = 24;
  // The project set (id, name when unique, or an absolute path inside one; with
  // new_worktree "<project>:<base ref>" gives that member its own base). project_id,
  // when set, is the primary and must be in it; otherwise the first listed is. Every
  // member's checkout is derived (Thread): with new_worktree, a worktree on one new
  // branch in every git member, made in parallel (one failure fails the Create, naming
  // the project). Empty: project_id's alone, or a copied thread's (like_thread_id, or the
  // creating thread, or workspace_id's members). Not with no_project.
  repeated string project_ids = 25;
  // Copy the project set, branch, primary, workspace reference and mode from this
  // thread ("New thread on this branch"): project_ids narrows the set, project_id picks
  // the primary (it must be in the set), new_worktree or new_branch branches off,
  // checkout_mode leaves worktree mode. Without it, a Create with created_by copies the
  // same from its creator unless project_id or worktree_path name a place outside the
  // creator's set (docs/notes/workspaces-v2-1-threads.md).
  string like_thread_id = 26;
  // With like_thread_id (or a creating thread with a project): a new branch for the same
  // set, in worktree mode, named as new_worktree's.
  bool new_branch = 27;
  // Run every member in its own checkout even when the copied thread is in worktree mode
  // (thread new --new-worktree=false). Not with new_worktree or new_branch.
  bool checkout_mode = 28;
}

message NewWorktree {
  // Ref to branch from. Defaults to the default branch; projects.base_from_origin
  // (CreateWorktreeRequest.base_ref) says whether that, or a bare branch name, is
  // origin's copy unless the local branch is ahead of it. Ignored when branch names an
  // existing branch.
  string base_ref = 1;
  // Steers the branch. With a "/" it is the branch, verbatim; without one it is the
  // slug the projects.branch_naming mode wraps (<prefix>/<slug>, <type>/<slug>, or a
  // hint to custom instructions). An existing branch (local or on origin) is checked
  // out rather than suffixed. Empty: generated from the naming model's reply, else
  // cf/<thread id>.
  string branch = 2;
  // Overrides projects.base_from_origin for this worktree, as
  // CreateWorktreeRequest.base_from_origin. Unset: the setting.
  optional bool base_from_origin = 3;
}

message StageAttachmentRequest {
  // Original file name (for the extension only).
  string name = 1;
  // image/png, image/jpeg, image/gif, image/webp or application/pdf.
  string mime_type = 2;
  bytes data = 3;
  // A PDF's page count as the client counted it (0 = unknown). A hint: the daemon
  // counts with pdfinfo when it is installed, else takes this, else estimates one
  // page per 100 KiB. The count is settled once, here, and recorded in the returned
  // path (<32 hex>-<N>p.pdf, or <32 hex>-~<N>p.pdf for an estimate), so every
  // message that sends the PDF agrees on it.
  uint32 pages = 4;
  // Absolute path of a file to stage instead of `data`; `mime_type` and `name` may be
  // empty, the daemon sniffs the type and takes the name from the path. Exactly one of
  // `data` and `path` is set. The daemon reads the file as its own user: a relative
  // path or a directory is INVALID_ARGUMENT, a missing file NOT_FOUND, and content of
  // an unsupported type fails like an unsupported `mime_type`. Types, size limits and
  // page handling are those of `data`.
  string path = 5;
}

message StageAttachmentResponse {
  string path = 1;
}

message ReadAttachmentRequest {
  // A path StageAttachment returned.
  string path = 1;
}

message ReadAttachmentResponse {
  bytes data = 1;
  // Sniffed from the content: image/png, image/jpeg, image/gif, image/webp or
  // application/pdf.
  string mime_type = 2;
}

message CreateThreadResponse {
  Thread thread = 1;
  // The request_id was seen before: thread is the one made then; nothing new started.
  bool reused = 2;
  // Collision hints, one line each, never a refusal: a member checkout another thread
  // that is not archived also has ("<name> @ <branch> is also open in <thread>"), or in
  // worktree mode a plain-folder member another thread also works in ("<name> is a
  // folder, not a repo: thread <thread> also works there"). The CLI prints them on
  // stderr.
  repeated string hints = 3;
  // What the placement did with the primary, for the CLI's summary (not set when
  // reused). made_worktree: this create made the primary's worktree (from
  // thread.base_ref). existing_worktree: it existed and is reused; shared_with is then
  // another thread that is not archived with it as a checkout ("<name> (<id>)"), empty
  // when none. Neither: the primary is not a worktree (a folder, a workspace's folder,
  // a checkout-mode checkout).
  bool made_worktree = 4;
  bool existing_worktree = 5;
  string shared_with = 6;
  // The copied thread works in worktrees, but the projects given have no git, so this
  // one runs in their folders (checkout mode).
  bool worktree_mode_dropped = 7;
  // With made_worktree: its branch was made too (from thread.base_ref); false: an
  // existing branch, local or origin's, was checked out.
  bool made_branch = 8;
}

message ForkThreadRequest {
  string id = 1;
  string name = 2;
}

message ForkThreadResponse {
  Thread thread = 1;
