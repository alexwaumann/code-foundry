message ListThreadsRequest {
  // Unset: every thread, in creation order, and the retired usage ledger (what the
  // GUI and the daemon's own callers want). Set: the threads that match it, ordered by
  // last activity, newest first (thread.list; docs/notes/agents-5-cli.md).
  ThreadFilter filter = 1;
}

// ThreadFilter selects threads for ListThreadsRequest. Every set field must match.
message ThreadFilter {
  // Every thread, archived ones included (like include_archived), and the retired
  // usage ledger; the fields below still apply.
  bool all = 1;
  // Include archived threads (default: they are left out).
  bool include_archived = 2;
  // Only threads with this status (UNSPECIFIED: any).
  ThreadStatus status = 3;
  // Only threads in this state (UNSPECIFIED: any).
  ThreadState state = 4;
  // Only threads whose cwd is in this project: an id, a name when exactly one
  // project has it, or an absolute path inside one of its worktrees
  // (INVALID_ARGUMENT when it names none or several).
  string project = 5;
  // Only threads owned by this workspace: an id or a name (INVALID_ARGUMENT when it
  // names none).
  string workspace = 6;
  // Only threads created by this thread (Thread.created_by), or "user" for threads no
  // thread created.
  string created_by = 7;
  // Only threads carrying every one of these labels.
  repeated string labels = 8;
  // At most this many threads (the most recently active); 0: no limit.
  int32 limit = 9;
  // Only threads with this owner ("plugin:hello"), or with "plugin:" any plugin's.
  // Without it (and without all) owned threads are left out.
  string owner = 10;
  // Also answer with the threads removed within the last 24 hours that match
  // (ListThreadsResponse.removed): created_by, labels, project, workspace and owner
  // apply; a status or state leaves every removed thread out; limit applies to them
  // separately. thread.reports --all and thread.list --all set it.
  bool include_removed = 11;
  // Only this thread (by id) and the threads below it: those it created, those they
  // created, and so on, at most 8 levels down; the other fields still apply. The answer
  // is in tree order (each thread before the ones it created, siblings oldest first;
  // limit still keeps the most recently active), with Thread.depth set and
  // ListThreadsResponse.totals. Removed threads are not listed (include_removed adds
  // none), but a removed thread's children are still below its creator.
  string descendants_of = 12;
  // Only the threads that archiving this thread (by id) archives with it
  // (ThreadService.Archive): the threads below it that are not shown in the sidebar
  // (Thread.in_sidebar's rule), reached through hidden threads only (a shown thread and
  // everything below it is left out), at most 8 levels down, in tree order with
  // Thread.depth set. The thread itself is not listed. Archived ones are left out unless
  // include_archived or all; the other fields still apply. Not with descendants_of
  // (INVALID_ARGUMENT).
  string archive_cascade_of = 13;
  // Also list resident threads (Thread.kind RESIDENT); all lists them too.
  bool include_resident = 14;
}

message ListThreadsResponse {
  repeated Thread threads = 1;
  // Usage of removed threads (see ThreadListSnapshot.retired_usage).
  repeated UsageBucket retired_usage = 2;
  // With ThreadFilter.include_removed: the matching removed threads, the most
  // recently removed first.
  repeated RemovedThread removed = 3;
  // With ThreadFilter.descendants_of: the count and summed cost of the threads listed.
  ThreadTotals totals = 4;
}

// ThreadTotals sums a list of threads (ListThreadsResponse.totals).
message ThreadTotals {
  int32 threads = 1;
  // The sum of their Thread.cost_usd.
  double cost_usd = 2;
}

// RemovedThread is what the daemon keeps of a thread removed within the last 24 hours,
// in memory (a daemon restart forgets it): for the agent that created it, waits on it
// or reads its report. A NOT_FOUND for such an id carries one as an error detail.
message RemovedThread {
  string id = 1;
  string name = 2;
  // As Thread.created_by: the creator's id, empty when the user made it.
  string created_by = 3;
  repeated string labels = 4;
  string project_id = 5;
  google.protobuf.Timestamp removed_at = 6;
  // The thread's last report, as on Thread (report_status UNSPECIFIED when none).
  ThreadReportStatus report_status = 7;
  string report_summary = 8;
  string report_data = 9;
  google.protobuf.Timestamp report_at = 10;
  // What the thread cost and its budget when it was removed, as on Thread.
  double cost_usd = 11;
  bool unpriced = 12;
  double budget_usd = 13;
}

message GetThreadRequest {
  string id = 1;
  // Also read the thread's items for Thread.pending and report_stale (thread.get,
  // thread.reports): the detail a wake carries. Unset leaves them empty and reads
  // nothing.
  bool with_detail = 2;
}

// ThreadPendingDetail is the request a NEEDS_ATTENTION "permission: …" or "question: …"
// status describes, as a wake's JSON carries it: what thread.respond needs.
message ThreadPendingDetail {
  // "permission" or "question".
  string kind = 1;
  string request_id = 2;
  string tool = 3;
  // The tool's input: its JSON, or when longer than 4 KiB its head as a string with a
  // marker (thread.read --full has it whole).
  google.protobuf.Value input = 4;
  // A question's first question and its option labels (what --answer takes);
  // questions lists every one when it asks more than one.
  string question = 5;
  repeated string options = 6;
  repeated ThreadPendingQuestion questions = 7;
}

message ThreadPendingQuestion {
  string question = 1;
  repeated string options = 2;
}

message GetThreadResponse {
  Thread thread = 1;
}

// ThreadWaitCondition is what ThreadService.Wait waits for. Each is a fact about the
// Thread record (state, status, status_reason), checked at once and on every change.
// A connected thread's "permission: …" or "question: …" status counts only while a
// request is still pending in its items: the status is published after a short
// debounce, so a wait right after an answer would otherwise return on the answered one.
enum ThreadWaitCondition {
  // Means SETTLED, the CLI's default (GUI, CLI and daemon are always one version).
  THREAD_WAIT_CONDITION_UNSPECIFIED = 0;
  // Claude is not working and no answer is pending: the thread is not STARTING and its
  // status is IDLE, ERROR (the process ended mid-turn), or NEEDS_ATTENTION for anything
  // but a pending permission prompt or question (a turn that ended unseen, "finished"
  // or "error: <code>"; a snooze that ended).
  THREAD_WAIT_CONDITION_IDLE = 1;
  // status NEEDS_ATTENTION, whatever the reason.
  THREAD_WAIT_CONDITION_ATTENTION = 2;
  // status ERROR.
  THREAD_WAIT_CONDITION_ERROR = 3;
  // state DISCONNECTED (no Claude process).
  THREAD_WAIT_CONDITION_DISCONNECTED = 4;
  // IDLE or ATTENTION: Claude stopped working; its turn ended, or it asks for a
  // permission or an answer (the wake subscriptions' settled).
  THREAD_WAIT_CONDITION_SETTLED = 5;
}

message WaitThreadRequest {
  string id = 1;
  ThreadWaitCondition until = 2;
  // How long to wait. Unset or zero: until the call is cancelled.
  google.protobuf.Duration timeout = 3;
  // An item of the thread (its id, or its ordinal in decimal): the condition counts
  // only once Claude has reacted after that item, that is once a top-level turn end,
  // error, permission request or question item follows it. Waiting with after set to a
  // message just sent therefore never returns for the status of the turn before it.
  // NOT_FOUND for an id that is not the thread's. Empty: the thread's latest top-level
  // user message (a wake message included), so a wait right after a send is race-free;
  // no check for a thread with no message.
  string after = 4;
}

message WaitThreadResponse {
  // The thread when the condition held, or when the timeout passed.
  Thread thread = 1;
  // The timeout passed before the condition held; thread is the current record.
  bool timed_out = 2;
  // The thread was removed, before the wait or while it waited (a thread being removed
  // meets no condition): thread is unset and this is what is known of it.
  RemovedThread removed = 3;
}

