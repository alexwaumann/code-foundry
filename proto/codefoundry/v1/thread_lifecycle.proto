message ThreadCheckoutsRequest {
  // Thread id. Empty: the thread one of whose checkouts holds cwd.
  string id = 1;
  // An absolute path: finds the thread when id is empty, and marks the checkout holding
  // it as current.
  string cwd = 2;
}

// ThreadCheckout is one member of a thread's project set and its checkout: the path the
// thread records (Thread.checkout_paths), and what is checked out there now, read from
// the project store's worktree at the path (the same status the Projects page shows, kept
// fresh by its file events and its live tier; no other git command).
message ThreadCheckout {
  string project_id = 1;
  // Empty when the project is no longer registered.
  string project_name = 2;
  // The thread's checkout: the recorded path, else for a member with none recorded where
  // its next start puts it. Empty when nothing is recorded and the project is no longer
  // registered.
  string path = 3;
  // The branch checked out there now (HEAD). Empty when detached, for a plain folder, and
  // when the project does not list a worktree at the path (missing).
  string branch = 4;
  // The thread's cwd.
  bool primary = 5;
  // The path does not exist (a worktree not made yet, or removed).
  bool missing = 6;
  // The request's cwd is in this checkout (the deepest), else, without a cwd, the
  // primary.
  bool current = 7;
  // <path>/CLAUDE.md when it exists; empty otherwise.
  string instructions = 8;
  // The project has git; false for a plain folder (one checkout, shared by every thread).
  bool git = 9;
  // A worktree-mode git member, never the project's main checkout: when it is missing a
  // start makes the member's worktree again on created_branch, at the default path for
  // it (the same path when the worktree was made there; the cwd always keeps its path),
  // and records where it went; an archive may remove it (never its branch). Was derived.
  bool worktree_mode = 10;
  // The commit checked out (HEAD); empty when unknown or on an unborn branch.
  string head = 11;
  // HEAD is not on a branch.
  bool detached = 12;
  // The project's main checkout (its own folder), not a linked worktree; a plain folder's
  // one checkout too.
  bool is_main = 13;
  // The project store's status of the checkout: upstream, ahead/behind it, changes, the
  // git operation in progress (rebase, merge, cherry-pick, ...). Unset when the project
  // does not list a worktree at the path.
  GitStatus status = 14;
  // With worktree_mode: the branch the thread was created for (Thread.branch), which a
  // missing worktree is made on again. moved: the checkout has another branch checked
  // out now, or is detached (git switch in it, a stacked branch): still the thread's
  // checkout.
  string created_branch = 15;
  bool moved = 16;
}

message CheckPlacementRequest {
  // Project ids or names, as CreateThreadRequest.project_ids ("<ref>[:<base>]").
  repeated string project_ids = 1;
  // The branch a new worktree asks for (NewWorktree.branch): with a slash, or an existing
  // branch's name, it is used as is; a slug is wrapped by the branch naming settings.
  // Empty: the namer names it at Create.
  string branch = 2;
  // In place: each project's own checkout (checkout_mode on Create); else new worktrees.
  bool checkout_mode = 3;
}

enum PlacementOutcome {
  PLACEMENT_OUTCOME_UNSPECIFIED = 0;
  // A new worktree would be made at path (empty while the branch is named at Create).
  PLACEMENT_OUTCOME_NEW = 1;
  // The thread would work in the existing checkout at path, on branch: the branch's
  // worktree (another thread may use it), or in checkout mode the project's own checkout.
  PLACEMENT_OUTCOME_SHARE = 2;
  // A plain folder (no git): threads run in it.
  PLACEMENT_OUTCOME_FOLDER = 3;
  // Create would be refused; message is its error.
  PLACEMENT_OUTCOME_REFUSED = 4;
}

message MemberPlacement {
  string project_id = 1;
  string project_name = 2;
  PlacementOutcome outcome = 3;
  // NEW: the new worktree's path and branch; SHARE: the checkout and its HEAD branch
  // (empty when detached); FOLDER: the folder.
  string path = 4;
  string branch = 5;
  // REFUSED: Create's error message.
  string message = 6;
}

message CheckPlacementResponse {
  // The branch a worktree-mode Create would use. Empty in checkout mode, and when
  // branch_named_at_create (the namer picks it from the prompt).
  string branch = 1;
  bool branch_named_at_create = 2;
  // One per project, in project id order.
  repeated MemberPlacement members = 3;
}

message ThreadCheckoutsResponse {
  Thread thread = 1;
  // One per project in the thread's set, in project id order.
  repeated ThreadCheckout checkouts = 2;
  // The thread's workspace reference (Thread.workspace_id) and its name; empty without
