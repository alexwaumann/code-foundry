syntax = "proto3";

package codefoundry.v1;

import "codefoundry/v1/command.proto";
import "codefoundry/v1/plugin.proto";

// UiService lets the daemon (and the CLI through it) steer a running GUI.
service UiService {
  // WatchIntents is held open by the GUI. Intents are fan-out: every watcher gets each.
  rpc WatchIntents(WatchIntentsRequest) returns (stream UiIntent) {}
  // PublishTheme records the GUI's active theme and its resolved slots, so pages the model
  // writes can paint in it: the loopback listener serves it as GET /cf/theme.css and
  // /cf/theme.json (docs/notes/theme-css-route.md). The GUI calls it on connect and on
  // every theme change. One per daemon, in memory: with several windows the last writer
  // wins (the theme is one per user). InvalidArgument for a bad id, scheme, name or value.
  rpc PublishTheme(PublishThemeRequest) returns (PublishThemeResponse) {}
  // GetTheme is the theme as last published, for a window that does not run the theme
  // engine (the dictation overlay): the same answer as /cf/theme.json, on the API listener.
  // Before the first publish it is GitHub Dark with published false.
  rpc GetTheme(GetThemeRequest) returns (GetThemeResponse) {}
  // PublishThemeReport records the GUI's contrast report on the user's themes
  // (docs/notes/theme-followups.md): the daemon derives no colour, so the GUI resolves each
  // user theme it is sent and reports the pairs that fall short and the stale pins, keyed
  // by the file's version (UserTheme.version). theme save waits briefly for the report on
  // the file it wrote and prints it; theme check prints the latest. In memory, the last
  // report per theme id wins. The GUI sends every report it holds on connect, then each
  // new one, debounced. InvalidArgument for a bad id, version, slot name or value.
  rpc PublishThemeReport(PublishThemeReportRequest) returns (PublishThemeReportResponse) {}
  // WatchShots is held open by the app's host, the one capturer of screenshots
  // (PluginService.ShotSurface; docs/notes/plugin-surface-shot-daemon.md): it sends each
  // request to draw and snapshot, and the host answers with PublishShot. One capturer at a
  // time: a new stream replaces the one before it, whose open requests fail.
  rpc WatchShots(WatchShotsRequest) returns (stream ShotRequest) {}
  // PublishShot answers a ShotRequest by its id with a PNG or an error. NotFound for an id
  // no one waits on any more (timed out or never asked), ResourceExhausted for a PNG over
  // 32 MiB, InvalidArgument for bytes that are not a PNG or an answer with neither.
  rpc PublishShot(PublishShotRequest) returns (PublishShotResponse) {}
}

// ThemeContrastIssue is one pair of resolved slots that falls short (the GUI's
// src/themes/contrastPairs.ts).
message ThemeContrastIssue {
  // The slot drawn on top ("--cf-warning-text").
  string slot = 1;
  // The slot it sits on ("--cf-warning-surface").
  string against = 2;
  // The pair in words: "--cf-warning-text on --cf-warning-surface over --cf-surface".
  string label = 3;
  // The WCAG ratio it has, and the one it must reach.
  double ratio = 4;
  double required = 5;
}

// ThemeStalePin is a pinned slot whose rule now derives another colour than when it was
// pinned: the base moved under it (src/themes/contrast.ts staleOverrides).
message ThemeStalePin {
  string slot = 1;
  // The pinned value, what the slot derived when pinned, and what it derives now.
  string pinned = 2;
  string basis = 3;
  string derived = 4;
}

// ThemeReport is the GUI's report on one version of one user theme.
message ThemeReport {
  string id = 1;
  // UserTheme.version of the file the report was computed on.
  string version = 2;
  repeated ThemeContrastIssue issues = 3;
  repeated ThemeStalePin stale = 4;
}

message PublishThemeReportRequest {
  // One per theme; several on connect.
  repeated ThemeReport reports = 1;
}

message PublishThemeReportResponse {}

message WatchShotsRequest {}

// ShotRequest asks the app's host to draw a plugin surface in a hidden window of the
// viewport's size and snapshot it (ShotSurfaceRequest, with an id).
message ShotRequest {
  string id = 1;
  SurfaceRef ref = 2;
  string instance = 3;
  uint64 min_version = 4;
  // CSS pixels, within ShotSurfaceRequest's bounds.
  int32 width = 5;
  int32 height = 6;
}

message PublishShotRequest {
  // The ShotRequest's id.
  string id = 1;
  // The PNG; or error.
  bytes png = 2;
  // Why there is no PNG, in words ("the surface sent no view").
  string error = 3;
  // How tall the view's content is in CSS pixels.
  int32 content_height = 4;
}

message PublishShotResponse {}

message PublishThemeRequest {
  // The theme's id ("github-dark"): lowercase letters, digits and dashes.
  string id = 1;
  // "dark" or "light".
  string scheme = 2;
  // Every resolved slot: "--cf-*", "--terminal-*", "--syn-*" and "--sh-*" names to
  // "#rrggbb" or "#rrggbbaa" (gui/frontend/src/themes/slots.ts resolveSlots).
  map<string, string> vars = 3;
}

message PublishThemeResponse {}

message GetThemeRequest {}

// GetThemeResponse is the theme PublishThemeRequest last carried.
message GetThemeResponse {
  string id = 1;
  string scheme = 2;
  map<string, string> vars = 3;
  // False until the GUI has published: the defaults.
  bool published = 4;
}

message WatchIntentsRequest {}

message UiIntent {
  oneof intent {
    FocusTerminal focus_terminal = 1;
    FocusProject focus_project = 2;
    OpenPalette open_palette = 3;
    Notify notify = 4;
    FocusThread focus_thread = 5;
    ShowView show_view = 6;
    PlayAlertSound play_alert_sound = 7;
    ShowAgentRun show_agent_run = 8;
    InvokeCommand invoke_command = 9;
    StageComposer stage_composer = 10;
  }

  // StageComposer puts text in a thread's composer without sending it (composer.stage,
  // a page's "Ask Claude about this" button): a window that shows the thread replaces
  // its draft when the draft is empty, else adds the text on a new line after it, and
  // focuses the prompt. A window that does not show the thread ignores it; the user
  // reads, edits and sends the text themselves.
  message StageComposer {
    string thread_id = 1;
    string text = 2;
  }

  // InvokeCommand asks the GUI to run a command through its normal flow (runCommand):
  // a command that asks first shows the daemon's own confirm dialog, and the user
  // decides. A plugin's host/invoke with confirm "ask" sends it (caller
  // "plugin:<name>"); the plugin learns the outcome from events.
  message InvokeCommand {
    string name = 1;
    map<string, string> args = 2;
    UiContext context = 3;
    // Who asked ("plugin:hello"), for the dialog.
    string caller = 4;
  }

  // ShowAgentRun selects a thread and shows one of its own subagent runs (spawn depth 1)
  // read-only in the content pane, its prompt, work and report (thread.agent.open). The
  // thread stays the selection. A run the window does not know (or a deeper one) leaves
  // the thread showing.
  message ShowAgentRun {
    string thread_id = 1;
    // The run's id (ThreadAgentRun.id, Claude's agent id).
    string run_id = 2;
  }

  // PlayAlertSound plays the attention alert sound once (notifications.test, a preview:
  // regardless of focus, the alert cooldown and the notifications.sound toggle).
  message PlayAlertSound {
    // Percent of the Mac's output volume, 0-100; 0 plays nothing.
    int32 volume = 1;
  }

  // ShowView opens a named GUI view: "help", "settings", "usage". "settings.<page
  // id>" opens Settings on that page (view.settings --page); "project.add" opens the Add
  // Project dialog (project.add without a path). Unknown names are ignored.
  message ShowView {
    string name = 1;
    // thread_id scoped a classic side panel's action to one thread; the item verbs open
    // tabs of the layout instead (docs/notes/shell-22-retire-verbs.md).
    reserved 2;
    reserved "thread_id";
    // What the view shows, for the names that take more than the name: an agent search
    // (search.open), a full screen pane, the dictation hold's phase, the move picker's
    // thread. Each name's keys are documented with its name's constant in
    // internal/command. Empty for every other name.
    map<string, string> params = 3;
  }

  message FocusThread {
    string thread_id = 1;
    // Someone asked for this thread (thread.focus): the
    // window selects it even when it is a hidden child, which a non-explicit FocusThread
    // (a thread-starting verb's) leaves alone so an agent's threads never take the view.
    bool explicit = 2;
  }

  message FocusTerminal {
    string terminal_id = 1;
  }

  message FocusProject {
    string project_id = 1;
    string worktree_path = 2;
  }

  message OpenPalette {
    // Pre-filled query text.
    string query = 1;
  }

  message Notify {
    enum Level {
      LEVEL_UNSPECIFIED = 0;
      LEVEL_INFO = 1;
      LEVEL_WARNING = 2;
      LEVEL_ERROR = 3;
    }
    Level level = 1;
    string title = 2;
    string body = 3;
    // Where the notification leads, shown as a button on it; a window ignores a target it
    // does not know. "settings:<page id>" opens that Settings page ("settings:memory":
    // the app memory's "Remembered: ..." and "Forgot: ..." toasts). Empty: no button.
    string link = 4;
    // The button's words ("Show in Settings"); empty: "Open".
    string link_label = 5;
    // A second button, before the first, in the same form ("theme-edit:<id>", "Edit"): a
    // theme a thread applied offers Edit beside Undo. Empty: none.
    string secondary_link = 6;
    string secondary_link_label = 7;
    // A page id ("themes"): a window showing that page skips the notification, since the
    // page already shows the change. Empty: every window shows it.
    string unless_showing = 8;
  }
}
