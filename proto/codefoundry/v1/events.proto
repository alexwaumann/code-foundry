syntax = "proto3";

package codefoundry.v1;

import "codefoundry/v1/action.proto";
import "codefoundry/v1/gh.proto";
import "codefoundry/v1/gitops.proto";
import "codefoundry/v1/heartbeat.proto";
import "codefoundry/v1/plugin.proto";
import "codefoundry/v1/project.proto";
import "codefoundry/v1/settings.proto";
import "codefoundry/v1/skill.proto";
import "codefoundry/v1/terminal.proto";
import "codefoundry/v1/thread.proto";
import "codefoundry/v1/thread_lifecycle.proto";
import "codefoundry/v1/ui.proto";
import "codefoundry/v1/update.proto";
import "codefoundry/v1/workspace.proto";

// EventService multiplexes every store's Watch stream and UI intents onto one server
// stream. Browsers reach the daemon over HTTP/1.1 with a 6-connection-per-origin limit,
// so the GUI holds exactly one of these instead of one Watch per service. The per-service
// Watch RPCs remain for the CLI and tests.
service EventService {
  // Watch streams all events. Each store's snapshot event is sent first, in the order
  // project, workspace, terminal, thread list, thread, gh, gitops, settings, update, action, plugin, skill, so a
  // client can replace its state wholesale on connect.
  rpc Watch(WatchEventsRequest) returns (stream Event) {}
  // SetClientState updates what a GUI client's open Watch stream reported about itself
  // (WatchEventsRequest.client_id): a stream request cannot change once open. NotFound
  // when no open stream has that client_id.
  rpc SetClientState(SetClientStateRequest) returns (SetClientStateResponse) {}
}

message WatchEventsRequest {
  // Subset of sources to include. Empty means all.
  repeated EventSource sources = 1;
  // Resume after this Event.seq (the last one the client applied). When the daemon
  // still holds every live event after it (it keeps the last 4096), the stream skips
  // the snapshots and replays those events (of the requested sources), then goes on
  // live. Otherwise (too old, or ahead of the daemon's counter, as after a daemon
  // restart) the stream starts as without it: snapshots, then live. A client tells the
  // two apart by the first event: a replayed or live event has seq > 0, a snapshot 0.
  // Zero: no resume.
  uint64 since_seq = 2;
  // The Event.epoch since_seq was read under. When set and not the daemon's current
  // epoch (the daemon restarted since), since_seq is ignored and the stream starts with
  // snapshots. Empty: since_seq alone decides (after a restart a seq below the new
  // counter would "resume" with unrelated events; pass the epoch).
  string since_epoch = 3;
  // Who is watching. Only GUI clients count toward the daemon's presence, which paces
  // the GitHub poll: a visible GUI polls at github.poll_interval_seconds, only hidden
  // ones every 5 minutes, none every 15 (docs/notes/gh-poll-tiers.md).
  ClientKind client_kind = 4;
  // A token the client makes up for this stream, naming it in SetClientState. A GUI
  // stream without one counts with the visibility it opened with.
  string client_id = 5;
  // Whether the client's window is visible now (GUI: document.visibilityState).
  bool visible = 6;
  // Whether the client's window is key now, so keystrokes go to it (GUI:
  // document.hasFocus()). A GUI client that is both visible and focused makes the
  // daemon's presence "attended": only then does an open thread view count as the
  // user seeing what Claude produces (docs/notes/alerts-foreground.md).
  bool focused = 7;
}

enum ClientKind {
  CLIENT_KIND_UNSPECIFIED = 0;
  // The desktop app's window.
  CLIENT_KIND_GUI = 1;
  // The code-foundry CLI (events verb, scripts). Not counted.
  CLIENT_KIND_CLI = 2;
}

message SetClientStateRequest {
  // WatchEventsRequest.client_id of an open stream.
  string client_id = 1;
  // As WatchEventsRequest.visible.
  bool visible = 2;
  // As WatchEventsRequest.focused.
  bool focused = 3;
}

message SetClientStateResponse {}

enum EventSource {
  EVENT_SOURCE_UNSPECIFIED = 0;
  EVENT_SOURCE_PROJECT = 1;
  EVENT_SOURCE_TERMINAL = 2;
  EVENT_SOURCE_THREAD_LIST = 3;
  EVENT_SOURCE_GH = 4;
  EVENT_SOURCE_UI = 5;
  EVENT_SOURCE_GITOPS = 6;
  // Settings snapshots; sent after gitops, before update.
  EVENT_SOURCE_SETTINGS = 7;
  // Phase 3d. Numbered 10 to stay clear of the parallel Phase 3 steps. Sent after
  // settings, before UI intents.
  EVENT_SOURCE_UPDATE = 10;
  // Workspaces (branch sets). Sent right after project, before terminal: members name
  // projects, and threads name workspaces.
  EVENT_SOURCE_WORKSPACE = 11;
  // Rendered threads' pending requests (permission prompts and questions), for
  // every rendered thread: a ThreadPendingSnapshot (right after the thread list), then a
  // ThreadEvent.pending per change. A thread's items come only from
  // ThreadService.ListItems or WatchThread; this source never carries them.
  EVENT_SOURCE_THREAD = 12;
  // Actions and their runs: an ActionEvent snapshot (after update), then changes and
  // run_finished. Runs never carry their output here.
  EVENT_SOURCE_ACTION = 13;
  // Plugins: a PluginEvent snapshot (after action), then updated / removed_name.
  EVENT_SOURCE_PLUGIN = 14;
  // The Skills marketplace: a SkillEvent with the current epoch (after plugin), then
  // each new epoch (SkillService.Watch).
  EVENT_SOURCE_SKILL = 15;
}

message Event {
  oneof event {
    ProjectEvent project = 1;
    TerminalEvent terminal = 2;
    ThreadListEvent thread_list = 3;
    GhEvent gh = 4;
    UiIntent ui = 5;
    GitOpsEvent gitops = 6;
    SettingsEvent settings = 7;
    // Update status (snapshot: the current status) and relaunch requests.
    UpdateEvent update = 10;
    // Workspaces: a snapshot, then updated / removed_id.
    WorkspaceEvent workspace = 11;
    // Rendered threads: pending_snapshot, then pending (never items or deltas).
    ThreadEvent thread = 12;
    // Nothing else was sent for a while (see StreamHeartbeat).
    StreamHeartbeat heartbeat = 13;
    // Actions: a snapshot, then updated / removed_id / run_updated / run_removed_id /
    // run_finished.
    ActionEvent action = 14;
    // Plugins: a snapshot, then updated / removed_name.
    PluginEvent plugin = 15;
    // The Skills marketplace: its epoch, on connect and per read.
    SkillEvent skill = 16;
  }
  // Position of a live event in the daemon's one event sequence: 1, 2, 3, ... per
  // daemon lifetime, shared by every client and source (the same event has the same
  // seq on every stream; a stream filtered by source sees gaps). Snapshots, resyncs
  // and heartbeats carry 0: they are not resumable. Pass the last seq applied as
  // WatchEventsRequest.since_seq to resume.
  uint64 seq = 20;
  // The daemon instance the event comes from: a random id drawn when the daemon
  // starts, the same on every event of its lifetime (snapshots and heartbeats too).
  // seq values compare only within one epoch: pass it as
  // WatchEventsRequest.since_epoch with since_seq.
  string epoch = 21;
}
