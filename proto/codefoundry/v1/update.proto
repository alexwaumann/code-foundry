syntax = "proto3";

package codefoundry.v1;

import "google/protobuf/timestamp.proto";

// UpdateService is the in-app updater. The daemon checks the latest GitHub release of
// the build's release repository through the user's authenticated `gh` (30s after start,
// then every 24h) and runs the installer embedded in the binary in two steps. Download
// (`app.update`) fetches, verifies and stages the release beside the app directory
// without changing the install, so a window reopened meanwhile still matches its daemon
// (GUI and daemon have no cross-version compatibility). Nothing restarts by itself,
// because restarting the daemon stops every thread's Claude. `app.restart` (the GUI's "Restart
// Now") applies a download in one step: Install swaps it into the app directory, then
// RequestRestart announces RestartRequested on Watch and the daemon exits; GUI hosts
// relaunch once their Watch stream ends, and the relaunched window auto-starts the
// installed daemon. `app.relaunch` (Relaunch) and `daemon.restart` restart the two
// halves separately.
//
// Dev builds (version not strict semver) and builds without a release repository do
// not check: Get reports enabled=false with the reason.
service UpdateService {
  // Get returns the current update status.
  rpc Get(GetUpdateStatusRequest) returns (GetUpdateStatusResponse) {}
  // Check asks GitHub for the latest release now and returns the resulting status. A
  // failed check keeps the previous state and sets last_check_error. FailedPrecondition
  // when updates are disabled.
  rpc Check(CheckForUpdateRequest) returns (CheckForUpdateResponse) {}
  // Download starts downloading and staging the available version and returns at once
  // with state DOWNLOADING; progress and the outcome (DOWNLOADED or FAILED) arrive on
  // Watch. Nothing on disk changes outside the staging directory. FailedPrecondition
  // unless the state is AVAILABLE or FAILED.
  rpc Download(DownloadUpdateRequest) returns (DownloadUpdateResponse) {}
  // Install installs the downloaded version into the app directory and returns when done
  // (fast: no network) with state INSTALLED, or an error and state FAILED.
  // FailedPrecondition unless the state is DOWNLOADED. `app.restart` calls it right
  // before restarting so the daemon and the window change version together; clients
  // should invoke `app.restart`, not this.
  rpc Install(InstallUpdateRequest) returns (InstallUpdateResponse) {}
  // Relaunch asks every connected GUI to relaunch itself (to pick up an installed
  // update). Moves INSTALLED to RESTART_REQUIRED.
  rpc Relaunch(RelaunchAppRequest) returns (RelaunchAppResponse) {}
  // RequestRestart tells every connected GUI that the daemon is about to restart: each
  // relaunches once its Watch stream ends. It does not restart anything itself and does
  // not change the status; the `app.restart` command calls it right before stopping the
  // daemon. Clients wanting a restart invoke `app.restart`, not this.
  rpc RequestRestart(RequestRestartRequest) returns (RequestRestartResponse) {}
  // Watch streams the status on connect and on every change, plus relaunch and restart
  // requests.
  rpc Watch(WatchUpdateRequest) returns (stream UpdateEvent) {}
}

enum UpdateState {
  UPDATE_STATE_UNSPECIFIED = 0;
  // Up to date, never checked, or updates disabled.
  UPDATE_STATE_IDLE = 1;
  // target_version is newer than what is running and installed.
  UPDATE_STATE_AVAILABLE = 2;
  // The installer is downloading and staging target_version beside the app directory;
  // nothing on disk changes yet.
  UPDATE_STATE_DOWNLOADING = 3;
  // The install on disk is newer than the running daemon: target_version was installed
  // (by Install, or outside the app) and the GUI needs a relaunch and the daemon a
  // restart to run it (`app.restart` does both).
  UPDATE_STATE_INSTALLED = 4;
  // As INSTALLED, and the GUI was asked to relaunch; the daemon still runs
  // current_version until `daemon.restart` (or `app.restart`).
  UPDATE_STATE_RESTART_REQUIRED = 5;
  // Downloading or installing target_version failed (failure_reason). Download may be
  // retried.
  UPDATE_STATE_FAILED = 6;
  // target_version is downloaded and staged; the install on disk is unchanged.
  // `app.restart` installs it and restarts the daemon and the window together.
  UPDATE_STATE_DOWNLOADED = 7;
}

message UpdateStatus {
  UpdateState state = 1;
  // Version of the running daemon, e.g. "v0.1.0" (or "dev").
  string current_version = 2;
  // False for dev builds and builds without a release repository.
  bool enabled = 3;
  // Why updates are disabled, e.g. "dev build".
  string disabled_reason = 4;
  // "owner/name" of the GitHub repository releases come from.
  string release_repo = 5;
  // A check is in flight.
  bool checking = 6;
  // When the last check completed (successfully or not). Unset: never checked.
  google.protobuf.Timestamp last_checked_at = 7;
  // The last check's error, cleared by a successful check.
  string last_check_error = 8;
  // Latest release tag of the channel seen by the last successful check ("" until the
  // first check after a channel change).
  string latest_version = 9;
  // The version AVAILABLE / DOWNLOADING / DOWNLOADED / INSTALLED / RESTART_REQUIRED /
  // FAILED refer to.
  string target_version = 10;
  // Release page for target_version.
  string notes_url = 11;
  // DOWNLOADING: the installer's latest output line.
  string progress = 12;
  // FAILED: why, usually the installer's last output lines.
  string failure_reason = 13;
  // Release channel the updater follows (the update.channel setting): "stable" (the
  // newest full release) or "tip" (the highest release, prereleases included). Never
  // offers a downgrade: on stable, latest_version may be older than current_version
  // after a switch from tip, and the next stable release above it is offered.
  string channel = 14;
}

// RelaunchRequested asks connected GUIs to relaunch themselves.
message RelaunchRequested {}

// RestartRequested says the daemon is about to exit to restart into the installed
// version (`app.restart`). A GUI relaunches once its Watch stream ends (the daemon is
// gone), so the new window auto-starts the new daemon instead of reconnecting to the
// dying one.
message RestartRequested {}

message UpdateEvent {
  oneof event {
    UpdateStatus status = 1;
    RelaunchRequested relaunch_requested = 2;
    RestartRequested restart_requested = 3;
  }
}

message GetUpdateStatusRequest {}

message GetUpdateStatusResponse {
  UpdateStatus status = 1;
}

message CheckForUpdateRequest {}

message CheckForUpdateResponse {
  UpdateStatus status = 1;
}

message DownloadUpdateRequest {}

message DownloadUpdateResponse {
  UpdateStatus status = 1;
}

message InstallUpdateRequest {}

message InstallUpdateResponse {
  UpdateStatus status = 1;
}

message RelaunchAppRequest {}

message RelaunchAppResponse {
  // GUIs that received the request.
  int32 delivered = 1;
}

message RequestRestartRequest {}

message RequestRestartResponse {
  // GUIs that received the request.
  int32 delivered = 1;
}

message WatchUpdateRequest {}
